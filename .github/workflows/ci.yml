# Every pull request runs this. A module is text and config, not code, so what
# there is to check is whether it is VALID and whether it is HONEST about
# itself — which is exactly what the validator in this repo checks.
#
# `deploy` publishes to GitHub Pages, but only once `check` has passed on
# main — this repo's Pages source is set to "GitHub Actions", not "a branch",
# specifically so a broken push can never go live unchecked (Ben, 2026-09-29).
# Repo setting: Settings → Pages → Build and deployment → Source →
# "GitHub Actions" (was "Deploy from a branch").
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The generated files are stamped with the git COMMIT TIME of their
          # inputs, so that they are byte-identical in every clone. A shallow
          # checkout has no commit for those paths, `git log -- <file>` returns
          # nothing, and the stamp silently falls back to file mtime — which in
          # CI is the moment of checkout. Full history, or the freshness checks
          # fail on every run for a reason that looks like nothing.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Every check, the same way a person runs them
        # test/run.sh runs the linter over every booklet and every
        # test/*.test.js it finds. It exits 1 if any of them fails and prints that one in full.
        run: bash test/run.sh
        env:
          # The browser scripts run in their own job below, so the required
          # `check` is unchanged.
          PLAYWRIGHT_SKIP: '1'

  # Every test/*-browser.js script, in a real Chromium. A separate job, not a
  # step of `check`, so the required check does not wait on a browser download.
  # Split four ways, side by side: part N takes every fourth script in name
  # order, so together the parts run each script exactly once, and a script
  # added later joins a part with no edit here. Run one after another, the
  # scripts took 26m32s (main, 2026-10-24).
  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm i --no-save playwright
      - run: npx playwright install --with-deps chromium
      - name: Browser scripts, part ${{ matrix.part }} of 4
        run: |
          names=$(ls test/*-browser.js | sed 's#^test/##; s#-browser\.js$##' | awk -v p=${{ matrix.part }} 'NR % 4 == p % 4')
          # run-browser.sh runs every script when given no names, so an empty part is an error
          [ -n "$names" ] || { echo "part ${{ matrix.part }} has no scripts"; exit 1; }
          echo "part ${{ matrix.part }}:" $names
          bash test/run-browser.sh booklet.html $names
      # the one-file build (test/one-file.js): the checks that protect the promise, on the renderer with every part inside it
      - if: matrix.part == 1
        run: node test/one-file.js build/booklet.html
      - if: matrix.part == 1
        run: bash test/run-browser.sh build/booklet.html pledge figures libwake mermaid filepage themes

  # Publishes booklet.html, examples/, docs, etc. — the
  # whole repo root, exactly as the old "Deploy from a branch" source did
  # (.nojekyll already turns off Jekyll processing either way). Only runs
  # after `check` passes, and only on a real push to main — never on a PR.
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4

# Every pull request runs this. A module is text and config, not code, so what
# there is to check is whether it is VALID and whether it is HONEST about
# itself — which is exactly what the validator in this repo checks.
#
# `deploy` publishes to GitHub Pages, but only once `check` has passed on
# main — this repo's Pages source is set to "GitHub Actions", not "a branch",
# specifically so a broken push can never go live unchecked (Ben, 2026-09-29).
# Repo setting: Settings → Pages → Build and deployment → Source →
# "GitHub Actions" (was "Deploy from a branch").
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The generated files are stamped with the git COMMIT TIME of their
          # inputs, so that they are byte-identical in every clone. A shallow
          # checkout has no commit for those paths, `git log -- <file>` returns
          # nothing, and the stamp silently falls back to file mtime — which in
          # CI is the moment of checkout. Full history, or the freshness checks
          # fail on every run for a reason that looks like nothing.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: Every check, the same way a person runs them
        # test/run.sh runs the linter over every booklet and every
        # test/*.test.js it finds. It exits 1 if any of them fails and prints that one in full.
        run: bash test/run.sh

  # Publishes booklet.html, examples/, docs, etc. — the
  # whole repo root, exactly as the old "Deploy from a branch" source did
  # (.nojekyll already turns off Jekyll processing either way). Only runs
  # after `check` passes, and only on a real push to main — never on a PR.
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4

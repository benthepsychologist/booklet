<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Booklet</title>
<!-- Installable when this file is served over https, which is what makes the
     phone keep its data (Safari does not evict storage for a Home Screen web
     app the way it does for a tab) and what turns on the share sheet.
     Opened straight from disk the manifest simply 404s and nothing else
     changes — the page has never needed the network for anything. -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#12996E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Booklet">
<link rel="apple-touch-icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="96" fill="%23FFFCF4"/><circle cx="256" cy="256" r="150" fill="none" stroke="%2312996E" stroke-width="26"/><path d="M330 182l-47 113-113 47 47-113z" fill="%2312996E"/></svg>'>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="96" fill="%23FFFCF4"/><circle cx="256" cy="256" r="150" fill="none" stroke="%2312996E" stroke-width="26"/><path d="M330 182l-47 113-113 47 47-113z" fill="%2312996E"/></svg>'>
<style>
  /* ── Petrol, Paper & Clay ──────────────────────────────────────────────
     The site's palette, and its discipline: paper dominates, petrol is the
     ONLY action colour, clay is a sparse human accent — an eyebrow, a step
     marker — never a competing action colour. The tool used to give each
     activity its own accent; that is exactly the "competing action colour"
     the site's design system rules out, so every activity is petrol now.

     The four quadrant colours stay distinct, because they are data rather
     than chrome: a reader tells them apart by hue. They are retuned to sit
     on paper rather than on the old off-white. */
  :root{
    --paper:#F7F2E8; --paper-deep:#EEE6DA; --ink:#292421; --muted:#59514B;
    --rule:#D8C9B5; --field:#FFFFFF; --reader:#292421; --warn:#A04E34;
    --petrol:#103E46; --petrol-deep:#0B3137; --clay:#A04E34;
    /* four palette tones, used for messages, tags and card accents. They are
       not a quadrant vocabulary: what colour a grid cell takes is the widget's. */
    --tone-warm:#F0D9CF; --tone-warm-deep:#A04E34;
    --tone-green:#DCE7D2; --tone-green-deep:#4F6B3A;
    --tone-slate:#D9DEE2; --tone-slate-deep:#465B66;
    --tone-teal:#D5E3E1; --tone-teal-deep:#166B63;
    --accent:var(--petrol); --accent-soft:#E3EAEA;
    --note:#EEE6DA;
    /* The site's faces, named but never fetched: this page makes no external
       request of any kind, and a visitor arriving from the site already has
       them. Anywhere else it falls back to Georgia and the system sans, which
       is a small cost against sending a reader's visit to a font host. */
    --serif:'Lora', Georgia, 'Times New Roman', serif;
    --sans:'Source Sans 3', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:1.0625rem;line-height:1.6;-webkit-text-size-adjust:100%}
  body{margin:0;min-height:100vh}
  a{color:var(--accent)}
  button,input,textarea,select{font:inherit;color:inherit}
  button{cursor:pointer;font-family:var(--sans)}
  :focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  p{margin:0 0 1rem}
  h2{font-family:var(--serif);font-weight:600;font-size:1.6rem;line-height:1.25;margin:0 0 .5rem;letter-spacing:0}
  h3{font-family:var(--sans);font-weight:700;font-size:.95rem;letter-spacing:.02em;margin:1.75rem 0 .5rem;color:var(--petrol)}
  .aside{color:var(--muted);font-size:.95rem}
  .hint{color:var(--muted);font-size:.88rem;font-family:var(--sans)}

  /* top bar */
  .bar{position:sticky;top:0;z-index:5;background:rgba(255,252,244,.94);backdrop-filter:blur(6px);border-bottom:3px solid var(--accent);
       display:flex;align-items:center;gap:.5rem;padding:.5rem .8rem;flex-wrap:wrap;font-family:var(--sans)}
  .bar .home{border:0;background:transparent;padding:.25rem .4rem;font-family:var(--serif);font-size:1.05rem;color:var(--ink);text-align:left;flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .home:hover{color:var(--accent)}
  .bar .navb{border:2px solid var(--rule);background:var(--field);border-radius:999px;padding:.3rem .8rem;font-size:.85rem;font-weight:600;white-space:nowrap;color:var(--ink)}
  .bar .navb:hover{border-color:var(--accent);color:var(--accent)}
  .bar .navb[aria-current="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
  .bar .navb.attention{border-color:var(--warn);color:var(--warn)}
  .lang{display:inline-flex;border:2px solid var(--rule);border-radius:999px;overflow:hidden}
  .lang button{border:0;background:transparent;padding:.2rem .6rem;font-size:.8rem;font-weight:700;color:var(--muted)}
  .lang button[aria-pressed="true"]{background:var(--ink);color:#fff}
  .tools{display:flex;gap:.4rem;flex-wrap:wrap}
  .bar .ver{flex:0 0 auto;font-size:.7rem;color:var(--muted);white-space:nowrap;padding:.25rem .3rem}
  @media (max-width:520px){ .bar{padding:.45rem .6rem} .bar .home{flex-basis:100%;order:-1} }

  /* page */
  .page{max-width:1080px;margin:0 auto;padding:1.5rem 1rem 6rem}
  @media (min-width:900px){.page{padding:2.5rem 2rem 6rem}}
  .col{max-width:64ch}
  .frame{display:grid;grid-template-columns:1fr} .frame>*{min-width:0}
  @media (min-width:900px){.frame{grid-template-columns:230px minmax(0,1fr);gap:3rem} nav.rail{position:sticky;top:4.4rem;align-self:start}}
  nav.rail ol{list-style:none;margin:0 0 1rem;padding:0 0 .25rem;display:flex;gap:.25rem;overflow-x:auto;scrollbar-width:thin} nav.rail li{flex:none}
  @media (min-width:900px){nav.rail ol{flex-direction:column;overflow:visible}}
  nav.rail button{border:0;background:transparent;text-align:left;color:var(--muted);padding:.35rem .6rem;border-left:3px solid transparent;font-size:.9rem;white-space:nowrap;border-radius:0 6px 6px 0}
  @media (min-width:900px){nav.rail button{white-space:normal}}
  nav.rail button:hover{color:var(--ink);background:var(--accent-soft)}
  nav.rail button .n{display:inline-block;width:1.5rem;color:var(--rule);font-weight:700}
  nav.rail button.here{border-left-color:var(--accent);color:var(--ink);background:var(--accent-soft)}
  nav.rail button.here .n{color:var(--accent)}

  /* home */
  .hero h1{font-family:var(--serif);font-weight:600;font-size:2.1rem;line-height:1.15;margin:0 0 .4rem;letter-spacing:0}
  .hero .sub{font-size:1.12rem;color:var(--muted);margin:0 0 1.25rem;line-height:1.45}
  .greet{font-family:var(--sans);font-weight:700;color:var(--accent);margin:0 0 .5rem;font-size:1rem}
  .notecard{background:var(--note);border-radius:14px;padding:.9rem 1.1rem;margin:0 0 1.25rem;max-width:64ch}
  .notecard .k{font-family:var(--sans);font-size:.8rem;font-weight:700;color:#7A5E00;margin:0 0 .3rem}
  .notecard p{margin:0 0 .5rem} .notecard p:last-child{margin:0}
  .modes{display:grid;grid-template-columns:1fr;gap:.8rem;margin:1.5rem 0 0;max-width:64ch}
  @media (min-width:700px){.modes{grid-template-columns:repeat(2,1fr);max-width:none}}
  .mode{font-family:var(--sans);text-align:left;border:0;border-top:4px solid var(--mc);background:#fff;border-radius:16px;padding:1.1rem 1.15rem 1rem;line-height:1.4;min-height:9rem;display:flex;flex-direction:column;gap:.4rem;
        box-shadow:0 1px 2px rgba(31,36,48,.06),0 10px 24px -18px rgba(31,36,48,.4);transition:transform .12s,box-shadow .12s;font-family:var(--serif)}
  .mode:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(31,36,48,.08),0 16px 30px -18px rgba(31,36,48,.5)}
  .mode .top{display:flex;align-items:center;gap:.6rem}
  .mode svg{width:2rem;height:2rem;flex:none;color:var(--mc)}
  .mode .k{font-family:var(--serif);font-size:1.2rem;font-weight:600;color:var(--petrol)}
  .mode .d{color:var(--muted);font-size:.93rem}
  .mode .c{margin-top:auto;font-family:var(--sans);font-size:.8rem;font-weight:600;color:var(--muted);display:flex;gap:.5rem;flex-wrap:wrap}
  .mode .c .pill{background:var(--paper-deep);border-radius:999px;padding:.05rem .55rem}
  .mode .c .pill.live{background:var(--mcs);color:var(--ink)}
  .notice{border:2px dashed var(--rule);border-radius:12px;padding:.8rem 1rem;font-size:.9rem;color:var(--muted);margin:0 0 1.5rem;font-family:var(--sans)}
  .notice strong{color:var(--ink);font-weight:700}
  .unsaved{font-family:var(--sans);font-size:.85rem;font-weight:700;color:var(--warn);background:#FFE4DE;border-radius:999px;padding:.15rem .7rem}
  .quietlink,.linkbtn{border:0;background:transparent;color:var(--accent);text-decoration:underline;padding:0;font-size:.92rem;text-align:left;font-family:var(--sans);font-weight:600}
  .quietlink{color:var(--muted);font-weight:500}

  /* fields */
  .field{width:100%;background:var(--field);color:var(--reader);border:2px solid var(--rule);
         padding:.5rem .65rem;border-radius:10px;resize:vertical;min-height:2.8rem;line-height:1.5}
  .field::placeholder{color:#9AA0B4;font-style:italic}
  .field:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
  .field.starter{color:#6B5A2E;background:#FFF9E3;border-style:dashed}
  label.lbl{display:block;font-size:.95rem;margin:1rem 0 .3rem;font-family:var(--sans);font-weight:700}
  label.lbl span.hint{display:block;font-weight:400}
  .startertag{display:inline-block;font-family:var(--sans);font-size:.72rem;font-weight:700;color:#7A5E00;background:var(--note);border-radius:999px;padding:.05rem .5rem;margin:.3rem 0 0}
  .sentence{font-size:1.4rem;line-height:1.8;margin:1.25rem 0 1.5rem}
  .sentence input{display:inline-block;width:auto;min-width:6ch;max-width:100%;font-size:inherit;background:var(--field);
                  color:var(--reader);border:0;border-bottom:2px solid var(--accent);padding:0 .35rem;border-radius:6px 6px 0 0;line-height:1.4;vertical-align:baseline}
  .sentence input:focus{outline:none;background:var(--accent-soft)}
  .sentence input::placeholder{color:#9AA0B4;font-style:italic;font-size:.85em}

  details{border:2px solid var(--rule);border-radius:12px;margin:1rem 0;background:#fff}
  details summary{cursor:pointer;padding:.7rem 1rem;list-style:none;display:flex;align-items:center;gap:.6rem;font-family:var(--sans);font-weight:600}
  details summary::-webkit-details-marker{display:none}
  details summary::before{content:"";width:.5rem;height:.5rem;border-right:2px solid var(--accent);border-bottom:2px solid var(--accent);transform:rotate(-45deg);transition:transform .15s;flex:none}
  details[open] summary::before{transform:rotate(45deg)}
  details .inner{padding:0 1rem 1rem}
  details.quiet{border-style:dashed;background:transparent}
  details.why{border:0;background:var(--accent-soft);margin:.5rem 0 1rem} details.why .inner{padding-top:.25rem}

  section.step{padding:2.25rem 0 1rem;border-top:2px solid var(--rule)}
  section.step h2 .n, h2.bhead .n{display:inline-flex;align-items:center;justify-content:center;width:2rem;height:2rem;border-radius:50%;background:var(--accent);color:#fff;font-family:var(--sans);font-size:1rem;font-weight:700;margin-right:.6rem;vertical-align:middle}
  blockquote{margin:1.25rem 0;padding:0 0 0 1rem;border-left:3px solid var(--accent);color:var(--muted);font-style:italic}
  ul.plain{padding-left:1.2rem;margin:0 0 1rem} ul.plain li{margin:.3rem 0}
  .kinds{display:grid;grid-template-columns:1fr;gap:.6rem;margin:1rem 0 1.25rem}
  @media (min-width:600px){.kinds{grid-template-columns:1fr 1fr}}
  .kind{text-align:left;border:2px solid var(--rule);background:#fff;border-radius:12px;padding:.85rem 1rem;line-height:1.4;font-family:var(--serif)}
  .kind:hover{border-color:var(--accent)}
  .kind[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
  .kind .k{display:block;font-weight:600;margin-bottom:.2rem} .kind .d{display:block;font-size:.9rem;color:var(--muted)}
  .kind-detail{border-left:3px solid var(--accent);padding:.25rem 0 .25rem 1rem;margin:1rem 0}
  .kind-detail h4{margin:0 0 .5rem;font-weight:600;font-size:1.02rem}
  .prompt{font-style:italic;color:var(--accent);margin:.5rem 0}
  .card{background:#fff;border:2px solid var(--rule);border-radius:14px;padding:1.1rem 1.3rem .9rem;margin:1.25rem 0;box-shadow:0 10px 24px -20px rgba(31,36,48,.5)}
  .card .row{display:grid;grid-template-columns:1fr;gap:.15rem;padding:.55rem 0;border-bottom:1px dotted var(--rule)}
  @media (min-width:560px){.card .row{grid-template-columns:11rem 1fr;gap:1rem;align-items:start}}
  .card .row:last-child{border-bottom:0}
  .card .row .k{color:var(--accent);font-family:var(--sans);font-weight:700;font-size:.9rem;padding-top:.5rem}
  .card .field{border-color:transparent;background:var(--paper)} .card .field:focus{border-color:var(--accent);background:#fff}
  .area{border:2px solid var(--rule);border-radius:14px;margin:1rem 0;background:#fff}
  .area summary{display:flex;align-items:center;gap:.6rem;padding:.7rem 1rem;cursor:pointer;list-style:none}
  .area summary::-webkit-details-marker{display:none}
  .area summary input{flex:1 1 auto;min-width:0;background:transparent;border:0;border-bottom:2px solid var(--accent);color:var(--reader);padding:.1rem .3rem;font-size:1.1rem;font-family:var(--serif)}
  .area summary input:focus{outline:none;background:var(--accent-soft)}
  .area summary .x{border:0;background:transparent;color:var(--muted);font-size:1.3rem;line-height:1;padding:.2rem .5rem;border-radius:6px}
  .area summary .x:hover{color:var(--warn);background:var(--paper-deep)}
  .area .inner{padding:0 1rem 1rem}
  .add{border:2px dashed var(--accent);background:transparent;border-radius:12px;padding:.7rem 1rem;width:100%;color:var(--accent);font-weight:700}
  .add:hover{background:var(--accent-soft)}

  /* chips (previous entries) + pills */
  .chips{display:flex;gap:.4rem;overflow-x:auto;padding:.25rem 0 .5rem;scrollbar-width:thin;margin:0 0 .75rem}
  .chip{flex:none;border:2px solid var(--rule);background:#fff;border-radius:999px;padding:.3rem .8rem;font-size:.85rem;font-weight:600;white-space:nowrap}
  .chip:hover{border-color:var(--accent)}
  .chip[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
  .chips-empty{font-size:.9rem;color:var(--muted);margin:0 0 .75rem;font-family:var(--sans)}
  .pills{display:flex;gap:.45rem;flex-wrap:wrap;margin:.25rem 0 1rem}
  .pill-btn{border:2px solid var(--accent);background:#fff;color:var(--accent);border-radius:999px;padding:.4rem .95rem;font-size:.95rem;font-weight:700;line-height:1.2}
  .pill-btn:hover{background:var(--accent-soft)}
  .pill-btn[aria-pressed="true"]{background:var(--accent);color:#fff}
  .pill-btn.none{border-color:var(--rule);color:var(--muted)} .pill-btn.none[aria-pressed="true"]{background:var(--muted);border-color:var(--muted);color:#fff}

  /* entry read view */
  .entry{background:#fff;border:2px solid var(--rule);border-radius:14px;padding:.9rem 1.1rem;margin:0 0 1rem}
  .entry .when{color:var(--muted);font-size:.9rem;margin:0 0 .5rem;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;font-family:var(--sans)}
  .entry .when .tag{border-radius:999px;padding:.05rem .6rem;font-size:.76rem;font-weight:700;color:#fff;background:var(--muted)}
  .entry .when .tag.today{background:var(--petrol)} .entry .when .tag.checkin{background:var(--petrol)}
  .entry .when .area{border:2px solid var(--rule);border-radius:999px;padding:0 .55rem;font-size:.76rem;font-weight:700;color:var(--ink)}
  .entry dl{margin:0;display:grid;grid-template-columns:1fr;gap:.2rem .75rem}
  @media (min-width:560px){.entry dl{grid-template-columns:12rem 1fr}}
  .entry dt{color:var(--muted);font-size:.88rem;padding-top:.15rem;font-family:var(--sans);font-weight:600}
  .entry dd{margin:0 0 .35rem;color:var(--reader);white-space:pre-wrap}
  .entry ul{margin:0;padding-left:1.1rem;color:var(--reader)}
  .entry .emos{display:flex;gap:.35rem;flex-wrap:wrap}
  .entry .emo{border-radius:999px;padding:.1rem .6rem;font-size:.85rem;color:var(--ink);font-family:var(--sans);font-weight:600}
  .entry .foot{display:flex;gap:.5rem;justify-content:flex-end;margin-top:.5rem;align-items:center;flex-wrap:wrap}
  .small{border:2px solid var(--rule);background:#fff;border-radius:999px;padding:.3rem .8rem;font-size:.85rem;font-weight:600}
  .small:hover{border-color:var(--accent);color:var(--accent)} .small.danger{color:var(--warn)}
  .small.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .inlineconfirm{display:inline-flex;gap:.4rem;align-items:center;font-size:.9rem;color:var(--warn);font-family:var(--sans)}

  /* area focus card + chosen move */
  .focuscard{border:0;border-left:6px solid var(--accent);background:var(--accent-soft);border-radius:0 14px 14px 0;padding:.9rem 1.1rem;margin:0 0 1.25rem}
  .focuscard .k{font-family:var(--sans);font-size:.8rem;font-weight:700;color:var(--accent);margin:0 0 .15rem;text-transform:none}
  .focuscard .v{color:var(--ink);margin:0 0 .6rem;white-space:pre-wrap}
  .focuscard .v.big{font-size:1.15rem;line-height:1.45}
  .focuscard .v:last-of-type{margin-bottom:.4rem}
  .focuscard button.flink{border:0;background:transparent;color:var(--accent);padding:0;text-decoration:underline;font-size:.9rem;font-weight:700}

  /* finalize row */
  .finrow{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;margin:1.75rem 0 0;padding-top:1.25rem;border-top:2px solid var(--rule)}
  .finalize{background:var(--accent);color:#fff;border:0;border-radius:999px;padding:.75rem 1.6rem;font-size:1.05rem;font-weight:700;box-shadow:0 8px 18px -10px var(--accent)}
  .finalize:hover{filter:brightness(1.08);transform:translateY(-1px)}

  /* quadrant */
  .quadwrap{display:grid;grid-template-columns:1.5rem 1fr 1.5rem;grid-template-rows:auto 1fr auto;gap:.3rem;margin:1rem 0}
  .ax{color:var(--muted);font-size:.8rem;text-align:center;align-self:center;justify-self:center;font-family:var(--sans);font-weight:700}
  .ax.v{writing-mode:vertical-rl;transform:rotate(180deg)} .ax.v.r{transform:none}
  .quad{grid-column:2;grid-row:2;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:.45rem}
  .q{border-radius:14px;padding:.75rem .8rem .8rem;min-height:9rem;display:flex;flex-direction:column;gap:.5rem}
  .q .qn{font-family:var(--sans);font-size:.95rem;font-weight:800;color:var(--qd)}
  .q .qb{display:flex;flex-wrap:wrap;gap:.4rem}
  .emb{border:2px solid rgba(255,255,255,.9);background:rgba(255,255,255,.75);color:var(--ink);border-radius:999px;padding:.45rem .85rem;font-size:.92rem;font-weight:600;line-height:1.2;min-height:2.4rem}
  .emb:hover{border-color:var(--qd)}
  .emb[aria-pressed="true"]{background:var(--qd);color:#fff;border-color:var(--qd)}
  @media (max-width:480px){.q{min-height:8rem;padding:.55rem .55rem .6rem} .emb{padding:.4rem .7rem;font-size:.88rem}}

  /* thoughts */
  .thought{display:flex;align-items:baseline;gap:.5rem;margin:.45rem 0}
  .thought .pre{color:var(--accent);flex:none;font-size:.95rem;font-family:var(--sans);font-weight:700}
  .thought input{flex:1 1 auto;min-width:0;background:var(--field);color:var(--reader);border:2px solid var(--rule);padding:.45rem .65rem;border-radius:10px}
  .thought input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  @media (max-width:480px){.thought{flex-direction:column;gap:.15rem;align-items:stretch}}

  /* history */
  .filters{display:flex;gap:.4rem;flex-wrap:wrap;margin:0 0 .75rem}
  .filters button{border:2px solid var(--rule);background:#fff;border-radius:999px;padding:.3rem .9rem;font-size:.88rem;font-weight:600}
  .filters button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
  .daysep{color:var(--muted);font-size:.85rem;margin:1.25rem 0 .5rem;border-bottom:2px solid var(--rule);padding-bottom:.2rem;font-family:var(--sans);font-weight:700}
  .bars{margin:1rem 0}
  .barrow{display:grid;grid-template-columns:7rem 1fr 3rem;gap:.6rem;align-items:center;margin:.4rem 0;font-size:.92rem;font-family:var(--sans);font-weight:600}
  .bar-track{background:var(--paper-deep);border-radius:999px;height:1.2rem;overflow:hidden}
  .bar-fill{height:100%;border-radius:999px}
  .barrow .cnt{color:var(--muted);font-size:.85rem;text-align:right}

  /* feelings guide */
  .gq .q{min-height:7rem}
  .emw{display:inline-block;border:2px solid rgba(255,255,255,.9);background:rgba(255,255,255,.7);border-radius:999px;padding:.25rem .7rem;font-size:.9rem;font-family:var(--sans);font-weight:600}

           color:var(--ink);border-radius:999px;padding:.32rem .5rem .32rem .85rem;font-size:.93rem;font-weight:600;line-height:1.2}
  .mapchip .x{border:0;background:transparent;color:var(--muted);font-size:1.05rem;line-height:1;padding:0 .25rem;border-radius:50%}
  .mapchip .x:hover{color:var(--warn);background:#fff}
  /* tagInput: a comma-separated, suggest-as-you-type word field (body map,
     emotions grid). Its own identity, close to .mapchip/.pills but kept
     separate in case the two widgets want to diverge later — e.g. a
     sense-word chip taking its sense group's own accent color. */
  .tagfield{margin:0 0 .7rem}
  .tagfield .hint{margin:0 0 .3rem}
  .tagchips{display:flex;gap:.35rem;flex-wrap:wrap;margin:.4rem 0 0}
  .tagchip{display:inline-flex;align-items:center;gap:.3rem;border:2px solid var(--accent);background:var(--accent-soft);
           color:var(--ink);border-radius:999px;padding:.28rem .45rem .28rem .75rem;font-size:.88rem;font-weight:600;line-height:1.2}
  .tagchip .x{border:0;background:transparent;color:var(--muted);font-size:1rem;line-height:1;padding:0 .2rem;border-radius:50%}
  .tagchip .x:hover{color:var(--warn);background:#fff}
  .mapprose{display:flex;flex-direction:column;gap:.5rem;margin:0 0 1.4rem}
  .mprow{border-left:5px solid var(--accent);background:#fff;border-radius:0 10px 10px 0;padding:.5rem .8rem;font-size:.97rem}
  .mprow .r{display:block;font-family:var(--sans);font-weight:800;font-size:.76rem;text-transform:uppercase;letter-spacing:.03em;color:var(--accent);margin-bottom:.15rem}
  details.explore{border:2px dashed var(--accent);background:var(--paper)}
  details.explore>summary{color:var(--accent);font-weight:700}
  .gdq{font-size:1.35rem;line-height:1.4;color:var(--accent);margin:0 0 .6rem;font-weight:600}
  .pill-btn.own{border-style:dashed}
  /* the good-day picture */
  .panel-gd{border-top:2px solid var(--rule);padding:1.75rem 0 0;margin:1.75rem 0 0}
  .panel-gd:first-of-type{border-top:0;padding-top:.5rem;margin-top:.5rem}
  .gdcard{border:0;border-left:6px solid var(--accent);background:var(--accent-soft);border-radius:0 16px 16px 0;padding:1.1rem 1.3rem;margin:1.5rem 0}
  .gdcard h3{margin:0 0 .6rem;color:var(--ink);font-family:var(--serif);font-size:1.3rem;font-weight:600}
  .gdcard dl{margin:0;display:grid;grid-template-columns:1fr;gap:.15rem .9rem}
  @media (min-width:560px){.gdcard dl{grid-template-columns:11rem 1fr}}
  .gdcard dt{font-family:var(--sans);font-weight:700;font-size:.85rem;color:var(--accent);padding-top:.2rem}
  .gdcard dd{margin:0 0 .5rem}
  .gdempty{color:var(--muted);font-style:italic}
  footer{margin-top:3rem;color:var(--muted);font-size:.9rem;border-top:2px solid var(--rule);padding-top:1.25rem}
  /* ── an activity's pages ──────────────────────────────────────────────
     A menu on the left lists the pages; minimized, it is a thin rail of page
     numbers. A one-page activity shows, while editing, only a thin dashed
     strip with a plus in it. Below 700px the menu starts as the rail and opens
     OVER the page rather than beside it, so the page never scrolls sideways.
     The page on show is marked by a bar, weight and tint, never by colour alone. */
  .ap-frame{display:grid;grid-template-columns:13rem minmax(0,1fr);gap:0 2rem;align-items:start;position:relative}
  .ap-frame>*{min-width:0}
  .ap-frame.ap-min{grid-template-columns:2.75rem minmax(0,1fr);gap:0 1.25rem}
  .ap-frame.ap-single{grid-template-columns:1.5rem minmax(0,1fr);gap:0 1rem;align-items:stretch}
  /* --ap-top is the page's own sticky bar's height, kept current by the script
     (the bar wraps onto three rows on a phone), so the menu stops just below it */
  .ap-menu{grid-column:1;grid-row:1;position:sticky;top:var(--ap-top,4.4rem);font-family:var(--sans);max-height:calc(100vh - var(--ap-top,4.4rem) - .75rem);overflow-y:auto;padding:.1rem .1rem .5rem}
  .ap-content{grid-column:2;grid-row:1}
  .ap-top{display:flex;align-items:center;justify-content:space-between;gap:.4rem;margin:0 0 .4rem}
  .ap-head{margin:0}
  .ap-toggle{flex:none;width:2.25rem;height:2.25rem;padding:0;border:2px solid var(--rule);border-radius:999px;background:#fff;color:var(--muted);font-weight:700;line-height:1}
  .ap-toggle:hover{border-color:var(--accent);color:var(--accent)}
  .ap-menu ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.15rem}
  .ap-item{display:flex;align-items:baseline;gap:.5rem;width:100%;border:0;border-left:3px solid transparent;border-radius:0 8px 8px 0;background:transparent;color:var(--muted);text-align:left;padding:.4rem .55rem;font-size:.92rem;line-height:1.3}
  .ap-item:hover{color:var(--ink);background:var(--accent-soft)}
  .ap-item[aria-current="page"]{border-left-color:var(--accent);background:var(--accent-soft);color:var(--ink);font-weight:700}
  .ap-n{flex:none;min-width:1.1rem;font-weight:700;color:var(--muted)}
  .ap-item[aria-current="page"] .ap-n{color:var(--accent)}
  .ap-t{min-width:0;overflow-wrap:anywhere}
  .ap-item.ap-add{margin-top:.4rem;border:2px dashed var(--rule);border-radius:10px;color:var(--accent);font-weight:600}
  .ap-item.ap-add:hover{border-color:var(--accent)}
  .ap-acts{display:flex;gap:.25rem;flex-wrap:wrap;padding:.1rem 0 .35rem 1.75rem}
  .ap-acts .small{padding:.1rem .5rem;font-size:.78rem}
  .ap-acts .small[disabled]{opacity:.35}
  .ap-confirm{flex:1 1 100%;border:2px solid var(--warn);border-radius:10px;background:#fff;padding:.5rem .6rem;font-size:.88rem}
  .ap-confirm p{margin:0 0 .4rem} .ap-q{font-weight:700;color:var(--ink)}
  .ap-title{font-family:var(--serif);font-weight:600;font-size:1.25rem;line-height:1.3;color:var(--ink);margin:.25rem 0 .9rem}
  /* minimized: the numbers, and the plus, only */
  .ap-min .ap-top{justify-content:center}
  .ap-min .ap-head,.ap-min .ap-t{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
  .ap-min .ap-item{justify-content:center;padding:.4rem 0}
  .ap-min .ap-n{min-width:0}
  /* the plus strip: add a page to a one-page activity */
  .ap-plus{display:flex;justify-content:center;align-items:flex-start;width:100%;min-height:7rem;padding:.55rem 0;border:2px dashed var(--rule);border-radius:10px;background:transparent;color:var(--muted);font-size:1.25rem;font-weight:700;line-height:1}
  .ap-plus span{position:sticky;top:var(--ap-top,5rem)}
  .ap-plus:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
  @media (max-width:699px){
    .ap-frame,.ap-frame.ap-min{grid-template-columns:2.5rem minmax(0,1fr);gap:0 .7rem}
    .ap-frame.ap-single{grid-template-columns:1.3rem minmax(0,1fr);gap:0 .6rem}
    /* open, it lies over the page just below the bar, wherever the page is scrolled to */
    .ap-frame:not(.ap-min) .ap-menu{position:fixed;top:var(--ap-top,9rem);left:1rem;z-index:4;width:min(16rem,calc(100vw - 2rem));
      max-height:calc(100vh - var(--ap-top,9rem) - 1rem);overflow-y:auto;
      background:var(--paper);border:2px solid var(--rule);border-radius:0 14px 14px 0;padding:.5rem .5rem .6rem;box-shadow:0 12px 30px -14px rgba(31,36,48,.5)}
  }
  /* ── reading material: citation marks, the source panel, callouts, sources ──
     Quiet by default: a mark is a small petrol number that keeps the line's
     rhythm (line-height 0 on the superscript). A callout's kind is told by its
     label, its icon and its border pattern as well as its colour, never by
     colour alone: dashed for a difference, double for the law now, dotted for
     an author's view. Label text sits on white, where each deep tone passes
     4.5:1. The panel is a column on the right, and a bottom sheet on a phone. */
  .rd-glue{white-space:nowrap}
  .rd-sup{font-size:.72em;line-height:0;vertical-align:baseline;position:relative;top:-.5em}
  .rd-mark{border:0;background:transparent;margin:0 .05em;padding:.05em .18em;border-radius:4px;font:inherit;font-family:var(--sans);font-weight:700;color:var(--accent);line-height:1;cursor:pointer}
  .rd-mark:hover{text-decoration:underline;background:var(--accent-soft)}
  .rd-mark[aria-expanded="true"]{background:var(--accent);color:#fff;text-decoration:none}
  .rd-broken{font-family:var(--sans);font-size:.72em;font-weight:700;color:var(--warn);border:1px dashed var(--warn);border-radius:4px;padding:0 .2em;margin:0 .1em;white-space:nowrap}
  .rd-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
  /* The panel sits beside the page, which moves over while it is open so that
     nothing it covers is text (data-cite-open on <html>, set by the script).
     Its width gives way on a narrower screen before the reading column does. */
  :root{--rd-w:clamp(17rem,calc(100vw - 42rem),24rem)}
  @media (min-width:900px){[data-cite-open] .page{margin-right:calc(var(--rd-w) + 2rem);padding-right:1rem}}
  .rd-panel{position:fixed;z-index:15;top:var(--ap-top,4.4rem);right:1rem;bottom:1rem;width:var(--rd-w);overflow-y:auto;
    background:var(--paper);border:2px solid var(--rule);border-radius:14px;padding:.9rem 1.1rem 1rem;font-family:var(--sans);box-shadow:0 20px 50px -20px rgba(0,0,0,.45)}
  .rd-panel[hidden]{display:none}
  .rd-phead{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin:0 0 .6rem}
  .rd-ph{font-family:var(--sans);font-size:1rem;font-weight:800;color:var(--petrol);margin:0}
  .rd-ph:focus{outline:none} .rd-ph:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .rd-psrc{margin:0 0 .25rem;color:var(--ink);font-size:.98rem} .rd-psrc cite{font-style:italic;font-weight:600}
  .rd-pkind,.rd-ppage{margin:0 0 .35rem;color:var(--muted);font-size:.9rem}
  .rd-q{margin:.7rem 0;padding:0 0 0 .8rem;border-left:3px solid var(--accent);color:var(--ink);font-style:normal;font-family:var(--serif);line-height:1.55}
  .rd-q mark,.rd-scites mark{background:#FFF3B0;color:var(--ink);padding:.05em .15em;border-radius:3px}
  .rd-open{font-weight:700}
  .rd-badge{display:flex;flex-wrap:wrap;align-items:center;gap:.2rem .5rem;margin:.8rem 0 0;padding:.35rem .7rem;border:2px solid var(--tone-green-deep);border-radius:12px;background:#fff;color:var(--tone-green-deep);font-size:.88rem;font-weight:700}
  .rd-badge .rd-how{color:var(--ink);font-weight:400}
  .rd-bad{color:var(--warn)}
  .rd-tip{position:fixed;z-index:16;max-width:min(22rem,calc(100vw - 1rem));background:var(--ink);color:#fff;font-family:var(--sans);font-size:.85rem;line-height:1.45;padding:.5rem .7rem;border-radius:10px;pointer-events:none;box-shadow:0 10px 24px -12px rgba(0,0,0,.5)}
  .rd-tip[hidden]{display:none}
  .rd-tip .rd-tw{display:block;margin-top:.2rem;color:#E9E3D8;font-size:.8rem}
  .rd-callout{margin:1.25rem 0;padding:.7rem 1rem .75rem;background:#fff;border:2px solid var(--rule);border-left:6px solid var(--muted);border-radius:0 12px 12px 0}
  .rd-callout.rd-k-diff{border-left:6px dashed var(--tone-warm-deep)}
  .rd-callout.rd-k-law{border-left:6px double var(--tone-teal-deep)}
  .rd-callout.rd-k-opinion{border-left:6px dotted var(--tone-slate-deep)}
  .rd-chead{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin:0 0 .3rem;font-family:var(--sans);font-size:.85rem;font-weight:700}
  .rd-ci,.rd-fi{display:inline-flex;align-items:center;justify-content:center;width:1.5rem;height:1.5rem;border-radius:50%;flex:none;font-size:.95rem;line-height:1;font-weight:700}
  .rd-k-diff .rd-ci,.rd-f-diff .rd-fi{background:var(--tone-warm);color:var(--tone-warm-deep)}
  .rd-k-law .rd-ci,.rd-f-law .rd-fi{background:var(--tone-teal);color:var(--tone-teal-deep)}
  .rd-k-opinion .rd-ci,.rd-f-opinion .rd-fi{background:var(--tone-slate);color:var(--tone-slate-deep)}
  .rd-k-diff .rd-cl{color:var(--tone-warm-deep)} .rd-k-law .rd-cl{color:var(--tone-teal-deep)} .rd-k-opinion .rd-cl{color:var(--tone-slate-deep)}
  .rd-cshow{margin-left:auto}
  .rd-cshow[hidden]{display:none}
  .rd-ctitle{margin:0 0 .35rem;font-weight:700;color:var(--ink)}
  .rd-cb>:last-child{margin-bottom:0}
  .rd-callout[data-state="folded"]{background:var(--paper);padding:.45rem .9rem}
  .rd-callout[data-state="folded"] .rd-ctitle{margin:0;font-weight:600;color:var(--muted)}
  .rd-callout[data-state="lit"].rd-k-diff{box-shadow:0 0 0 3px var(--tone-warm)}
  .rd-callout[data-state="lit"].rd-k-law{box-shadow:0 0 0 3px var(--tone-teal)}
  .rd-callout[data-state="lit"].rd-k-opinion{box-shadow:0 0 0 3px var(--tone-slate)}
  .rd-filter{display:flex;flex-wrap:wrap;align-items:center;gap:.45rem;margin:0 0 1.25rem}
  .rd-filter .rd-fl{margin:0 .2rem 0 0}
  .rd-filter .pill-btn{display:inline-flex;align-items:center;gap:.4rem;padding:.3rem .8rem .3rem .35rem;font-size:.88rem}
  .rd-filter .pill-btn[aria-pressed="true"] .rd-fi{background:#fff}
  .rd-fn{font-weight:600;opacity:.85}
  .rd-sources{margin:1.5rem 0}
  .rd-srclist{margin:.5rem 0 0;padding-left:1.4rem}
  .rd-src{margin:0 0 .9rem}
  .rd-st{margin:0 0 .2rem} .rd-st cite{font-style:italic;font-weight:600}
  .rd-sk{display:inline-block;margin-left:.4rem;font-family:var(--sans);font-size:.75rem;font-weight:700;color:var(--muted);border:2px solid var(--rule);border-radius:999px;padding:0 .5rem;vertical-align:middle}
  .rd-scites{list-style:none;margin:.2rem 0 0;padding:0;font-size:.92rem;color:var(--muted)}
  .rd-scites li{margin:.3rem 0;display:grid;grid-template-columns:1.4rem minmax(0,1fr) auto;gap:.5rem;align-items:start}
  .rd-sn{font-family:var(--sans);font-weight:800;color:var(--accent);min-width:1.2rem}
  .rd-back{border:2px solid var(--rule);background:#fff;border-radius:999px;min-width:1.9rem;min-height:1.6rem;padding:0 .45rem;font-weight:700;color:var(--accent);line-height:1}
  .rd-back:hover{border-color:var(--accent)}
  .rd-backs{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:.25rem}
  .rd-bn{font-size:.72em;margin-left:.15em}
  .rd-notes{display:none}
  .rd-tool{margin:.6rem 0 0;background:#fff}
  .rd-tool .qrow label{font-size:.88rem;font-weight:600}
  .rd-tool select,.beditor select{min-height:0;max-width:100%}
  .rd-tool .rd-msg{margin:.4rem 0 0}
  .rd-langs{margin:.4rem 0 0;padding:.35rem .7rem;border-left:3px solid var(--warn);background:#fff;font-size:.88rem}
  .rd-langs[hidden]{display:none}
  .rd-lrow{display:flex;flex-wrap:wrap;align-items:baseline;gap:.3rem .6rem;margin:.25rem 0}
  .rd-lrow span{flex:1 1 14rem;min-width:0;overflow-wrap:anywhere}
  .rd-reg{border-top:1px dotted var(--rule);padding:.5rem 0 0;margin:.5rem 0 0}
  @media (max-width:899px){
    /* a bottom sheet: the whole width, the lower part of the screen */
    .rd-panel{top:auto;left:0;right:0;bottom:0;width:auto;max-height:70vh;border-radius:16px 16px 0 0;border-bottom:0;padding:.8rem 1rem calc(1rem + env(safe-area-inset-bottom,0px))}
  }
  /* Printed, the panel is gone and the citations are endnotes at the end of
     the activity (the page on show); a folded callout prints whole. */
  @media print{
    .bar,.ap-menu,.ap-plus,.editrow,.rd-filter,.rd-panel,.rd-tip,.rd-cshow,.toast{display:none!important}
    .ap-frame{display:block}
    .rd-notes{display:block;margin:2rem 0 0;border-top:2px solid var(--rule);padding-top:.5rem;font-size:.9rem}
    .rd-notes li{margin:0 0 .4rem}
    .rd-cb[hidden]{display:block!important}
    .rd-callout{break-inside:avoid;box-shadow:none!important}
    .rd-mark{color:var(--ink);background:none!important;padding:0}
    .rd-back{display:none}
  }
</style>

<body>

<div class="bar">
  <button type="button" class="home" id="btnHome"></button>
  <button type="button" class="navb safety" id="btnSafety"></button>
  <div class="tools">
    <button type="button" class="navb" id="btnExport"></button>
    <button type="button" class="navb" id="btnLoad"></button>
    <!-- "On a phone?" removed 2026-09-10 (Ben) -->
  </div>
  <div class="lang" id="langGroup" role="group" aria-label="Language">
    <button type="button" data-lang="en" aria-pressed="true">EN</button>
    <button type="button" data-lang="es" aria-pressed="false">ES</button>
    <button type="button" data-lang="fr" aria-pressed="false">FR</button>
  </div>
  <span class="ver" id="rendererVer" aria-hidden="true"></span>
</div>

<div class="page" id="main"></div>

<div class="veil" id="veilLoad" role="dialog" aria-modal="true" aria-labelledby="loadTitle">
  <div class="panel">
    <h3 id="loadTitle"></h3>
    <p id="loadHelp"></p>
    <input type="file" id="fileIn" accept=".md,.txt,text/markdown,text/plain" aria-labelledby="loadHelp">
    <div class="dropzone" id="dropZone"></div>
    <p id="loadOr" style="margin:.75rem 0 .3rem"></p>
    <textarea id="pasteIn" aria-labelledby="loadOr"></textarea>
    <div class="msg" id="loadMsg" role="status"></div>
    <div class="actions">
      <button type="button" id="loadCancel"></button>
      <button type="button" id="loadGo" class="primary"></button>
    </div>
  </div>
</div>

<div class="veil" id="veilMerge" role="dialog" aria-modal="true" aria-labelledby="mergeTitle">
  <div class="panel">
    <h3 id="mergeTitle"></h3>
    <p id="mergeHelp"></p>
    <div class="actions">
      <button type="button" id="mergeCancel"></button>
      <button type="button" id="mergeReplace" class="danger"></button>
      <button type="button" id="mergeAdd" class="primary"></button>
    </div>
  </div>
</div>

<div class="veil" id="veilAddModule" role="dialog" aria-modal="true" aria-labelledby="addModTitle">
  <div class="panel">
    <h3 id="addModTitle"></h3>
    <p id="addModHelp"></p>
    <div id="addModList" class="addmodlist"></div>
    <p id="addModOr" style="margin:.75rem 0 .3rem"></p>
    <input type="file" id="addModFile" accept=".md,.txt,text/markdown,text/plain" aria-labelledby="addModOr">
    <div class="msg" id="addModMsg" role="status"></div>
    <div class="actions">
      <button type="button" id="addModCancel"></button>

</div>

<div class="veil" id="veilClear" role="dialog" aria-modal="true" aria-labelledby="clearTitle">
  <div class="panel">
    <h3 id="clearTitle"></h3>
    <p id="clearHelp"></p>
    <div class="actions">
      <button type="button" id="clearCancel"></button>
      <button type="button" id="clearGo" class="danger"></button>
    </div>
  </div>
</div>

<!-- each dialog is named by its heading; the four below are drawn when opened,
     each with a heading under the id its aria-labelledby gives -->
<div class="veil" id="veilSafety" role="dialog" aria-modal="true" aria-labelledby="safetyH"><div class="panel" id="safetyPanel"></div></div>
<div class="veil" id="veilRemind" role="dialog" aria-modal="true" aria-labelledby="remindH"><div class="panel" id="remindPanel"></div></div>
<div class="veil" id="veilLock" role="dialog" aria-modal="true" aria-labelledby="lockH"><div class="panel" id="lockPanel"></div></div>
<div class="veil" id="veilExport" role="dialog" aria-modal="true" aria-labelledby="exportH"><div class="panel" id="exportPanel"></div></div>

<div class="dropveil" id="dropVeil"></div>
<div class="toast" id="toast" role="status"></div>
<script>
/* This renderer's own version, separate from the project's own umbrella
   marker ("project v0.2" — SPEC.md, README.md). Major.minor stays in
   lockstep with the project's; the patch digit is this file's own, for a
   renderer-only fix that does not need a project-wide re-release (Ben,
   2026-09-28). */
const RENDERER_VERSION="0.2.0";
/* ======================= COPY ======================= */
const T = {};
T.en = {
  ui:{
    app:"Booklet", history:"History", download:"Download", load:"Load", share:"Share…", export:"Send or save a copy",
    back:"Home",
    loadTitle:"Load notes you saved earlier",
    loadHelp:"Choose the markdown file you downloaded from this page, or paste its contents below.",
    loadOr:"Or paste the file's contents:", loadCancel:"Cancel", loadGo:"Load",
    loadErr:"That text does not look like a file saved from this page. Nothing was changed.",
    addModTitle:"Add a module", addModHelp:"Add one from the list below, or open your own file. Either way, it is checked before anything changes.",
    addModOr:"Or your own file:", addModCancel:"Close", addModAdd:"Add",
    unknownBlock:(type,id)=>`This page does not know how to draw a "${type}" (${id}). The rest of the activity is unaffected.`,
    tagPh:"Type or say words, separated by commas", tagHint:"Suggestions come from the words below, but anything you type or say is kept too.",
    missingWidget:id=>`This activity needs a widget the file does not carry (${id}). Load the booklet it came from, or add the module that brings it.`,
    missingEngine:e=>`This page cannot draw a "${e}" — it is an older version of the app than the booklet expects.`,

       es-AR → es → en          es → en          fr → en

   TSRC keeps what a person actually wrote for each language. T is what the page
   reads: every table completed from the one beneath it, so `T[lang].ui.x` is
   always a string and a missing translation shows the English rather than a raw
   key or an error. `langParity()` lists what is still missing, so the Spanish
   wording can be written later (the /localize skill) without anyone hunting for
   holes. Add or change a Spanish string in TSRC_ES under the same path it has
   in T.en; add a voseo variant to TSRC_ES_AR (only what differs). Two groups are
   declared further down, beside the views that own them (`library` for "Your
   booklets", `moduleView` for a module's own page); each writes into TSRC and
   calls buildTables() again, so they layer exactly like the groups here. */

/* `over` laid on top of `base`, two-deep-or-more, without sharing objects with either */
function mergeDeep(base,over){const out={};
  for(const k of Object.keys(base||{})) out[k]=isObj(base[k])?mergeDeep(base[k],{}):base[k];
  for(const k of Object.keys(over||{})){const v=over[k];
    out[k]=isObj(v)?mergeDeep(isObj(out[k])?out[k]:{},v):v;}
  return out;}

  T.en=TSRC.en;
  T.fr=mergeDeep(TSRC.en,TSRC.fr);

function leafPaths(o,pre,out){out=out||[];
  for(const k of Object.keys(o||{})){const p=pre?pre+"."+k:k;
    if(isObj(o[k])) leafPaths(o[k],p,out);else out.push(p);}
  return out;}

   language has not (`missing`), and keys it has that English does not (`extra`,
   almost always a typo). es-AR is a layer of differences, so it has no missing. */
function langParity(l){const en=leafPaths(TSRC.en);const have=new Set(leafPaths(TSRC[l]||{}));

  return {lang:l,total:en.length,
    missing:l==="es-AR"?[]:en.filter(p=>!have.has(p)),
    extra:[...have].filter(p=>!enSet.has(p))};}

   Sensation words are derived from the corpus's body-scan and grounding material
   (tension/ease, bracing, warmth, numbness, buzzing, settling, softening) and
   extended with plain-language neighbours. The corpus carries no sensation
   lexicon of its own — the one rich source in it is a vendored third-party book,

   A figure's `svg` is markup that rides in a file somebody was handed, so it
   is a way in for script unless it is cleaned first: an `onerror` on an
   <image> runs the moment the figure is drawn, and a javascript: link runs
   when a region is tapped. sanitizeSvg() parses the text with the browser's
   own HTML parser, in a document that runs nothing, and returns the cleaned
   nodes. Never a string: clean markup parsed a second time can come out as
   something else. Kept: SVG elements and text. Removed with everything inside
   them: any element outside the SVG namespace, and <script>, <foreignObject>
   and the animation elements, which can write a javascript: URL into a link
   after the link was checked. Stripped from what is kept: every on* attribute,
   and any attribute whose value is a javascript: or vbscript: URL (control
   characters and spaces ignored, as a browser ignores them). If anything goes
   wrong it returns nothing, and the figure is blank rather than unsafe. */

  ||/^(javascript|vbscript):/i.test(String(a.value).replace(/[\u0000- ]/g,""));
function sanitizeSvg(text){
  if(typeof text!=="string"||!text.trim()) return [];
  try{
    const body=new DOMParser().parseFromString(text,"text/html").body;
    const scrub=parent=>{for(const n of [...parent.childNodes]){
      if(n.nodeType===3) continue;
      if(n.nodeType!==1||n.namespaceURI!==SVG_NS||SVG_DROP.has(n.localName.toLowerCase())){n.remove();continue;}
      for(const a of [...n.attributes]) if(svgAttrBad(a)) n.removeAttributeNode(a);
      scrub(n);}};
    scrub(body);
    return [...body.childNodes].map(n=>document.importNode(n,true));
  }catch(e){return [];}}

         a typed change the next time anything else redraws them (clicking
         one, or switching region) — the same kind of accepted, low-stakes
         staleness Task 1 accepted for a template-shared field, traded for
         never touching a field someone is actively typing or dictating
         into. */
      onChange:labels=>{const codes=labels.map(labelToSense);
        let r=rowFor(active);

        else if(r) e[key]=rows().filter(x=>x!==r);

      placeholder:u.tagPh||"",hint:u.tagHint||""}).el);
    (W.senses||[]).forEach(g=>{

          mark();drawAll();}},wtx(w.label,w.id)));});
      set.append(ws);panel.append(set);});
    const row=rowFor(active);
    if(row) panel.append(el("p",{style:"margin:.7rem 0 0"},
      el("button",{type:"button",class:"small",onclick:()=>{e[key]=rows().filter(x=>x!==row);mark();drawAll();}},C.clear||"")));};
  const drawSummary=()=>{summary.innerHTML="";
    rows().forEach(r=>summary.append(el("div",{class:"bodyrow"},

/* ======================= ENGINE: grid-select =======================
   Two axes, four cells, a vocabulary in each. The renderer knows the grid and
   the selecting; the widget knows what the cells are called and what is in
   them — which is why the words on those buttons are editable data. */
/* `opts.readonly` draws the grid without making anything selectable, and
   `opts.describe` follows it with whatever each cell says about itself. Both
   exist so that a page explaining a widget can show the real one rather than a
   picture of it — and so the cell names appear exactly once, on the widget,
   instead of being copied into whatever prose describes them. */
function gridSelect(e,W,keys,opts){opts=opts||{};const key=(keys&&keys[0])||"emotions";
  const u=T[lang].ui;
  const cells=W.cells||[];const ax=W.axes||{};
  const chosen=()=>e[key]||(e[key]=[]);
  const extra=id=>id.startsWith("x|");
  const itemLabel=id=>{if(extra(id)) return id.split("|").slice(2).join("|");
    const it=(W.items||[]).find(x=>x.id===id);return it?wtx(it.label,id):id;};
  const box=el("div",{});
  const wrap=el("div",{class:"quadwrap"});
  wrap.append(el("div",{class:"ax",style:"grid-column:2;grid-row:1"},wtx(ax.top,"")),
              el("div",{class:"ax v",style:"grid-column:1;grid-row:2"},wtx(ax.left,"")));
  const grid=el("div",{class:"quad",role:"group"});
  cells.forEach((c,ci)=>{const qb=el("div",{class:"q",style:cellStyle(c,ci)},el("div",{class:"qn"},wtx(c.label,c.id)));
    const btns=el("div",{class:"qb"});
    let tag=null;
    const idsFor=()=>[...(W.items||[]).filter(i=>i.cell===c.id).map(i=>i.id),
               ...((S.emo.extra[c.id]||[]).map(w=>"x|"+c.id+"|"+w))];
    const drawBtns=()=>{btns.innerHTML="";
      idsFor().forEach(id=>{
        if(opts.readonly){btns.append(el("span",{class:"emw"},itemLabel(id)));return;}
        const on=chosen().includes(id);
        const bt=el("button",{type:"button",class:"emb","aria-pressed":String(on)},itemLabel(id));
        bt.addEventListener("click",()=>{const now=chosen().includes(id);
          e[key]=now?chosen().filter(x=>x!==id):[...chosen(),id];
          bt.setAttribute("aria-pressed",String(!now));mark();
          /* Keep the tag field's own chips/text in sync with a button
             click too — never the other way of touching tag's own input,
             just a data-only refresh (see tagInput.refresh). */
          if(tag) tag.refresh();});
        btns.append(bt);});};
    drawBtns();
    /* One instance per cell, always visible — unlike svg-regions there is
       no "active" region to scope to. Freeform words live in two places at
       once: the id array (as "x|cellId|word", the existing encoding) and
       S.emo.extra[c.id] (a plain word list a second, separate editor
       already writes to) — onChange keeps both in sync so a word typed
       here shows up in that other editor too, and vice versa. Visible by
       default; a widget-level toggle in the editor can hide it, leaving
       only the buttons, which work identically either way. */
    if(!opts.readonly&&W.showTags!==false){
      const known=(W.items||[]).filter(i=>i.cell===c.id);
      tag=tagInput({
        values:()=>[...known.filter(k=>chosen().includes(k.id)).map(k=>itemLabel(k.id)),
                    ...chosen().filter(id=>id.startsWith("x|"+c.id+"|")).map(itemLabel)],
        vocab:()=>known.map(k=>({id:k.id,label:wtx(k.label,k.id)})),
        /* Typing here must never rebuild this field's own DOM (the Task 1
           bug, reintroduced). The button row below carries no in-progress
           typing of its own, so redrawing it immediately is safe and keeps
           a freshly-typed freeform word visible as a real toggle button
           right away, not just as text. */
        onChange:labels=>{
          const otherCellIds=chosen().filter(id=>!id.startsWith("x|"+c.id+"|")&&!known.some(k=>k.id===id));
          const newIds=[],newExtra=[];
          labels.forEach(label=>{
            const match=known.find(k=>norm(wtx(k.label,k.id))===norm(label));
            if(match) newIds.push(match.id);else{newIds.push("x|"+c.id+"|"+label);newExtra.push(label);}});
          e[key]=[...otherCellIds,...newIds];
          S.emo.extra[c.id]=newExtra;

        placeholder:u.tagPh||"",hint:u.tagHint||""});
      qb.append(tag.el);}
    qb.append(btns);grid.append(qb);});
  wrap.append(grid,el("div",{class:"ax v r",style:"grid-column:3;grid-row:2"},wtx(ax.right,"")),
              el("div",{class:"ax",style:"grid-column:2;grid-row:3"},wtx(ax.bottom,"")));
  if(opts.readonly) wrap.classList.add("gq");
  box.append(wrap);
  if(opts.describe&&cells.some(c=>c.note))
    box.append(el("div",{class:"qdesc"},...cells.map((c,ci)=>
      el("div",{class:"qd",style:cellStyle(c,ci)},
        el("strong",{style:`color:${cellColor(c,ci).deep}`},wtx(c.label,c.id)),wtx(c.note,"")))));
  return box;}

/* ======================= ENGINE: card-board =======================
   Cards opened one at a time. Each leads with what is already mapped, then a
   quick way to add something the person already knows, then the questions that
   find a new one — folded away, because a page that opens with questions is a
   form and a page that opens with your own answers is a map.

   Its content is the board (S.goodday), keyed by field id; the widget says
   which fields each card holds and what to call them. */
let boardOpen=null;

function cardBoard(store,W,keys){
  const C=locBag(W.copy,{});
  const cards=W.cards||[];
  const notes=locBag(W.notes,{});
  const P=locBag(W.protocols,null);
  const menu=k=>{const own=(W.menus||{})[k];return own?menuList(own):menuOf(k);};
  const val=f=>S.goodday[f];
  const wrap=el("div",{});
  if(boardOpen===null) boardOpen=(cards[0]||{}).id||null;

  const count=c=>((c.lists||[]).reduce((n,l)=>n+((val(l.field)||[]).length),0))
    +((c.prose||[]).filter(pr=>nonEmpty(val(pr.field))).length);
  /* One field is drawn twice on an open card: as what is on the board, and as
     the menu's pills below. A change made in either redraws both, so a picked
     option lands on the board at once and a removed one is no longer pressed. */
  const drawsOf={};const onDraw=(f,fn)=>{(drawsOf[f]=drawsOf[f]||[]).push(fn);};
  const changed=f=>(drawsOf[f]||[]).forEach(fn=>fn());

  /* one mapped list: what is there, and a box to add to it */
  const listBlock=(l,redraw)=>{const box=el("div",{class:"maplist"});
    const chosen=()=>S.goodday[l.field]||[];
    const chips=el("div",{class:"pills"});
    const draw=()=>{chips.innerHTML="";
      if(!chosen().length){chips.append(el("span",{class:"hint"},C.nothing||""));return;}
      chosen().forEach(o=>chips.append(el("span",{class:"mapchip"},optionText(o),
        el("button",{type:"button",class:"x",title:C.remove||"","aria-label":(C.remove||"")+": "+optionText(o),
          onclick:()=>{S.goodday[l.field]=chosen().filter(x=>x!==o);mark();changed(l.field);redraw();}},"×"))));};
    const inp=el("input",{type:"text",class:"field",style:"min-height:0",
      placeholder:C.quick||"","aria-label":wtx(l.label,l.field)});
    const add=()=>{const v=inp.value.trim();if(!v) return;
      if(!hasOption(chosen(),v)) S.goodday[l.field]=[...chosen(),v];
      inp.value="";mark();changed(l.field);redraw();};
    inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();add();}});
    onDraw(l.field,draw);draw();
    box.append(el("div",{class:"mlhead"},wtx(l.label,l.field)),chips,
      el("div",{style:"display:flex;gap:.4rem;margin:.45rem 0 0"},inp,
        el("button",{type:"button",class:"small",onclick:add},C.add||"+")));
    return box;};

  /* the questions that find a new one, and the menus of the corpus's examples */
  const explore=(c)=>{const d=el("details",{class:"explore"},el("summary",{},C.explore||""));
    const inner=el("div",{class:"inner"});
    inner.append(el("p",{class:"hint"},C.exploreHint||""));
    if(!compact()&&nonEmpty(wtx(c.intro,""))) inner.append(el("p",{},wtx(c.intro,"")));
    (c.prose||[]).forEach(pr=>inner.append(labeled(S.goodday,pr.field,
      [wtx(pr.label,pr.field),wtx(pr.hint,"")],2)));
    (c.lists||[]).forEach(l=>{
      const box=el("div",{class:"qfield"});
      const wrapc=el("div",{class:"pills"});
      const chosen=()=>S.goodday[l.field]||[];
      /* the menu in the language being read, then whatever else is chosen; a
         pick made in another language is the same option (see MENUS) */
      const draw=()=>{wrapc.innerHTML="";const opts=menu(l.field);
        [...opts,...uniqOptions(chosen().filter(x=>!hasOption(opts,x)))].forEach(o=>{
          const on=hasOption(chosen(),o);
          wrapc.append(el("button",{type:"button",class:"pill-btn","aria-pressed":String(on),onclick:()=>{
            S.goodday[l.field]=on?chosen().filter(x=>!sameOption(x,o)):[...chosen(),o];mark();changed(l.field);drawCards();}},optionText(o)));});};
      onDraw(l.field,draw);draw();
      box.append(el("label",{class:"lbl"},wtx(l.label,l.field),
        nonEmpty(wtx(l.hint,""))?el("span",{class:"hint"},wtx(l.hint,"")):null),wrapc);
      inner.append(box);});
    ((notes[c.id])||[]).forEach(n=>inner.append(el("p",{class:"hint"},n)));
    if(c.protocol&&P){const pr=el("details",{class:"quiet"},
        el("summary",{},c.protocol==="switch"?P.switchH:P.treatyH));
      pr.append(el("div",{class:"inner"},c.protocol==="switch"
        ?el("ol",{class:"steps"},...P.switch.map(x=>el("li",{},el("span",{},x))))
        :el("blockquote",{},P.treaty)));
      inner.append(pr);}
    d.append(inner);return d;};

  const cardsRow=el("div",{class:"mapcards",role:"tablist"});
  const openBox=el("div",{class:"mapopen"});
  const drawCards=()=>{cardsRow.innerHTML="";
    cards.forEach(c=>{const on=boardOpen===c.id;const n=count(c);
      cardsRow.append(el("button",{type:"button",class:"mapcard "+c.id,role:"tab","aria-selected":String(on),
        onclick:()=>{boardOpen=on?null:c.id;drawCards();drawOpen();}},
        el("span",{class:"mk"},wtx(c.label,c.id)),
        el("span",{class:"md"},wtx(c.blurb,"")),
        el("span",{class:"mn"},n?String(n):"—")));});};
  const drawOpen=()=>{openBox.innerHTML="";for(const f in drawsOf) delete drawsOf[f];
    const c=cards.find(x=>x.id===boardOpen);if(!c) return;
    const sec=el("section",{class:"mapsection "+c.id},el("h2",{},wtx(c.label,c.id)));
    if(!compact()&&nonEmpty(wtx(c.blurb,""))) sec.append(el("p",{class:"aside"},wtx(c.blurb,"")));
    sec.append(el("h3",{},C.mapped||""));
    (c.lists||[]).forEach(l=>sec.append(listBlock(l,drawCards)));
    if((c.prose||[]).length){const dl=el("div",{class:"mapprose"});
      const filled=(c.prose||[]).filter(pr=>nonEmpty(val(pr.field)));
      if(!filled.length) dl.append(el("p",{class:"hint"},C.nothing||""));
      filled.forEach(pr=>dl.append(el("div",{class:"mprow"},
        el("span",{class:"r"},wtx(pr.label,pr.field)),el("span",{},String(val(pr.field)).trim()))));
      sec.append(dl);}
    sec.append(explore(c));
    openBox.append(sec);};
  drawCards();drawOpen();
  wrap.append(cardsRow,openBox);
  return wrap;}

const ENGINES={"svg-regions":svgRegions,"grid-select":gridSelect,"card-board":cardBoard};

/* ======================= WHAT THE RENDERER IS =======================
   A renderer, and nothing else. It knows how to draw widget kinds, where to
   put them, how to save a file, and how to add, park or delete a module. It
   ships with no activities: there is no built-in module and no built-in
   booklet, so there is nothing here a person cannot take out.

   Everything a reader sees comes from their booklet file. A published site may
   hand the page a starter booklet and point it at a folder of modules to
   install — that is the site's wrapper, not the renderer and not the file
   format. Opened straight from disk with a booklet, this page is complete. */

/* Two views are the renderer's own, because they explain and display its own
   capabilities rather than carrying any activity: the history of whatever was
   kept, and the guide to the quadrant widget. */
const MODE_HISTORY={id:"history", kind:"log",   accent:"history", home:false};
const FIXED_MODES=[MODE_HISTORY];

/* The body figures are the bodymap widget's own configuration, so they live
   with the widget. A booklet may override them. */
const BODY_DEFAULT={
  front:["head","jaw","neck","shoulders","chest","arms","stomach","hips","legs","feet"],
  back:["head","neck","shoulders","back","lowerback","arms","hips","legs","feet"],
  chips:["allover"], sides:["front","back"]};

/* An empty booklet. This is what the page holds before a file arrives — not a
   default set of activities, because there is no such thing here. */
const EMPTY_BOOKLET={booklet:0.2, id:"", version:"", modules:[], widgets:[], body:BODY_DEFAULT, raw:{source:""}};

/* Modules the page has been *offered* — fetched from a site's module folder,
   or pasted in. Never baked in: this starts empty and stays empty unless
   something puts a module in it. */
/* KNOWN GAP (2026-09-29): moduleFromText() (the old JSON-fence module parser) and
   resolveShelf() (fetch-and-parse a shelf entry through it) were deleted with
   the "add a map" feature, the last thing that called them — see STATUS.md.
   The current "Add a module" dialog uses the format-aware shelfText()/
   addModuleFromText() path instead. */
/* The wrapper — a published site — may say where its modules live and hand the
   page a starter booklet. It does that by putting a config element in the page
   around this one. That element is not part of
   the renderer or of the booklet format: with no wrapper at all, the page is a
   renderer and a Load button, which is the whole of what it needs to be. */
function wrapperConfig(){
  const tag=document.getElementById("booklet-wrapper");
  if(tag){try{return JSON.parse(tag.textContent||"{}");}catch(e){}}
  return null;}
/* Anything in the modules folder is offered; anything not there can be pasted.
   Both routes end in the same place, which is the module going into the file. */
/* ===================== REGISTRIES =====================
   A registry is a list of modules somebody offers. It is one JSON file:

     { "registry": 1,
       "name": {"en": "…"},
       "modules": [
         { "id":"who/what", "version":"0.1", "file":"what.md",
           "title":{…}, "blurb":{…}, "engines":["grid-select"] },
         { "id":"who/other", "version":"0.1", "module": { …whole module… } }
       ] }

   The entries carry enough to DRAW THE MENU, so the page fetches one small
   file instead of every module it might one day offer. Before this, listing
   four activities cost 64KB on every visit — the whole bank, downloaded in
   full, to render four button labels, and growing with every module added.

   An entry either names a `file` (fetched only when somebody adds it) or
   carries the whole `module` inline — which is what lets one file be an
   entire registry, with nothing to fetch at all.

   A bare array of filenames is the old shape and still works: there is no
   metadata in it, so the modules are fetched up front as they always were.

   Sources come from the wrapper (`registries`, or the older single
   `modules_url`) and from the booklet itself (`registries`), so a reader can
   point their own file at whatever they like without a site's permission. */
let SHELF={};
const shelfList=()=>Object.values(SHELF);
const listingOf=mod=>({id:mod.id,version:mod.version,title:mod.title,blurb:mod.blurb,
  engines:[...new Set((mod.widgets||[]).map(w=>w.engine).filter(Boolean))],
  mod,from:""});
function shelfAdd(mod){if(!moduleOk(mod)) return false;SHELF[mod.id]=listingOf(mod);return true;}
function shelfPut(entry,base,from){
  if(!entry||typeof entry.id!=="string") return false;
  if(entry.module) return shelfAdd(entry.module)&&(SHELF[entry.id].from=from,true);
  SHELF[entry.id]={id:entry.id,version:entry.version,title:entry.title,blurb:entry.blurb,
    engines:Array.isArray(entry.engines)?entry.engines:[],
    mod:null,url:joinUrl(base,entry.file||(entry.id.split("/").pop()+".md")),from};
  return true;}
/* Resolve `rel` against `base` the way a browser resolves a link.
   Two traps, both hit on the first run:
     - `new URL(rel, base)` REQUIRES an absolute base, and ours is usually a
       site-relative path like /tools/booklet/modules/registry.json, so
       it throws and the fallback is what actually runs;
     - a fallback that appends to the base turns .../registry.json into
       .../registry.json/the-map.md. A relative URL replaces the last
       segment, it does not extend it. */
const joinUrl=(base,rel)=>{
  const here=(typeof location!=="undefined"&&location.href)||"http://booklet.invalid/";
  try{return new URL(rel,new URL(String(base),here)).href;}
  catch(e){
    /* No usable URL constructor. Resolve by hand, and mind that an entry may
       name a module somewhere else entirely — an absolute address, or a
       protocol-relative one, replaces the base rather than hanging off it. */
    const r=String(rel||"");
    if(/^[a-z][a-z0-9+.-]*:/i.test(r)||r.startsWith("//")) return r;
    if(r.startsWith("/")) return r;
    return String(base||"").replace(/[?#].*$/,"").replace(/[^/]*$/,"")+r;}};

/* every source this page will read a registry from */
function registrySources(){
  const cfg=wrapperConfig()||{};
  const out=[];
  const push=u=>{if(typeof u==="string"&&u&&!out.includes(u)) out.push(u);};
  (Array.isArray(cfg.registries)?cfg.registries:[]).forEach(push);
  if(cfg.modules_url) push(joinUrl(cfg.modules_url.replace(/\/?$/,"/"),"registry.json"));
  (Array.isArray(TPL.registries)?TPL.registries:[]).forEach(push);
  return out;}
/* Opened straight from disk, with no wrapper at all, registrySources() is
   empty and loadShelf() (run once, at boot) fetches nothing — which is
   correct: a page load must not reach the network on its own. "Add a
   module" is the one place a reader asks for the public repo's own
   examples, so ITS OWN open handler is where that one fetch happens, lazily,
   never at boot. A wrapper that wants none of that sets `no_default_registry`
   in its config. */
const DEFAULT_REGISTRY="https://raw.githubusercontent.com/benthepsychologist/booklet-registry/main/registry.json";

async function loadRegistry(url){
  try{
    const r=await fetch(url,{cache:"no-cache"});if(!r.ok) return false;
    const data=await r.json();
    if(!data||!Array.isArray(data.modules)) return false;
    const from=tx(data.name,"");
    data.modules.forEach(e=>shelfPut(e,url,from));
    return true;
  }catch(e){return false;}}

async function loadShelf(){
  const cfg=wrapperConfig()||{};
  (cfg.modules||[]).forEach(m=>shelfAdd(m&&m.block?(({block,...r})=>r)(m):m));
  const urls=registrySources();
  if(!urls.length) return;
  await Promise.all(urls.map(loadRegistry));}


/* A published site may hand over a PRESET: a design with no content — a blank
   workbook — so a first visit is not an empty page. It is taken only when
   there is nothing here already, so it can never overwrite a person's work,
   and it is a file like any other: the page has no idea it came from a
   wrapper rather than from disk. `starter_url` is the old name, still read. */
function applyPreset(R){
  if(!R||!R.ok) return false;
  /* Reached only when loadLocal restored no usable template — a genuinely
     first visit, storage that came back empty, or (once, per reader) an
     older save from before the booklet's own structure was part of what got
     persisted. That last case may still carry entries with no matching
     design, so reinstall the preset without replacing those; a truly empty
     first visit takes the whole blank preset exactly as if the reader had
     loaded its file. */
  if(sessionHasContent()){
    if(shouldAdopt(R.template)) adoptTemplate(R.template);
    else modulesIn(R.template).forEach(m=>{if(!allModules().some(x=>x.id===m.id)) addModule(m);});
  }else applyParsed(R,"replace");
  return true;}
async function loadPreset(){
  const cfg=wrapperConfig()||{};
  const url=cfg.preset_url||cfg.starter_url;
  if(!url) return false;
  const gen=bookletGen;
  try{const r=await fetch(url,{cache:"no-cache"});if(!r.ok) return false;
    const text=await r.text();
    if(gen!==bookletGen) return false;      // another booklet was opened while it downloaded
    return applyPreset(parseFile(text));}catch(e){return false;}}

/* the booklet in force */
let TPL = EMPTY_BOOKLET;
/* A template may carry its own wording inline, as a plain string or as
   {en:…, fr:…}. Anything it does not name falls through to the built-in copy,
   which is why a preset can rename one card without restating the app. */
const tx=(v,fallback)=>{if(v==null) return fallback;
  if(typeof v==="string") return v;
  if(typeof v==="object"){const r=pickLoc(v);return r===undefined?fallback:r;}
  return fallback;};
/* ---- languages: one lookup chain for every localised value ----
   A booklet may DECLARE the languages it offers (`languages`, a list of tags, in
   its front matter or its template). Declared, the chain never leaves them: a
   Spanish-only booklet never reads an English or French word, because no slot is
   ever asked for one. Undeclared, it is what it always was, with Spanish added:
   the selected language, its primary subtag (es-AR → es), English, French, and
   only then any language the value happens to carry. */

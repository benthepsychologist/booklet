<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Activity Kit</title>
<!-- Installable when this file is served over https, which is what makes the
     phone keep its data (Safari does not evict storage for a Home Screen web
     app the way it does for a tab) and what turns on the share sheet.
     Opened straight from disk the manifest simply 404s and nothing else
     changes — the page has never needed the network for anything. -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#12996E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Activity Kit">
<link rel="apple-touch-icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="96" fill="%23FFFCF4"/><circle cx="256" cy="256" r="150" fill="none" stroke="%2312996E" stroke-width="26"/><path d="M330 182l-47 113-113 47 47-113z" fill="%2312996E"/></svg>'>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="96" fill="%23FFFCF4"/><circle cx="256" cy="256" r="150" fill="none" stroke="%2312996E" stroke-width="26"/><path d="M330 182l-47 113-113 47 47-113z" fill="%2312996E"/></svg>'>
<style>
  /* ── Petrol, Paper & Clay ──────────────────────────────────────────────
     The site's palette, and its discipline: paper dominates, petrol is the
     ONLY action colour, clay is a sparse human accent — an eyebrow, a step
     marker — never a competing action colour. The tool used to give each
     activity its own accent; that is exactly the "competing action colour"
     the site's design system rules out, so every activity is petrol now.

     The four quadrant colours stay distinct, because they are data rather
     than chrome: a reader tells them apart by hue. They are retuned to sit
     on paper rather than on the old off-white. */
  :root{
    --paper:#F7F2E8; --paper-deep:#EEE6DA; --ink:#292421; --muted:#59514B;
    --rule:#D8C9B5; --field:#FFFFFF; --reader:#292421; --warn:#A04E34;
    --petrol:#103E46; --petrol-deep:#0B3137; --clay:#A04E34;
    /* four palette tones, used for messages, tags and card accents. They are
       not a quadrant vocabulary: what colour a grid cell takes is the widget's. */
    --tone-warm:#F0D9CF; --tone-warm-deep:#A04E34;
    --tone-green:#DCE7D2; --tone-green-deep:#4F6B3A;
    --tone-slate:#D9DEE2; --tone-slate-deep:#465B66;
    --tone-teal:#D5E3E1; --tone-teal-deep:#166B63;
    --accent:var(--petrol); --accent-soft:#E3EAEA;
    --note:#EEE6DA;
    /* The site's faces, named but never fetched: this page makes no external
       request of any kind, and a visitor arriving from the site already has
       them. Anywhere else it falls back to Georgia and the system sans, which
       is a small cost against sending a reader's visit to a font host. */
    --serif:'Lora', Georgia, 'Times New Roman', serif;
    --sans:'Source Sans 3', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:1.0625rem;line-height:1.6;-webkit-text-size-adjust:100%}
  body{margin:0;min-height:100vh}
  a{color:var(--accent)}
  button,input,textarea,select{font:inherit;color:inherit}
  button{cursor:pointer;font-family:var(--sans)}
  :focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  p{margin:0 0 1rem}
  h2{font-family:var(--serif);font-weight:600;font-size:1.6rem;line-height:1.25;margin:0 0 .5rem;letter-spacing:0}
  h3{font-family:var(--sans);font-weight:700;font-size:.95rem;letter-spacing:.02em;margin:1.75rem 0 .5rem;color:var(--petrol)}
  .aside{color:var(--muted);font-size:.95rem}
  .hint{color:var(--muted);font-size:.88rem;font-family:var(--sans)}

  /* top bar */
  .bar{position:sticky;top:0;z-index:5;background:rgba(255,252,244,.94);backdrop-filter:blur(6px);border-bottom:3px solid var(--accent);
       display:flex;align-items:center;gap:.5rem;padding:.5rem .8rem;flex-wrap:wrap;font-family:var(--sans)}
  .bar .home{border:0;background:transparent;padding:.25rem .4rem;font-family:var(--serif);font-size:1.05rem;color:var(--ink);text-align:left;flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .home:hover{color:var(--accent)}
  .bar .navb{border:2px solid var(--rule);background:var(--field);border-radius:999px;padding:.3rem .8rem;font-size:.85rem;font-weight:600;white-space:nowrap;color:var(--ink)}
  .bar .navb:hover{border-color:var(--accent);color:var(--accent)}
  .bar .navb[aria-current="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
  .bar .navb.attention{border-color:var(--warn);color:var(--warn)}
  .lang{display:inline-flex;border:2px solid var(--rule);border-radius:999px;overflow:hidden}
  .lang button{border:0;background:transparent;padding:.2rem .6rem;font-size:.8rem;font-weight:700;color:var(--muted)}
  .lang button[aria-pressed="true"]{background:var(--ink);color:#fff}
  .tools{display:flex;gap:.4rem;flex-wrap:wrap}
  @media (max-width:520px){ .bar{padding:.45rem .6rem} .bar .home{flex-basis:100%;order:-1} }

  /* page */
  .page{max-width:1080px;margin:0 auto;padding:1.5rem 1rem 6rem}
  @media (min-width:900px){.page{padding:2.5rem 2rem 6rem}}
  .col{max-width:64ch}
  .frame{display:grid;grid-template-columns:1fr} .frame>*{min-width:0}
  @media (min-width:900px){.frame{grid-template-columns:230px minmax(0,1fr);gap:3rem} nav.rail{position:sticky;top:4.4rem;align-self:start}}
  nav.rail ol{list-style:none;margin:0 0 1rem;padding:0 0 .25rem;display:flex;gap:.25rem;overflow-x:auto;scrollbar-width:thin} nav.rail li{flex:none}
  @media (min-width:900px){nav.rail ol{flex-direction:column;overflow:visible}}
  nav.rail button{border:0;background:transparent;text-align:left;color:var(--muted);padding:.35rem .6rem;border-left:3px solid transparent;font-size:.9rem;white-space:nowrap;border-radius:0 6px 6px 0}
  @media (min-width:900px){nav.rail button{white-space:normal}}
  nav.rail button:hover{color:var(--ink);background:var(--accent-soft)}
  nav.rail button .n{display:inline-block;width:1.5rem;color:var(--rule);font-weight:700}
  nav.rail button.here{border-left-color:var(--accent);color:var(--ink);background:var(--accent-soft)}
  nav.rail button.here .n{color:var(--accent)}

  /* home */
  .hero h1{font-family:var(--serif);font-weight:600;font-size:2.1rem;line-height:1.15;margin:0 0 .4rem;letter-spacing:0}
  .hero .sub{font-size:1.12rem;color:var(--muted);margin:0 0 1.25rem;line-height:1.45}
  .greet{font-family:var(--sans);font-weight:700;color:var(--accent);margin:0 0 .5rem;font-size:1rem}
  .notecard{background:var(--note);border-radius:14px;padding:.9rem 1.1rem;margin:0 0 1.25rem;max-width:64ch}
  .notecard .k{font-family:var(--sans);font-size:.8rem;font-weight:700;color:#7A5E00;margin:0 0 .3rem}
  .notecard p{margin:0 0 .5rem} .notecard p:last-child{margin:0}
  .modes{display:grid;grid-template-columns:1fr;gap:.8rem;margin:1.5rem 0 0;max-width:64ch}
  @media (min-width:700px){.modes{grid-template-columns:repeat(2,1fr);max-width:none}}
  .mode{font-family:var(--sans);text-align:left;border:0;border-top:4px solid var(--mc);background:#fff;border-radius:16px;padding:1.1rem 1.15rem 1rem;line-height:1.4;min-height:9rem;display:flex;flex-direction:column;gap:.4rem;
        box-shadow:0 1px 2px rgba(31,36,48,.06),0 10px 24px -18px rgba(31,36,48,.4);transition:transform .12s,box-shadow .12s;font-family:var(--serif)}
  .mode:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(31,36,48,.08),0 16px 30px -18px rgba(31,36,48,.5)}
  .mode .top{display:flex;align-items:center;gap:.6rem}
  .mode svg{width:2rem;height:2rem;flex:none;color:var(--mc)}
  .mode .k{font-family:var(--serif);font-size:1.2rem;font-weight:600;color:var(--petrol)}
  .mode .d{color:var(--muted);font-size:.93rem}
  .mode .c{margin-top:auto;font-family:var(--sans);font-size:.8rem;font-weight:600;color:var(--muted);display:flex;gap:.5rem;flex-wrap:wrap}
  .mode .c .pill{background:var(--paper-deep);border-radius:999px;padding:.05rem .55rem}
  .mode .c .pill.live{background:var(--mcs);color:var(--ink)}
  .notice{border:2px dashed var(--rule);border-radius:12px;padding:.8rem 1rem;font-size:.9rem;color:var(--muted);margin:0 0 1.5rem;font-family:var(--sans)}
  .notice strong{color:var(--ink);font-weight:700}
  .unsaved{font-family:var(--sans);font-size:.85rem;font-weight:700;color:var(--warn);background:#FFE4DE;border-radius:999px;padding:.15rem .7rem}
  .quietlink,.linkbtn{border:0;background:transparent;color:var(--accent);text-decoration:underline;padding:0;font-size:.92rem;text-align:left;font-family:var(--sans);font-weight:600}
  .quietlink{color:var(--muted);font-weight:500}

  /* fields */
  .field{width:100%;background:var(--field);color:var(--reader);border:2px solid var(--rule);
         padding:.5rem .65rem;border-radius:10px;resize:vertical;min-height:2.8rem;line-height:1.5}
  .field::placeholder{color:#9AA0B4;font-style:italic}
  .field:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
  .field.starter{color:#6B5A2E;background:#FFF9E3;border-style:dashed}
  label.lbl{display:block;font-size:.95rem;margin:1rem 0 .3rem;font-family:var(--sans);font-weight:700}
  label.lbl span.hint{display:block;font-weight:400}
  .startertag{display:inline-block;font-family:var(--sans);font-size:.72rem;font-weight:700;color:#7A5E00;background:var(--note);border-radius:999px;padding:.05rem .5rem;margin:.3rem 0 0}
  .sentence{font-size:1.4rem;line-height:1.8;margin:1.25rem 0 1.5rem}
  .sentence input{display:inline-block;width:auto;min-width:6ch;max-width:100%;font-size:inherit;background:var(--field);
                  color:var(--reader);border:0;border-bottom:2px solid var(--accent);padding:0 .35rem;border-radius:6px 6px 0 0;line-height:1.4;vertical-align:baseline}
  .sentence input:focus{outline:none;background:var(--accent-soft)}
  .sentence input::placeholder{color:#9AA0B4;font-style:italic;font-size:.85em}

  details{border:2px solid var(--rule);border-radius:12px;margin:1rem 0;background:#fff}
  details summary{cursor:pointer;padding:.7rem 1rem;list-style:none;display:flex;align-items:center;gap:.6rem;font-family:var(--sans);font-weight:600}
  details summary::-webkit-details-marker{display:none}
  details summary::before{content:"";width:.5rem;height:.5rem;border-right:2px solid var(--accent);border-bottom:2px solid var(--accent);transform:rotate(-45deg);transition:transform .15s;flex:none}
  details[open] summary::before{transform:rotate(45deg)}
  details .inner{padding:0 1rem 1rem}
  details.quiet{border-style:dashed;background:transparent}
  details.why{border:0;background:var(--accent-soft);margin:.5rem 0 1rem} details.why .inner{padding-top:.25rem}

  section.step{padding:2.25rem 0 1rem;border-top:2px solid var(--rule)}
  section.step h2 .n, h2.bhead .n{display:inline-flex;align-items:center;justify-content:center;width:2rem;height:2rem;border-radius:50%;background:var(--accent);color:#fff;font-family:var(--sans);font-size:1rem;font-weight:700;margin-right:.6rem;vertical-align:middle}
  blockquote{margin:1.25rem 0;padding:0 0 0 1rem;border-left:3px solid var(--accent);color:var(--muted);font-style:italic}
  ul.plain{padding-left:1.2rem;margin:0 0 1rem} ul.plain li{margin:.3rem 0}
  .kinds{display:grid;grid-template-columns:1fr;gap:.6rem;margin:1rem 0 1.25rem}
  @media (min-width:600px){.kinds{grid-template-columns:1fr 1fr}}
  .kind{text-align:left;border:2px solid var(--rule);background:#fff;border-radius:12px;padding:.85rem 1rem;line-height:1.4;font-family:var(--serif)}
  .kind:hover{border-color:var(--accent)}
  .kind[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
  .kind .k{display:block;font-weight:600;margin-bottom:.2rem} .kind .d{display:block;font-size:.9rem;color:var(--muted)}
  .kind-detail{border-left:3px solid var(--accent);padding:.25rem 0 .25rem 1rem;margin:1rem 0}
  .kind-detail h4{margin:0 0 .5rem;font-weight:600;font-size:1.02rem}
  .prompt{font-style:italic;color:var(--accent);margin:.5rem 0}
  .card{background:#fff;border:2px solid var(--rule);border-radius:14px;padding:1.1rem 1.3rem .9rem;margin:1.25rem 0;box-shadow:0 10px 24px -20px rgba(31,36,48,.5)}
  .card .row{display:grid;grid-template-columns:1fr;gap:.15rem;padding:.55rem 0;border-bottom:1px dotted var(--rule)}
  @media (min-width:560px){.card .row{grid-template-columns:11rem 1fr;gap:1rem;align-items:start}}
  .card .row:last-child{border-bottom:0}
  .card .row .k{color:var(--accent);font-family:var(--sans);font-weight:700;font-size:.9rem;padding-top:.5rem}
  .card .field{border-color:transparent;background:var(--paper)} .card .field:focus{border-color:var(--accent);background:#fff}
  .area{border:2px solid var(--rule);border-radius:14px;margin:1rem 0;background:#fff}
  .area summary{display:flex;align-items:center;gap:.6rem;padding:.7rem 1rem;cursor:pointer;list-style:none}
  .area summary::-webkit-details-marker{display:none}
  .area summary input{flex:1 1 auto;min-width:0;background:transparent;border:0;border-bottom:2px solid var(--accent);color:var(--reader);padding:.1rem .3rem;font-size:1.1rem;font-family:var(--serif)}
  .area summary input:focus{outline:none;background:var(--accent-soft)}
  .area summary .x{border:0;background:transparent;color:var(--muted);font-size:1.3rem;line-height:1;padding:.2rem .5rem;border-radius:6px}
  .area summary .x:hover{color:var(--warn);background:var(--paper-deep)}
  .area .inner{padding:0 1rem 1rem}
  .add{border:2px dashed var(--accent);background:transparent;border-radius:12px;padding:.7rem 1rem;width:100%;color:var(--accent);font-weight:700}
  .add:hover{background:var(--accent-soft)}

  /* chips (previous entries) + pills */
  .chips{display:flex;gap:.4rem;overflow-x:auto;padding:.25rem 0 .5rem;scrollbar-width:thin;margin:0 0 .75rem}
  .chip{flex:none;border:2px solid var(--rule);background:#fff;border-radius:999px;padding:.3rem .8rem;font-size:.85rem;font-weight:600;white-space:nowrap}
  .chip:hover{border-color:var(--accent)}
  .chip[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
  .chips-empty{font-size:.9rem;color:var(--muted);margin:0 0 .75rem;font-family:var(--sans)}
  .pills{display:flex;gap:.45rem;flex-wrap:wrap;margin:.25rem 0 1rem}
  .pill-btn{border:2px solid var(--accent);background:#fff;color:var(--accent);border-radius:999px;padding:.4rem .95rem;font-size:.95rem;font-weight:700;line-height:1.2}
  .pill-btn:hover{background:var(--accent-soft)}
  .pill-btn[aria-pressed="true"]{background:var(--accent);color:#fff}
  .pill-btn.none{border-color:var(--rule);color:var(--muted)} .pill-btn.none[aria-pressed="true"]{background:var(--muted);border-color:var(--muted);color:#fff}

  /* entry read view */
  .entry{background:#fff;border:2px solid var(--rule);border-radius:14px;padding:.9rem 1.1rem;margin:0 0 1rem}
  .entry .when{color:var(--muted);font-size:.9rem;margin:0 0 .5rem;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;font-family:var(--sans)}
  .entry .when .tag{border-radius:999px;padding:.05rem .6rem;font-size:.76rem;font-weight:700;color:#fff;background:var(--muted)}
  .entry .when .tag.today{background:var(--petrol)} .entry .when .tag.checkin{background:var(--petrol)}
  .entry .when .area{border:2px solid var(--rule);border-radius:999px;padding:0 .55rem;font-size:.76rem;font-weight:700;color:var(--ink)}
  .entry dl{margin:0;display:grid;grid-template-columns:1fr;gap:.2rem .75rem}
  @media (min-width:560px){.entry dl{grid-template-columns:12rem 1fr}}
  .entry dt{color:var(--muted);font-size:.88rem;padding-top:.15rem;font-family:var(--sans);font-weight:600}
  .entry dd{margin:0 0 .35rem;color:var(--reader);white-space:pre-wrap}
  .entry ul{margin:0;padding-left:1.1rem;color:var(--reader)}
  .entry .emos{display:flex;gap:.35rem;flex-wrap:wrap}
  .entry .emo{border-radius:999px;padding:.1rem .6rem;font-size:.85rem;color:var(--ink);font-family:var(--sans);font-weight:600}
  .entry .foot{display:flex;gap:.5rem;justify-content:flex-end;margin-top:.5rem;align-items:center;flex-wrap:wrap}
  .small{border:2px solid var(--rule);background:#fff;border-radius:999px;padding:.3rem .8rem;font-size:.85rem;font-weight:600}
  .small:hover{border-color:var(--accent);color:var(--accent)} .small.danger{color:var(--warn)}
  .small.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .inlineconfirm{display:inline-flex;gap:.4rem;align-items:center;font-size:.9rem;color:var(--warn);font-family:var(--sans)}

  /* area focus card + chosen move */
  .focuscard{border:0;border-left:6px solid var(--accent);background:var(--accent-soft);border-radius:0 14px 14px 0;padding:.9rem 1.1rem;margin:0 0 1.25rem}
  .focuscard .k{font-family:var(--sans);font-size:.8rem;font-weight:700;color:var(--accent);margin:0 0 .15rem;text-transform:none}
  .focuscard .v{color:var(--ink);margin:0 0 .6rem;white-space:pre-wrap}
  .focuscard .v.big{font-size:1.15rem;line-height:1.45}
  .focuscard .v:last-of-type{margin-bottom:.4rem}
  .focuscard button.flink{border:0;background:transparent;color:var(--accent);padding:0;text-decoration:underline;font-size:.9rem;font-weight:700}

  /* finalize row */
  .finrow{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;margin:1.75rem 0 0;padding-top:1.25rem;border-top:2px solid var(--rule)}
  .finalize{background:var(--accent);color:#fff;border:0;border-radius:999px;padding:.75rem 1.6rem;font-size:1.05rem;font-weight:700;box-shadow:0 8px 18px -10px var(--accent)}
  .finalize:hover{filter:brightness(1.08);transform:translateY(-1px)}

  /* quadrant */
  .quadwrap{display:grid;grid-template-columns:1.5rem 1fr 1.5rem;grid-template-rows:auto 1fr auto;gap:.3rem;margin:1rem 0}
  .ax{color:var(--muted);font-size:.8rem;text-align:center;align-self:center;justify-self:center;font-family:var(--sans);font-weight:700}
  .ax.v{writing-mode:vertical-rl;transform:rotate(180deg)} .ax.v.r{transform:none}
  .quad{grid-column:2;grid-row:2;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:.45rem}
  .q{border-radius:14px;padding:.75rem .8rem .8rem;min-height:9rem;display:flex;flex-direction:column;gap:.5rem}
  .q .qn{font-family:var(--sans);font-size:.95rem;font-weight:800;color:var(--qd)}
  .q .qb{display:flex;flex-wrap:wrap;gap:.4rem}
  .emb{border:2px solid rgba(255,255,255,.9);background:rgba(255,255,255,.75);color:var(--ink);border-radius:999px;padding:.45rem .85rem;font-size:.92rem;font-weight:600;line-height:1.2;min-height:2.4rem}
  .emb:hover{border-color:var(--qd)}
  .emb[aria-pressed="true"]{background:var(--qd);color:#fff;border-color:var(--qd)}
  @media (max-width:480px){.q{min-height:8rem;padding:.55rem .55rem .6rem} .emb{padding:.4rem .7rem;font-size:.88rem}}

  /* thoughts */
  .thought{display:flex;align-items:baseline;gap:.5rem;margin:.45rem 0}
  .thought .pre{color:var(--accent);flex:none;font-size:.95rem;font-family:var(--sans);font-weight:700}
  .thought input{flex:1 1 auto;min-width:0;background:var(--field);color:var(--reader);border:2px solid var(--rule);padding:.45rem .65rem;border-radius:10px}
  .thought input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  @media (max-width:480px){.thought{flex-direction:column;gap:.15rem;align-items:stretch}}

  /* history */
  .filters{display:flex;gap:.4rem;flex-wrap:wrap;margin:0 0 .75rem}
  .filters button{border:2px solid var(--rule);background:#fff;border-radius:999px;padding:.3rem .9rem;font-size:.88rem;font-weight:600}
  .filters button[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
  .daysep{color:var(--muted);font-size:.85rem;margin:1.25rem 0 .5rem;border-bottom:2px solid var(--rule);padding-bottom:.2rem;font-family:var(--sans);font-weight:700}
  .bars{margin:1rem 0}
  .barrow{display:grid;grid-template-columns:7rem 1fr 3rem;gap:.6rem;align-items:center;margin:.4rem 0;font-size:.92rem;font-family:var(--sans);font-weight:600}
  .bar-track{background:var(--paper-deep);border-radius:999px;height:1.2rem;overflow:hidden}
  .bar-fill{height:100%;border-radius:999px}
  .barrow .cnt{color:var(--muted);font-size:.85rem;text-align:right}

  /* feelings guide */
  .gq .q{min-height:7rem}
  .emw{display:inline-block;border:2px solid rgba(255,255,255,.9);background:rgba(255,255,255,.7);border-radius:999px;padding:.25rem .7rem;font-size:.9rem;font-family:var(--sans);font-weight:600}
  .dims{display:grid;grid-template-columns:1fr;gap:.75rem;margin:1rem 0 1.25rem}

/* ======================= THE BODY MAP (v0.3) =======================
   Sensation words are derived from the corpus's body-scan and grounding material
   (tension/ease, bracing, warmth, numbness, buzzing, settling, softening) and
   extended with plain-language neighbours. The corpus carries no sensation
   lexicon of its own — the one rich source in it is a vendored third-party book,
   which AGENTS.md §5 puts out of bounds, so nothing here is drawn from it.
   The stance copy IS the corpus's: invite, don't command.                     */
/* stored language-independently as "group:index" so a file written in one
   language still renders in the other */

/* ======================= ENGINE: svg-regions =======================
   Given a widget carrying one or more figures — each an SVG whose shapes have
   a `data-r` region id — let a person point at a region and say what it is
   like there. The renderer knows the interaction; the widget knows the body. */
function svgRegions(e,W,keys){const key=(keys&&keys[0])||"regions";
  const C=(W.copy||{})[lang]||(W.copy||{}).en||{};
  const figs=W.figures||[];
  const labelOf=id=>{const r=(W.regions||[]).find(x=>x.id===id);return r?wtx(r.label,id):id;};
  const senseWord=code=>{for(const g of (W.senses||[])) for(const w of (g.words||[]))
      if(w.id===code) return wtx(w.label,code);
    return code;};
  const figFor=id=>figs.find(f=>(f.regions||[]).includes(id));
  const wrap=el("div",{});
  let active=null, side=(figs[0]||{}).id||null;
  const rows=()=>e[key]||(e[key]=[]);
  const rowFor=id=>rows().find(r=>r.id===id);
  const sides=el("div",{class:"sideswitch",role:"group","aria-label":C.sideLbl||""});
  const fig=el("div",{});
  const chips=el("div",{class:"bodychips"});
  const panel=el("div",{class:"sensepanel"});
  const summary=el("div",{class:"bodysummary"});
  const setActive=id=>{active=id;const f=figFor(id);if(f) side=f.id;drawAll();};
  const setSide=s=>{side=s;const f=figs.find(x=>x.id===s);
    if(active&&f&&!(f.regions||[]).includes(active)) active=null;drawAll();};
  const drawSides=()=>{sides.innerHTML="";if(figs.length<2) return;
    figs.forEach(f=>{const n=rows().filter(r=>(f.regions||[]).includes(r.id)).length;
      sides.append(el("button",{type:"button",class:"sidebtn","aria-pressed":String(side===f.id),
        onclick:()=>setSide(f.id)},wtx(f.label,f.id),n?el("span",{class:"sn"},String(n)):null));});};
  const drawFig=()=>{const f=figs.find(x=>x.id===side)||figs[0];
    fig.innerHTML=(f&&f.svg)||"";
    fig.querySelectorAll(".rg").forEach(node=>{
      const id=node.getAttribute("data-r");
      node.classList.toggle("on",!!rowFor(id)||active===id);
      node.setAttribute("tabindex","0");node.setAttribute("role","button");
      node.setAttribute("aria-label",labelOf(id));
      node.onclick=()=>setActive(id);
      node.onkeydown=ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();setActive(id);}};});};
  const drawChips=()=>{chips.innerHTML="";(W.chips||[]).forEach(id=>{
      chips.append(el("button",{type:"button",class:"pill-btn","aria-pressed":String(!!rowFor(id)||active===id),
        onclick:()=>setActive(id)},labelOf(id)));});};
  const drawPanel=()=>{panel.innerHTML="";
    if(!active){panel.append(el("p",{class:"hint",style:"margin:0"},C.none||""));return;}
    panel.append(el("h4",{},labelOf(active)),el("p",{class:"hint",style:"margin:0"},C.pick||""));
    (W.senses||[]).forEach(g=>{
      const set=el("div",{class:"senseset"},el("div",{class:"lbl2"},wtx(g.label,g.id)));
      const ws=el("div",{class:"sensewrap"});
      (g.words||[]).forEach(w=>{const row=rowFor(active);const on=!!row&&row.s.includes(w.id);
        ws.append(el("button",{type:"button",class:"sense "+g.id,"aria-pressed":String(on),onclick:()=>{
          let r=rowFor(active);
          if(!r){r={id:active,s:[]};e[key]=[...rows(),r];}
          r.s=on?r.s.filter(x=>x!==w.id):[...r.s,w.id];
          if(!r.s.length) e[key]=rows().filter(x=>x!==r);
          mark();drawAll();}},wtx(w.label,w.id)));});
      set.append(ws);panel.append(set);});
    const row=rowFor(active);
    if(row) panel.append(el("p",{style:"margin:.7rem 0 0"},
      el("button",{type:"button",class:"small",onclick:()=>{e[key]=rows().filter(x=>x!==row);mark();drawAll();}},C.clear||"")));};
  const drawSummary=()=>{summary.innerHTML="";
    rows().forEach(r=>summary.append(el("div",{class:"bodyrow"},
      el("button",{type:"button",class:"x",title:C.clear||"","aria-label":(C.clear||"")+": "+labelOf(r.id),
        onclick:()=>{e[key]=rows().filter(x=>x!==r);mark();drawAll();}},"×"),
      el("button",{type:"button",class:"r rlink",onclick:()=>setActive(r.id)},labelOf(r.id)),
      el("span",{},"— "+r.s.map(senseWord).join(", ")))));};
  const drawAll=()=>{drawSides();drawFig();drawChips();drawPanel();drawSummary();};
  drawAll();
  wrap.append(el("div",{class:"bodywrap"},el("div",{},sides,fig,chips),panel),summary);
  return wrap;}

/* ======================= ENGINE: grid-select =======================
   Two axes, four cells, a vocabulary in each. The renderer knows the grid and
   the selecting; the widget knows what the cells are called and what is in
   them — which is why the words on those buttons are editable data. */
/* `opts.readonly` draws the grid without making anything selectable, and
   `opts.describe` follows it with whatever each cell says about itself. Both
   exist so that a page explaining a widget can show the real one rather than a
   picture of it — and so the cell names appear exactly once, on the widget,
   instead of being copied into whatever prose describes them. */
function gridSelect(e,W,keys,opts){opts=opts||{};const key=(keys&&keys[0])||"emotions";
  const cells=W.cells||[];const ax=W.axes||{};
  const chosen=()=>e[key]||(e[key]=[]);
  const extra=id=>id.startsWith("x|");
  const itemLabel=id=>{if(extra(id)) return id.split("|").slice(2).join("|");
    const it=(W.items||[]).find(x=>x.id===id);return it?wtx(it.label,id):id;};
  const box=el("div",{});
  const wrap=el("div",{class:"quadwrap"});
  wrap.append(el("div",{class:"ax",style:"grid-column:2;grid-row:1"},wtx(ax.top,"")),
              el("div",{class:"ax v",style:"grid-column:1;grid-row:2"},wtx(ax.left,"")));
  const grid=el("div",{class:"quad",role:"group"});
  cells.forEach((c,ci)=>{const qb=el("div",{class:"q",style:cellStyle(c,ci)},el("div",{class:"qn"},wtx(c.label,c.id)));
    const btns=el("div",{class:"qb"});
    const ids=[...(W.items||[]).filter(i=>i.cell===c.id).map(i=>i.id),
               ...((S.emo.extra[c.id]||[]).map(w=>"x|"+c.id+"|"+w))];
    ids.forEach(id=>{
      if(opts.readonly){btns.append(el("span",{class:"emw"},itemLabel(id)));return;}
      const on=chosen().includes(id);
      const bt=el("button",{type:"button",class:"emb","aria-pressed":String(on)},itemLabel(id));
      bt.addEventListener("click",()=>{const now=chosen().includes(id);
        e[key]=now?chosen().filter(x=>x!==id):[...chosen(),id];
        bt.setAttribute("aria-pressed",String(!now));mark();});
      btns.append(bt);});
    qb.append(btns);grid.append(qb);});
  wrap.append(grid,el("div",{class:"ax v r",style:"grid-column:3;grid-row:2"},wtx(ax.right,"")),
              el("div",{class:"ax",style:"grid-column:2;grid-row:3"},wtx(ax.bottom,"")));
  if(opts.readonly) wrap.classList.add("gq");
  box.append(wrap);
  if(opts.describe&&cells.some(c=>c.note))
    box.append(el("div",{class:"qdesc"},...cells.map((c,ci)=>
      el("div",{class:"qd",style:cellStyle(c,ci)},
        el("strong",{style:`color:${cellColor(c,ci).deep}`},wtx(c.label,c.id)),wtx(c.note,"")))));
  return box;}

/* ======================= ENGINE: card-board =======================
   Cards opened one at a time. Each leads with what is already mapped, then a
   quick way to add something the person already knows, then the questions that
   find a new one — folded away, because a page that opens with questions is a
   form and a page that opens with your own answers is a map.

   Its content is the board (S.goodday), keyed by field id; the widget says
   which fields each card holds and what to call them. */
let boardOpen=null;

function cardBoard(store,W,keys){
  const C=(W.copy||{})[lang]||(W.copy||{}).en||{};
  const cards=W.cards||[];
  const notes=((W.notes||{})[lang])||((W.notes||{}).en)||{};
  const P=((W.protocols||{})[lang])||((W.protocols||{}).en)||null;
  const menu=k=>((W.menus||{})[k])||menuOf(k);
  const val=f=>S.goodday[f];
  const wrap=el("div",{});
  if(boardOpen===null) boardOpen=(cards[0]||{}).id||null;

  const count=c=>((c.lists||[]).reduce((n,l)=>n+((val(l.field)||[]).length),0))
    +((c.prose||[]).filter(pr=>nonEmpty(val(pr.field))).length);

  /* one mapped list: what is there, and a box to add to it */
  const listBlock=(l,redraw)=>{const box=el("div",{class:"maplist"});
    const chosen=()=>S.goodday[l.field]||[];
    const chips=el("div",{class:"pills"});
    const draw=()=>{chips.innerHTML="";
      if(!chosen().length){chips.append(el("span",{class:"hint"},C.nothing||""));return;}
      chosen().forEach(o=>chips.append(el("span",{class:"mapchip"},o,
        el("button",{type:"button",class:"x",title:C.remove||"","aria-label":(C.remove||"")+": "+o,
          onclick:()=>{S.goodday[l.field]=chosen().filter(x=>x!==o);mark();draw();redraw();}},"×"))));};
    const inp=el("input",{type:"text",class:"field",style:"min-height:0",
      placeholder:C.quick||"","aria-label":wtx(l.label,l.field)});
    const add=()=>{const v=inp.value.trim();if(!v) return;
      if(!chosen().includes(v)) S.goodday[l.field]=[...chosen(),v];
      inp.value="";mark();draw();redraw();};
    inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();add();}});
    draw();
    box.append(el("div",{class:"mlhead"},wtx(l.label,l.field)),chips,
      el("div",{style:"display:flex;gap:.4rem;margin:.45rem 0 0"},inp,
        el("button",{type:"button",class:"small",onclick:add},C.add||"+")));
    return box;};

  /* the questions that find a new one, and the menus of the corpus's examples */
  const explore=(c)=>{const d=el("details",{class:"explore"},el("summary",{},C.explore||""));
    const inner=el("div",{class:"inner"});
    inner.append(el("p",{class:"hint"},C.exploreHint||""));
    if(!compact()&&nonEmpty(wtx(c.intro,""))) inner.append(el("p",{},wtx(c.intro,"")));
    (c.prose||[]).forEach(pr=>inner.append(labeled(S.goodday,pr.field,
      [wtx(pr.label,pr.field),wtx(pr.hint,"")],2)));
    (c.lists||[]).forEach(l=>{
      const box=el("div",{class:"qfield"});
      const wrapc=el("div",{class:"pills"});
      const chosen=()=>S.goodday[l.field]||[];
      const draw=()=>{wrapc.innerHTML="";
        [...menu(l.field),...chosen().filter(x=>!menu(l.field).includes(x))].forEach(o=>{
          const on=chosen().includes(o);
          wrapc.append(el("button",{type:"button",class:"pill-btn","aria-pressed":String(on),onclick:()=>{
            S.goodday[l.field]=on?chosen().filter(x=>x!==o):[...chosen(),o];mark();draw();}},o));});};
      draw();
      box.append(el("label",{class:"lbl"},wtx(l.label,l.field),
        nonEmpty(wtx(l.hint,""))?el("span",{class:"hint"},wtx(l.hint,"")):null),wrapc);
      inner.append(box);});
    ((notes[c.id])||[]).forEach(n=>inner.append(el("p",{class:"hint"},n)));
    if(c.protocol&&P){const pr=el("details",{class:"quiet"},
        el("summary",{},c.protocol==="switch"?P.switchH:P.treatyH));
      pr.append(el("div",{class:"inner"},c.protocol==="switch"
        ?el("ol",{class:"steps"},...P.switch.map(x=>el("li",{},el("span",{},x))))
        :el("blockquote",{},P.treaty)));
      inner.append(pr);}
    d.append(inner);return d;};

  const cardsRow=el("div",{class:"mapcards",role:"tablist"});
  const openBox=el("div",{class:"mapopen"});
  const drawCards=()=>{cardsRow.innerHTML="";
    cards.forEach(c=>{const on=boardOpen===c.id;const n=count(c);
      cardsRow.append(el("button",{type:"button",class:"mapcard "+c.id,role:"tab","aria-selected":String(on),
        onclick:()=>{boardOpen=on?null:c.id;drawCards();drawOpen();}},
        el("span",{class:"mk"},wtx(c.label,c.id)),
        el("span",{class:"md"},wtx(c.blurb,"")),
        el("span",{class:"mn"},n?String(n):"—")));});};
  const drawOpen=()=>{openBox.innerHTML="";
    const c=cards.find(x=>x.id===boardOpen);if(!c) return;
    const sec=el("section",{class:"mapsection "+c.id},el("h2",{},wtx(c.label,c.id)));
    if(!compact()&&nonEmpty(wtx(c.blurb,""))) sec.append(el("p",{class:"aside"},wtx(c.blurb,"")));
    sec.append(el("h3",{},C.mapped||""));
    (c.lists||[]).forEach(l=>sec.append(listBlock(l,drawCards)));
    if((c.prose||[]).length){const dl=el("div",{class:"mapprose"});
      const filled=(c.prose||[]).filter(pr=>nonEmpty(val(pr.field)));
      if(!filled.length) dl.append(el("p",{class:"hint"},C.nothing||""));
      filled.forEach(pr=>dl.append(el("div",{class:"mprow"},
        el("span",{class:"r"},wtx(pr.label,pr.field)),el("span",{},String(val(pr.field)).trim()))));
      sec.append(dl);}
    sec.append(explore(c));
    openBox.append(sec);};
  drawCards();drawOpen();
  wrap.append(cardsRow,openBox);
  return wrap;}

const ENGINES={"svg-regions":svgRegions,"grid-select":gridSelect,"card-board":cardBoard};

/* ======================= WHAT THE RENDERER IS =======================
   A renderer, and nothing else. It knows how to draw widget kinds, where to
   put them, how to save a file, and how to add, park or delete a module. It
   ships with no activities: there is no built-in module and no built-in
   booklet, so there is nothing here a person cannot take out.

   Everything a reader sees comes from their booklet file. A published site may
   hand the page a starter booklet and point it at a folder of modules to
   install — that is the site's wrapper, not the renderer and not the file
   format. Opened straight from disk with a booklet, this page is complete. */

/* Two views are the renderer's own, because they explain and display its own
   capabilities rather than carrying any activity: the history of whatever was
   kept, and the guide to the quadrant widget. */
const MODE_HISTORY={id:"history", kind:"log",   accent:"history", home:false};
const FIXED_MODES=[MODE_HISTORY];

/* The body figures are the bodymap widget's own configuration, so they live
   with the widget. A booklet may override them. */
const BODY_DEFAULT={
  front:["head","jaw","neck","shoulders","chest","arms","stomach","hips","legs","feet"],
  back:["head","neck","shoulders","back","lowerback","arms","hips","legs","feet"],
  chips:["allover"], sides:["front","back"]};

/* An empty booklet. This is what the page holds before a file arrives — not a
   default set of activities, because there is no such thing here. */
const EMPTY_BOOKLET={booklet:1, id:"", version:"", modules:[], widgets:[], body:BODY_DEFAULT};

/* Modules the page has been *offered* — fetched from a site's module folder,
   or pasted in. Never baked in: this starts empty and stays empty unless
   something puts a module in it. */
/* A module file is markdown with one fenced module block; the bare JSON works
   too, so a folder can hold either. */
function moduleFromText(txt){
  const fenced=String(txt||"").match(/```json\s*\n([\s\S]*?)\n```/);
  let o=null;try{o=JSON.parse(fenced?fenced[1]:txt);}catch(e){return null;}
  if(!o||typeof o!=="object") return null;
  const {block,...mod}=o;
  return moduleOk(mod)?mod:null;}

/* The wrapper — a published site — may say where its modules live and hand the
   page a starter booklet. It does that by putting a config element in the page
   around this one, or by leaving a wrapper.json beside it. Neither is part of
   the renderer or of the booklet format: with no wrapper at all, the page is a
   renderer and a Load button, which is the whole of what it needs to be. */
function wrapperConfig(){
  const tag=document.getElementById("booklet-wrapper");
  if(tag){try{return JSON.parse(tag.textContent||"{}");}catch(e){}}
  return null;}
/* Anything in the modules folder is offered; anything not there can be pasted.
   Both routes end in the same place, which is the module going into the file. */
/* ===================== REGISTRIES =====================
   A registry is a list of modules somebody offers. It is one JSON file:

     { "registry": 1,
       "name": {"en": "…"},
       "modules": [
         { "id":"who/what", "version":"0.1", "file":"what.md",
           "title":{…}, "blurb":{…}, "engines":["grid-select"] },
         { "id":"who/other", "version":"0.1", "module": { …whole module… } }
       ] }

   The entries carry enough to DRAW THE MENU, so the page fetches one small
   file instead of every module it might one day offer. Before this, listing
   four activities cost 64KB on every visit — the whole bank, downloaded in
   full, to render four button labels, and growing with every module added.

   An entry either names a `file` (fetched only when somebody adds it) or
   carries the whole `module` inline — which is what lets one file be an
   entire registry, with nothing to fetch at all.

   A bare array of filenames is the old shape and still works: there is no
   metadata in it, so the modules are fetched up front as they always were.

   Sources come from the wrapper (`registries`, or the older single
   `modules_url`) and from the booklet itself (`registries`), so a reader can
   point their own file at whatever they like without a site's permission. */
let SHELF={};
const shelfList=()=>Object.values(SHELF);
const listingOf=mod=>({id:mod.id,version:mod.version,title:mod.title,blurb:mod.blurb,
  engines:[...new Set((mod.widgets||[]).map(w=>w.engine).filter(Boolean))],
  mod,from:""});
function shelfAdd(mod){if(!moduleOk(mod)) return false;SHELF[mod.id]=listingOf(mod);return true;}
function shelfPut(entry,base,from){
  if(!entry||typeof entry.id!=="string") return false;
  if(entry.module) return shelfAdd(entry.module)&&(SHELF[entry.id].from=from,true);
  SHELF[entry.id]={id:entry.id,version:entry.version,title:entry.title,blurb:entry.blurb,

/* ======================= EDIT MODE =======================
   Display mode carries no edit chrome at all. Edit mode is a different render
   of the same page: every block keeps its normal preview, wrapped in a frame
   with its name, its type, and the controls. One block opens its editor at a
   time — which is what keeps a full editor from looking like a wall of inputs,
   and what lets an interactive widget be edited without the edit clicks
   fighting the widget's own clicks.

   A block lives in one of two places and is written back through `mutate`:
   the home page's blocks are the reader's content, an activity's are its
   module's design. Everything else about them is identical. */

    if(W){const C=(W.copy||{})[lang]||(W.copy||{}).en||{};
      return nonEmpty(C.h)?C.h:wtx(W.title,W.id);}
    return b.widget||"widget";}
  if(Array.isArray(b.q)) return Q(b.q[0],b.q[1]).label;
  if(b.copy){const c=copyAt(b.copy,null);if(Array.isArray(c)&&c[0]) return c[0];}
  /* a block's text may be a plain string or {en, fr} — name it through tx()
     rather than assuming, or a localised block crashes the editor */
  if(b.type==="prose") return tx(b.text,"").split("\n")[0].slice(0,48)||T[lang].blockEdit.kinds.prose;
  return T[lang].blockEdit.kinds[b.type]||b.type||"text";}

  head.append(el("span",{class:"blabel"},blockName(b)),
              el("span",{class:"btype"},T[lang].blockEdit.kinds[b.type]||b.type||"text"));
  const acts=el("span",{class:"bacts"});
  const list=ctx.list();
  const i=list.findIndex(x=>x.id===b.id);
  acts.append(
    el("button",{type:"button",class:"small"+(open?" primary":""),"aria-pressed":String(open),
      onclick:()=>ctx.toggle(b.id)},open?t.close:t.edit),
    el("button",{type:"button",class:"small",disabled:i<=0||null,title:t.up,
      onclick:()=>ctx.move(b.id,-1)},"↑"),
    el("button",{type:"button",class:"small",disabled:i<0||i>=list.length-1||null,title:t.down,
      onclick:()=>ctx.move(b.id,1)},"↓"),
    el("button",{type:"button",class:"small",title:t.duplicate,onclick:()=>ctx.duplicate(b.id)},"⧉"),
    el("button",{type:"button",class:"small danger",title:t.remove,onclick:()=>ctx.remove(b.id)},"×"));
  head.append(acts);
  wrap.append(head);
  wrap.append(el("div",{class:"bbody"},renderBlock(b,draft,modeId)));
  if(open) wrap.append(el("div",{class:"beditor"},blockEditorFor(b,ctx)));
  return wrap;}

/* the editor for one block, by kind. Each is small; together they are the
   whole of "edit anything on this page". */
function blockEditorFor(b,ctx){const t=T[lang].blockEdit;const box=el("div",{});
  const save=fn=>{ctx.mutate(x=>fn(x));ctx.redraw();};
  const row=(label,node)=>el("div",{class:"qrow"},el("span",{},label),node);
  const field=(value,ph,onInput,rows)=>{
    const n=rows?el("textarea",{class:"field",rows,placeholder:ph||""})
                :el("input",{type:"text",class:"field",style:"min-height:0",placeholder:ph||""});
    n.value=value||"";n.addEventListener("input",()=>onInput(n.value));return n;};
  /* a name of its own overrides whatever the block would otherwise be called */
  const nameRowFor=()=>row(t.nameIt,field(tx(b.label,""),blockName(b),
    v=>save(x=>{if(nonEmpty(v)) x.label={...(typeof x.label==="object"?x.label:{}),[lang]:v};
                else if(x.label&&typeof x.label==="object") delete x.label[lang];})));

  switch(b.type){
    case "prose":
      /* setLoc, not a bare string: a booklet may supply prose in both
         languages, and editing the English must not drop the French. */
      box.append(field(tx(b.text,""),t.prosePh,v=>save(x=>{x.text=setLoc(x.text,v);}),6));break;
    /* Localised text: written into the language being edited, never over the other. */
    case "heading":
      box.append(field(tx(b.text,""),t.headingPh,v=>save(x=>{x.text=setLoc(x.text,v);})));break;
    case "quote":
      box.append(field(tx(b.text,""),t.quotePh,v=>save(x=>{x.text=setLoc(x.text,v);}),4));break;
    case "deflist":{
      (b.items||[]).forEach((it,i)=>{
        box.append(row(t.pairLabel(i+1),field(tx(it.label,""),"",
            v=>save(x=>{x.items[i].label=setLoc(x.items[i].label,v);}))),
          row(t.pairBody,field(tx(it.body,""),"",
            v=>save(x=>{x.items[i].body=setLoc(x.items[i].body,v);}),3)),
          el("div",{class:"qrow"},el("span",{},""),
            el("button",{type:"button",class:"small",
              onclick:()=>save(x=>{x.items.splice(i,1);})},t.removePair)));});
      box.append(el("button",{type:"button",class:"small",onclick:()=>save(x=>{
        (x.items=x.items||[]).push({label:{[lang]:""},body:{[lang]:""}});})},t.addPair));
      break;}
    case "image":
      box.append(row(t.imageUrl,field(b.src,"https://…",v=>save(x=>{x.src=v.trim();}))),
                 row(t.altText,field(b.alt,t.altPh,v=>save(x=>{x.alt=v;}))),
                 el("p",{class:"hint"},T[lang].pageEdit.imageNote));break;
    case "text": case "headlines":
      box.append(qEditor(b.q[0],b.q[1],()=>ctx.redraw()));break;
    case "list":
      box.append(nameRowFor(),
        row(t.hint,field(tx(b.hint,""),"",v=>save(x=>{x.hint={...(typeof x.hint==="object"?x.hint:{}),[lang]:v};}))),
        row(t.drawsFrom,field((b.source||[]).join(", "),"weekday, weekend",
          v=>save(x=>{x.source=splitList(v);}))));
      (b.source||[]).forEach(k=>box.append(row(t.optionsFor(k),
        field(menuOf(k).join(", "),"",v=>{editTemplate(tt=>{tt.menus={...(tt.menus||{}),[k]:splitList(v)};});ctx.redraw();}))));
      break;
    case "didlog":
      box.append(nameRowFor(),
        row(t.ticks,field((b.of||[]).join(", "),"needs, enjoy",v=>save(x=>{x.of=splitList(v);}))));break;
    case "group":
      box.append(nameRowFor(),el("p",{class:"hint"},t.groupNote));break;
    case "widget":{
      const W=widgetOf(b.widget);
      box.append(nameRowFor());
      if(!W){box.append(el("p",{class:"hint"},T[lang].ui.missingWidget(b.widget||"?")));break;}
      box.append(widgetEditor(W,()=>ctx.redraw()));break;}
    default:
      box.append(el("p",{class:"hint"},t.noEditor));}

  box.append(el("p",{style:"margin:.6rem 0 0"},
    el("button",{type:"button",class:"small primary",onclick:()=>ctx.toggle(b.id)},t.done)));
  return box;}

/* a widget's own vocabulary, edited where it lives — which is the answer to
   "I want to change the text on those buttons" */
function widgetEditor(W,redraw){const t=T[lang].blockEdit;const box=el("div",{});
  const put=fn=>{editTemplate(tt=>{const w=(tt.widgets||[]).find(x=>x.id===W.id);if(w) fn(w);});redraw();};
  const line=(label,value,onInput)=>{
    const inp=el("input",{type:"text",class:"field",style:"min-height:0"});inp.value=value||"";
    inp.addEventListener("input",()=>onInput(inp.value));
    return el("div",{class:"qrow"},el("span",{},label),inp);};

  if(W.engine==="grid-select"){
    box.append(el("div",{class:"lbl2"},t.axes));
    ["top","bottom","left","right"].forEach(k=>box.append(
      line(t.axis[k],wtx((W.axes||{})[k],""),v=>put(w=>{w.axes=w.axes||{};
        w.axes[k]={...(typeof w.axes[k]==="object"?w.axes[k]:{}),[lang]:v};}))));
    box.append(el("div",{class:"lbl2",style:"margin-top:.7rem"},t.cells));
    (W.cells||[]).forEach(c=>{
      box.append(line(c.id,wtx(c.label,c.id),v=>put(w=>{
        const cc=(w.cells||[]).find(x=>x.id===c.id);if(cc) cc.label={...(typeof cc.label==="object"?cc.label:{}),[lang]:v};})));
      const words=(W.items||[]).filter(i=>i.cell===c.id);
      const wrap=el("div",{class:"wordrow"});
      words.forEach(it=>{
        const inp=el("input",{type:"text",class:"field wordin",style:"min-height:0"});
        inp.value=wtx(it.label,it.id);
        inp.addEventListener("input",()=>put(w=>{const ii=(w.items||[]).find(x=>x.id===it.id);
          if(ii) ii.label={...(typeof ii.label==="object"?ii.label:{}),[lang]:inp.value};}));
        wrap.append(el("span",{class:"wordwrap"},inp,
          el("button",{type:"button",class:"small danger",title:t.removeWord,
            onclick:()=>put(w=>{w.items=(w.items||[]).filter(x=>x.id!==it.id);})},"×")));});
      wrap.append(el("button",{type:"button",class:"small",onclick:()=>put(w=>{
        const id="w"+Math.random().toString(36).slice(2,7);
        w.items=[...(w.items||[]),{id,cell:c.id,label:{[lang]:t.newWord}}];})},"+ "+t.addWord));
      box.append(wrap);});
  }else if(W.engine==="svg-regions"){
    box.append(el("div",{class:"lbl2"},t.regions));
    (W.regions||[]).forEach(r=>box.append(line(r.id,wtx(r.label,r.id),v=>put(w=>{
      const rr=(w.regions||[]).find(x=>x.id===r.id);if(rr) rr.label={...(typeof rr.label==="object"?rr.label:{}),[lang]:v};}))));
    box.append(el("div",{class:"lbl2",style:"margin-top:.7rem"},t.senseWords));
    (W.senses||[]).forEach(g=>box.append(line(wtx(g.label,g.id),
      (g.words||[]).map(x=>wtx(x.label,x.id)).join(", "),
      v=>put(w=>{const gg=(w.senses||[]).find(x=>x.id===g.id);if(!gg) return;
        gg.words=splitList(v).map((word,i)=>{const old=(gg.words||[])[i];
          return {id:(old&&old.id)||`${g.id}:${i}`,
                  label:{...(old&&typeof old.label==="object"?old.label:{}),[lang]:word}};});}))));
  }else box.append(el("p",{class:"hint"},t.noEditor));
  box.append(el("p",{class:"hint",style:"margin-top:.6rem"},t.widgetNote));
  return box;}

/* the palette: what you can add to a page */
function addBlockRow(ctx){const t=T[lang].blockEdit;
  const box=el("div",{class:"addrow"});
  box.append(el("span",{class:"lbl2"},t.addA));
  ctx.kinds.forEach(k=>box.append(el("button",{type:"button",class:"pill-btn",
    onclick:()=>ctx.add(k)},"+ "+(t.kinds[k]||k))));
  return box;}

/* render a list of blocks: plain in display mode, framed in edit mode */
function renderBlocks(list,draft,modeId,ctx){const host=el("div",{});
  const draw=()=>{host.innerHTML="";
    const items=inOrder(list().filter(b=>editing||placeOf(b)!=="hidden"));
    items.forEach(b=>host.append(editing?blockFrame(b,draft,modeId,ctx):renderBlock(b,draft,modeId)));
    if(editing) host.append(addBlockRow(ctx));};
  ctx.redraw=draw;draw();return host;}

/* the two places blocks live, wired the same way */
function blockCtx(opts){
  const ctx={openId:null,kinds:opts.kinds||BLOCK_KINDS,list:opts.list,
    mutateAt:opts.mutate,redraw:()=>{}};
  ctx.mutate=fn=>opts.mutate(fn,ctx.openId);
  ctx.toggle=id=>{ctx.openId=ctx.openId===id?null:id;ctx.redraw();};
  ctx.move=(id,dir)=>{opts.reorder(id,dir);ctx.redraw();};
  ctx.remove=id=>{opts.remove(id);if(ctx.openId===id) ctx.openId=null;ctx.redraw();};
  ctx.duplicate=id=>{opts.duplicate(id);ctx.redraw();};
  ctx.add=kind=>{const id=opts.add(kind);ctx.openId=id;ctx.redraw();};
  return ctx;}

/* a fresh block of a given kind */
function blankBlock(kind){const id=newBlockId();
  switch(kind){
    case "prose": return {id,type:"prose",text:""};
    case "heading": return {id,type:"heading",text:{[lang]:""}};
    case "deflist": return {id,type:"deflist",items:[{label:{[lang]:""},body:{[lang]:""}}]};
    case "quote": return {id,type:"quote",text:{[lang]:""}};
    case "image": return {id,type:"image",src:"",alt:""};
    case "text": return {id,type:"text",q:["today","extra"]};
    case "headlines": return {id,type:"headlines",q:["checkin","thoughts"]};
    case "list": return {id,type:"list",source:[],label:{[lang]:T[lang].blockEdit.kinds.list}};
    case "didlog": return {id,type:"didlog",of:[]};
    case "group": return {id,type:"group",blocks:[]};
    case "widget":{const W=tplWidgets()[0];
      return {id,type:"widget",widget:W?W.id:"",keys:[W&&W.engine==="grid-select"?"emotions":"regions"]};}
    default: return {id,type:"prose",text:""};}}

/* keep an explicit order on everything once anything is moved */
function reorderIn(list,id,dir){
  const cur=inOrder(list);
  const i=cur.findIndex(x=>x.id===id),j=i+dir;
  if(i<0||j<0||j>=cur.length) return;
  [cur[i],cur[j]]=[cur[j],cur[i]];
  cur.forEach((x,k)=>{x.display={...(x.display||{}),order:(k+1)*10};});}

/* ======================= THE PAGE'S OWN WORDS =======================
   One editable section instead of two fixed ones. The page used to say much
   the same thing twice — a notice about what happens to what you write, and a
   card about what the page is and is not — so they are merged, and the result
   lives in the reader's own file where they can change it.

   Editing is off until asked for. `editing` shows or hides every inline
   control at once, which is the difference between a tool that looks like a
   page and one that looks like a form. */
let editing=false;

/* The home page's own words are the booklet's, so a booklet may ship them and
   the renderer seeds nothing of its own. A page that opens blank is the honest
   result of being handed an engine with no booklet in it; the alternative is
   an engine with an opinion about what this page is, which is exactly the
   thing being taken out of it. */
function seedPage(){
  if(!S.page) S.page=emptyPage();
  if((S.page.blocks||[]).length) return;
  const seed=pageSeed();
  if(seed&&seed.length) S.page.blocks=JSON.parse(JSON.stringify(seed));}
/* booklet first, then whichever installed module offers one — the same
   resolution order as menus and the pinned panel */
function pageSeed(){
  if(TPL.page&&Array.isArray(TPL.page.blocks)&&TPL.page.blocks.length) return TPL.page.blocks;
  for(const m of tplModules()) if(m.page&&Array.isArray(m.page.blocks)&&m.page.blocks.length) return m.page.blocks;
  return null;}

function pageText(){const wrap=el("div",{class:"col pagetext"});
  seedPage();
  const ctx=blockCtx({
    kinds:["prose","image"],
    list:()=>S.page.blocks,
    mutate:(fn,id)=>{const b=S.page.blocks.find(x=>x.id===id);if(b){fn(b);mark();}},
    reorder:(id,dir)=>{reorderIn(S.page.blocks,id,dir);mark();},
    remove:id=>{S.page.blocks=S.page.blocks.filter(x=>x.id!==id);mark();},
    duplicate:id=>{const b=S.page.blocks.find(x=>x.id===id);if(!b) return;
      S.page.blocks.push({...JSON.parse(JSON.stringify(b)),id:newBlockId()});mark();},
    add:kind=>{const b=blankBlock(kind);S.page.blocks.push(b);mark();return b.id;}});
  wrap.append(renderBlocks(()=>S.page.blocks,S,"home",ctx));
  return wrap;}

/* A name or a lead paragraph is a block like any other to read or edit — the
   same field, the same chrome as everything in blockEditorFor — but there is
   exactly one of it, it names the thing around it, and it cannot be added,
   reordered, duplicated or removed the way a block can. Reading mode shows
   it plainly in the given tag; while editing is on it opens into the field,
   pre-filled with exactly what reading mode just showed, and every keystroke
   writes straight back through onInput. Nothing to show and not editing
   means nothing is drawn at all. */
function metaField(tag,cls,label,val,onInput,rows){
  if(!editing){
    if(!nonEmpty(val)) return null;
    return el(tag,cls?{class:cls}:{},val);}
  const wrap=el("div",{class:"bframe mfield"});
  wrap.append(el("div",{class:"bhead"},el("span",{class:"blabel"},label)));
  const input=rows?el("textarea",{class:"field",rows}):el("input",{type:"text",class:"field",style:"min-height:0"});
  input.value=val||"";input.addEventListener("input",()=>onInput(input.value));
  wrap.append(el("div",{class:"beditor"},input));
  return wrap;}

/* the single control that turns every inline edit on this page on or off */
function editToggle(){const t=T[lang].pageEdit;
  const b=el("button",{type:"button",class:"toggle editbtn","aria-pressed":String(editing)},
    editing?t.editingOn:t.editThis);
  b.addEventListener("click",()=>{editing=!editing;render();});
  return b;}

/* the home page's own editing: its words, and which activities it offers */
function homeEditPanel(){const t=T[lang];const u=t.ui;const B=t.booklet;
  const wrap=el("div",{class:"col homeedit"});
  wrap.append(el("div",{class:"editrow"},editToggle()));
  if(!editing) return wrap;
  const box=el("div",{class:"editpanel"});

  const nameIn=el("input",{type:"text",class:"field",style:"min-height:0",id:"f_name"});
  nameIn.value=S.name;nameIn.addEventListener("input",()=>{S.name=nameIn.value;mark();});
  box.append(el("label",{class:"lbl",for:"f_name"},u.nameLbl[0]),nameIn,
             labeled(S,"note",u.noteLbl,3));

  box.append(el("h3",{},B.activities));
  const list=el("div",{});
  const drawList=()=>{list.innerHTML="";
    const ordered=tplModules();
    if(!ordered.length) list.append(el("p",{class:"hint"},B.noActivities));
    ordered.forEach((mod,i)=>{const m={...mod.mode};const shown=isShown(mod,m);
      const nameFallback=copyAt((m.head||{}).title,copyAt((m.head||{}).h,m.id));
      list.append(el("div",{class:"bkrow"},
        el("span",{class:"bkname"},tx(mod.title,nameFallback)),
        el("span",{class:"bkacts"},
          el("button",{type:"button",class:"small",disabled:i===0||null,
            onclick:()=>{moveModule(mod.id,-1);render();}},"↑"),
          el("button",{type:"button",class:"small",disabled:i>=ordered.length-1||null,
            onclick:()=>{moveModule(mod.id,1);render();}},"↓"),
          el("button",{type:"button",class:"small"+(shown?" primary":""),"aria-pressed":String(shown),
            onclick:()=>{editTemplate(x=>{const mm=modWithId(x,mod.id);
              if(mm) mm.display={...(mm.display||{}),show:!shown};});render();}},shown?B.shown:B.hidden),
          el("button",{type:"button",class:"small danger",title:B.remove,
            onclick:()=>{removeModule(mod.id);render();toast(B.parked);}},"×"))));});
    const parked=parkedModules();
    if(parked.length){list.append(el("p",{class:"hint",style:"margin-top:.6rem"},B.parkedH));
      parked.forEach(mod=>list.append(el("div",{class:"bkrow"},
        el("span",{class:"bkname"},tx(mod.title,mod.id)),
        el("span",{class:"bkacts"},
          el("button",{type:"button",class:"small primary",onclick:()=>{putBack(mod.id);render();}},B.putBack),
          el("button",{type:"button",class:"small danger",onclick:()=>{deleteModule(mod.id);render();toast(B.deleted);}},B.deleteIt)))));}
    const have=new Set(allModules().map(m=>m.id));
    const shelf=shelfList().filter(m=>!have.has(m.id));
    if(shelf.length){const row=el("div",{class:"pills",style:"margin-top:.6rem"});
      shelf.forEach(L=>{const b=el("button",{type:"button",class:"pill-btn",
        title:tx(L.blurb,"")||undefined},"+ "+tx(L.title,L.id));
        /* the module itself is fetched here, and only here */
        b.addEventListener("click",async()=>{
          b.disabled=true;const mod=await resolveShelf(L.id);
          if(!mod){b.disabled=false;toast(B.addFailed);return;}
          addModule(mod);render();toast(B.added(tx(L.title,L.id)));});
        row.append(b);});
      list.append(row);}};
  drawList();box.append(list);

  const paste=el("textarea",{class:"field",rows:3,placeholder:B.pastePh,"aria-label":B.paste});
  const msg=el("div",{class:"msg"});
  box.append(el("label",{class:"lbl"},B.paste),paste,msg,
    el("p",{},el("button",{type:"button",class:"small",onclick:()=>{
      const mod=moduleFromText(paste.value.trim());
      if(!mod||!addModule(mod)){msg.className="msg err";msg.textContent=B.pasteBad;return;}
      paste.value="";toast(B.added(tx(mod.title,mod.id)));render();}},B.pasteGo)));
  /* The escape hatch. Everything above edits one thing at a time; this edits
     the file. It is the honest bottom of the system — anything the editors
     cannot reach is reachable here, and a booklet somebody sent as text can be
     pasted straight in. */
  {const d=el("details",{class:"pgroup",style:"margin-top:1rem"},el("summary",{},B.fileH));
   const inner=el("div",{class:"inner"});
   inner.append(el("p",{class:"hint"},B.fileP));
   const ta=el("textarea",{class:"field",rows:12,spellcheck:"false"});
   const msg=el("div",{class:"msg"});
   const load=()=>{ta.value=toMarkdown();msg.className="msg";msg.textContent="";};
   inner.append(ta,msg,el("div",{class:"pbar"},
     el("button",{type:"button",class:"small",onclick:load},B.fileReload),
     el("button",{type:"button",class:"small primary",onclick:()=>{
       const R=parseFile(ta.value);
       if(!R.ok){msg.className="msg err";msg.textContent=T[lang].ui.loadErr;return;}
       applyParsed(R,"replace");saveLocal();render();toast(B.fileApplied);}},B.fileApply)));
   load();d.append(inner);box.append(d);}

  box.append(morePanel());
  wrap.append(box);return wrap;}

function renderHome(main){const t=T[lang];const u=t.ui;
  const hero=el("div",{class:"hero col"});
  if(nonEmpty(S.name)) hero.append(el("p",{class:"greet"},u.greeting(S.name.trim())));
  /* The headline and tagline are the booklet's own words, exactly like a
     module's name and description — they just belong to the booklet as a
     whole rather than to any one activity. A wrapper preset may ship its
     own (TPL.head); a reader who has never touched them still sees the
     built-in wording, because the fallback is the value, not a placeholder. */
  const headTitle=tx((TPL.head||{}).title,t.home.h1);
  const headSub=tx((TPL.head||{}).sub,t.home.sub);
  hero.append(metaField("h1",null,u.headline,headTitle,
    v=>editTemplate(tt=>{tt.head=tt.head||{};tt.head.title=setLoc(tt.head.title,v);}))
    ||el("h1",{},headTitle));
  hero.append(metaField("p","sub",u.tagline,headSub,
    v=>editTemplate(tt=>{tt.head=tt.head||{};tt.head.sub=setLoc(tt.head.sub,v);}),2)
    ||el("p",{class:"sub"},headSub));
  main.append(hero);


  if(nonEmpty(S.note)) main.append(el("div",{class:"notecard col"},
    ...S.note.trim().split(/\n{2,}|\n/).filter(nonEmpty).map(x=>el("p",{},x))));

  /* the activities, close to the top where they belong */
  const modes=el("div",{class:"modes"});
  const stats={today:S.today.length?[u.entriesN(S.today.length)]:[],
    checkin:S.checkins.length?[u.entriesN(S.checkins.length)]:[]};
  const shown=tplModes().filter(x=>isShown(moduleOf(x.id),x));
  for(const m of shown){const key=m.id;
    /* A card's name and description belong to the MODULE — it is the thing
       being offered. The renderer used to keep a table of them keyed by three
       particular activity ids, so an activity it had never heard of appeared
       on the home page labelled with its own id. */
    const mod=moduleOf(key)||{};const head=m.head||{};
    const k=tx(mod.title,tx(m.title,copyAt(head.title,copyAt(head.h,key))));
    const d=tx(mod.blurb,tx(m.blurb,copyAt(head.lead,copyAt(head.p,""))));
    const cline=el("span",{class:"c"});
    (stats[key]||[]).forEach(x=>cline.append(el("span",{class:"pill live"},x)));
    modes.append(el("button",{type:"button",class:"mode",onclick:()=>go(key)},
      el("span",{class:"top",html:(ICONS[m.icon||key]||"")+`<span class="k">${k}</span>`}),
      el("span",{class:"d"},d),cline));}
  /* Nothing is preloaded any more, so the empty page is a real first view and
     has to offer its own way forward. The add controls live behind the edit
     toggle, which is right once there is something to edit and useless when
     the page is blank — "add one below" pointing at nothing is a dead end. */
  /* The way to add an activity lives on the page, not only inside edit mode.

/* ======================= ENTRY MODES =======================

   what order, and whether it sits open or folded away comes from the mode's

   an activity uses belong to the activity, not to the page that draws it. A
   copy reference is looked for in the installed modules first and in the

/* A mode marked `upsert:"day"` keeps one entry per calendar day rather than
   one per Finalize — a daily log, not a running list. Finalizing again on
   the same day replaces that day's entry instead of adding a second one. */
function finalizeEntry(id){const u=T[lang].ui;const st=storeOf(id);
  const draft=draftFor(id);
  if(!st.has(draft)){toast(u.nothingYet);return;}
  const e=JSON.parse(JSON.stringify(draft));e.ts=new Date().toISOString();
  if(Array.isArray(e.thoughts)) e.thoughts=e.thoughts.filter(nonEmpty);
  const kept=keptFor(id);
  if(modeOf(id).upsert==="day"){
    const idx=kept.findIndex(x=>dayKey(x.ts)===dayKey(e.ts));
    if(idx>=0) kept[idx]=e; else kept.push(e);
  } else kept.push(e);
  const keep={};(modeOf(id).keep||[]).forEach(k=>keep[k]=draft[k]);
  const blank=Object.assign(st.blank(),keep);
  if(st.custom) D.custom[id]=blank; else D[st.draft]=blank;
  unsavedEntries++;dirty=true;openChip[id]=e.ts;render();saveLocal();toast(u.kept);maybeRemind();}
/* Reopening a daily-upsert mode later the same day must not start blank —
   the reader is continuing today's entry, not starting a second one. Seed
   the draft from today's kept entry only when the draft is itself still
   empty, so mid-edit work already in the draft is never overwritten. */
function seedUpsertDraft(id,m,draft){
  if(m.upsert!=="day"||storeOf(id).has(draft)) return;
  const today=keptFor(id).find(x=>dayKey(x.ts)===todayDate());
  if(today){const {ts,...rest}=JSON.parse(JSON.stringify(today));Object.assign(draft,rest);}}

/* ======================= EXPORT: markdown above the divider, JSONL record below ======================= */
const STARTER_RX=/^\s*\[(starter|départ|depart)\]\s*/i;
/* A long rule rather than a bare `---`, because front matter now opens the
   file with one of those and "split on the divider" must stay unambiguous for
   anything reading this file that is not this app. Old files carrying the
   short rule still load: the record is found by its heading and its fence,
   never by the divider. */
const DIVIDER="-".repeat(60);
/* any thematic break is scenery, never a parser signal */
const isRule=s=>/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(s);
function fld(lbl,val,isStarter){val=(val||"").trim();if(!val) return [];if(isStarter) val="[starter] "+val;if(val.includes("\n")) return ["- "+lbl+":",...val.split("\n").map(l=>"  "+l)];return ["- "+lbl+": "+val];}
function itemLines(items){const L=T[lang].labels;return liveItems(items).flatMap(it=>fld(L.items[it.kind]+(it.since?" ("+L.since+" "+it.since+")":""),it.text,it.starter));}
/* Reading blocks as markdown. The human half of a booklet has to be readable
   in any text editor, so anything the page shows for reading is written out
   here rather than only existing as pixels. */
function blockLines(blocks){const out=[];
  inOrder((blocks||[]).filter(b=>placeOf(b)!=="hidden")).forEach(b=>{
    switch(b.type){
      case "heading": out.push("**"+tx(b.text,"")+"**","");break;
      case "quote":   out.push("> "+tx(b.text,"").replace(/\n+/g," "),"");break;
      case "prose":   {const x=tx(b.text,"");if(nonEmpty(x)) out.push(x.trim(),"");break;}
      case "image":   if(nonEmpty(b.src))
                        out.push(`![${(b.alt||"").replace(/[\[\]]/g,"")}](${b.src})`,"");break;
      case "deflist": (b.items||[]).forEach(it=>
                        out.push("- "+tx(it.label,"")+" — "+tx(it.body,"")));out.push("");break;
      case "group":   out.push(...blockLines(b.blocks));break;
    }});
  return out;}

function safetyLines(){const G=pinnedOf();if(!G) return [];
  const head=G.head||{};
  return ["## "+tx(G.title,tx(head.h,"")),"",...blockLines(G.blocks)];}
function todayLines(e){const L=T[lang].labels;const out=[];
  out.push(...fld(L.today.area,e.area));
  if(nonEmpty(e.contact)) out.push(...fld(L.today.contact,contactText(e.contact)));
  /* lists join with " · " — the same separator the archive lines use, and the
     importer splits them back on it */
  for(const k of TODAY_LISTS) if((e[k]||[]).length) out.push(...fld(L.today[k],(e[k]||[]).join(" · ")));
  for(const k of TODAY_KEYS) out.push(...fld(L.today[k],e[k]));return out;}
function checkinLines(e){const L=T[lang].labels;const out=[];
  for(const k of BODY_KEYS) out.push(...fld(L.checkin[k],e.body[k]));

   has and gains one activity. Same id replaces in place, so adding a newer
   version of something is an update rather than a duplicate. */
const modWithId=(t,id)=>(t.modules||[]).find(m=>m.id===id);
/* Moving something writes an explicit order for everything, so the result no
   longer depends on where any of it sits in the file. */
function moveModule(id,dir){editTemplate(t=>{
  const cur=inOrder(t.modules||[]);
  const i=cur.findIndex(m=>m.id===id),j=i+dir;
  if(i<0||j<0||j>=cur.length) return;
  [cur[i],cur[j]]=[cur[j],cur[i]];
  cur.forEach((m,k)=>{m.display={...(m.display||{}),order:(k+1)*10};});});}

/* installing a module installs whatever widgets its blocks name, so an
   activity never arrives without the things it draws with */
function addWidget(w){if(!w||typeof w!=="object"||typeof w.id!=="string"||!w.engine) return false;
  editTemplate(t=>{t.widgets=t.widgets||[];
    const i=t.widgets.findIndex(x=>x.id===w.id);
    const {block,...rest}=w;
    if(i>=0) t.widgets[i]=rest; else t.widgets.push(rest);});
  return true;}
const widgetsNamedBy=mod=>[...new Set(((mod.mode||{}).blocks||[])
  .flatMap(b=>b.widget?[b.widget]:[]))];

function addModule(mod){if(!moduleOk(mod)) return false;
  (mod.widgets||[]).forEach(addWidget);
  editTemplate(t=>{t.modules=t.modules||[];
    const i=t.modules.findIndex(m=>m.id===mod.id||(m.mode&&mod.mode&&m.mode.id===mod.mode.id));
    /* putting a parked one back keeps whatever the person had done to it */
    if(i>=0){const was=t.modules[i];const parked=dispOf(was).installed===false;
      t.modules[i]=parked?{...was,display:{...(was.display||{}),installed:true}}:mod;}
    else t.modules.push(mod);});
  return true;}
const putBack=id=>{editTemplate(t=>{const m=modWithId(t,id);
  if(m) m.display={...(m.display||{}),installed:true};});};
function removeModule(id){editTemplate(t=>{const m=modWithId(t,id);
    if(m) m.display={...(m.display||{}),installed:false};});
  if(!tplModes().some(m=>m.id===view)&&!VIEWS[view]) view="home";
  boardOpen=null;}
/* the only way a module actually leaves a file */
function deleteModule(id){editTemplate(t=>{t.modules=(t.modules||[]).filter(m=>m.id!==id);});
  if(!tplModes().some(m=>m.id===view)&&!VIEWS[view]) view="home";
  boardOpen=null;}
function moduleOk(mod){return !!(mod&&typeof mod==="object"&&typeof mod.id==="string"
  &&mod.mode&&typeof mod.mode.id==="string"&&MODE_KINDS[mod.mode.kind]);}
/* every module carried by a file, whether or not its booklet is adopted */
const modulesIn=t=>((t&&t.modules)||[]).filter(moduleOk);

function applyParsed(R,mode){const st=R.S;
  /* The design travels with the file it came from, so replacing the contents
     replaces the booklet. When the file carries the booklet this page already
     ships, its design is not adopted — but any *extra* module in it still is,
     because that is what pasting a module block into a file means, and it is
     the whole reason a module is a separate thing from a booklet. */
  if(mode==="replace"){
    if(shouldAdopt(R.template)) adoptTemplate(R.template);
    else modulesIn(R.template).forEach(m=>{if(!tplModules().some(x=>x.id===m.id)) addModule(m);});}
  if(mode==="replace"){S={...st,today:R.today,checkins:R.checkins};D={today:R.drafts.today||emptyToday(),checkin:R.drafts.checkin||emptyCheckin()};}
  else{const seen=new Set(S.today.map(e=>minuteKey(e.ts)));R.today.forEach(e=>{if(!seen.has(minuteKey(e.ts))) S.today.push(e);});
    const seenC=new Set(S.checkins.map(e=>minuteKey(e.ts)));R.checkins.forEach(e=>{if(!seenC.has(minuteKey(e.ts))) S.checkins.push(e);});
    for(const s of ["s1","s2","s3","s4","s5","s6"]) for(const k of Object.keys(S.big[s])){const cur=S.big[s][k],inc=st.big[s][k];if(Array.isArray(cur)){if(!cur.length&&inc.length) S.big[s][k]=inc;}else if(!nonEmpty(cur)&&nonEmpty(inc)){S.big[s][k]=inc;if(st.big.starter[s+"."+k]) S.big.starter[s+"."+k]=true;}}
    const seenI=new Set(liveItems(S.now.items).map(i=>norm(i.text)));st.now.items.forEach(i=>{if(nonEmpty(i.text)&&!seenI.has(norm(i.text))) S.now.items.push(i);});
    const labels=new Set(S.areas.map(a=>norm(a.label)));st.areas.forEach(a=>{if(!labels.has(norm(a.label))) S.areas.push(a);});
    const seenA=new Set(S.archive.map(r=>r.date+"|"+norm(r.text)));st.archive.forEach(r=>{if(!seenA.has(r.date+"|"+norm(r.text))) S.archive.push(r);});
    for(const [id,o] of Object.entries(st.q)){if(!S.q[id]) S.q[id]=o;else S.q[id].options=[...new Set([...(S.q[id].options||[]),...(o.options||[])])];}
    Object.keys({...(S.emo.extra||{}),...((st.emo||{}).extra||{})}).forEach(q=>{
      S.emo.extra[q]=[...new Set([...(S.emo.extra[q]||[]),...((st.emo.extra||{})[q]||[])])];});
    if(!todayHas(D.today)&&R.drafts.today) D.today=R.drafts.today;if(!checkinHas(D.checkin)&&R.drafts.checkin) D.checkin=R.drafts.checkin;
    if(st.prefs&&st.prefs.noRemind) S.prefs.noRemind=true;
    if(!nonEmpty(S.name)&&nonEmpty(st.name)) S.name=st.name;if(!nonEmpty(S.note)&&nonEmpty(st.note)) S.note=st.note;if(st.mode) S.mode=st.mode;}
  S.big.starter=S.big.starter||{};S.q=S.q||{};S.archive=S.archive||[];S.prefs={noRemind:false,skipBody:false,...(S.prefs||{})};S.setup={...emptySetup(),...(S.setup||{})};S.goodday={...emptyGoodday(),...(S.goodday||{})};S.emo=S.emo||emptyEmo();S.emo.extra={...emptyEmo().extra,...(S.emo.extra||{})};
  if(!D.checkin.thoughts.length) D.checkin.thoughts=[""];
  if(R.lang&&T[R.lang]) lang=R.lang;
  dirty=false;unsavedEntries=0;openChip={today:null,checkin:null};histArea="all";
  const t=T[lang].ui;let msg=t.loadSummary(R.checkins.length,R.today.length,bigHas(st.big)||st.areas.length>0||liveItems(st.now.items).length>0);
  if(R.template&&shouldAdopt(R.template)) msg+="\n"+t.loadBooklet(R.template.title||R.template.id||"");
  if(R.unread.length) msg+="\n"+t.loadUnread(R.unread.length)+"\n"+R.unread.slice(0,6).map(x=>"• "+x).join("\n")+(R.unread.length>6?"\n…":"");
  return msg;}

let pending=null;
const veilLoad=document.getElementById("veilLoad"),veilMerge=document.getElementById("veilMerge"),veilClear=document.getElementById("veilClear"),dropVeil=document.getElementById("dropVeil");
document.getElementById("btnHome").addEventListener("click",()=>go("home"));
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>{lang=b.dataset.lang;render();}));
document.getElementById("btnExport").addEventListener("click",openExport);
document.getElementById("btnLoad").addEventListener("click",()=>{const m=document.getElementById("loadMsg");m.textContent="";m.className="msg";document.getElementById("pasteIn").value="";document.getElementById("fileIn").value="";veilLoad.setAttribute("open","");});
document.getElementById("loadCancel").addEventListener("click",()=>veilLoad.removeAttribute("open"));
function readFileInto(file,cb){if(!file) return;const r=new FileReader();r.onload=()=>cb(String(r.result||""));r.readAsText(file);}
document.getElementById("fileIn").addEventListener("change",e=>readFileInto(e.target.files[0],txt=>{document.getElementById("pasteIn").value=txt;}));
function loadText(text){const t=T[lang].ui;const msg=document.getElementById("loadMsg");
  /* a locked file asks for its passphrase and then comes back through here */
  const env=lockedEnvelope(text||"");
  if(env){if(!hasCrypto()){toast(T[lang].lock.noCrypto);return;}
    veilLoad.removeAttribute("open");openUnlock(env,txt=>loadText(txt));return;}
  const R=parseFile(text||"");
  if(!R.ok){if(veilLoad.hasAttribute("open")){msg.className="msg err";msg.textContent=t.loadErr;} else toast(t.loadErr);return;}
  veilLoad.removeAttribute("open");
  if(sessionHasContent()){pending=R;veilMerge.setAttribute("open","");return;}
  finishLoad(R,"replace");}
document.getElementById("loadGo").addEventListener("click",()=>loadText(document.getElementById("pasteIn").value));
function finishLoad(R,mode){const summary=applyParsed(R,mode);pending=null;saveLocal();veilMerge.removeAttribute("open");
  if(view==="home"||view==="history") render(); else go("home");
  const msg=el("div",{class:"msg ok",style:"white-space:pre-wrap;margin:0 0 1rem"},summary);document.getElementById("main").prepend(msg);toast(T[lang].ui.loadOk);}
document.getElementById("mergeCancel").addEventListener("click",()=>{pending=null;veilMerge.removeAttribute("open");});
document.getElementById("mergeAdd").addEventListener("click",()=>{if(pending) finishLoad(pending,"add");});
document.getElementById("mergeReplace").addEventListener("click",()=>{if(pending) finishLoad(pending,"replace");});
document.getElementById("clearCancel").addEventListener("click",()=>veilClear.removeAttribute("open"));
document.getElementById("clearGo").addEventListener("click",()=>{S=emptyS();D={today:emptyToday(),checkin:emptyCheckin()};dirty=false;unsavedEntries=0;openChip={today:null,checkin:null};clearLocal();veilClear.removeAttribute("open");go("home");});
const veilExport=document.getElementById("veilExport");
[veilLoad,veilMerge,veilClear,veilExport].forEach(v=>v.addEventListener("click",e=>{if(e.target===v) v.removeAttribute("open");}));
document.addEventListener("keydown",e=>{if(e.key==="Escape"){[veilLoad,veilMerge,veilClear,veilExport].forEach(v=>v.removeAttribute("open"));}});
let dragDepth=0;
window.addEventListener("dragenter",e=>{if([...(e.dataTransfer?.types||[])].includes("Files")){e.preventDefault();dragDepth++;dropVeil.classList.add("show");}});
window.addEventListener("dragover",e=>{if([...(e.dataTransfer?.types||[])].includes("Files")) e.preventDefault();});
window.addEventListener("dragleave",e=>{if(dragDepth>0) dragDepth--;if(dragDepth===0) dropVeil.classList.remove("show");});
window.addEventListener("drop",e=>{e.preventDefault();dragDepth=0;dropVeil.classList.remove("show");const f=e.dataTransfer?.files?.[0];if(f) readFileInto(f,loadText);});
window.addEventListener("beforeunload",e=>{if(dirty||unsavedEntries>0){e.preventDefault();e.returnValue=T[lang].ui.leaving;}});

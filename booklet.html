   point at rather than a button underneath. The back figure carries the two
   regions a front view cannot show honestly. "All over" stays a chip because it
   is not anywhere in particular. */
/* read through the booklet in force, so a booklet may change the figures */
const bodyCfg=()=>TPL.body||BODY_DEFAULT;
const BODY_SHAPES_OF=()=>[...new Set([...bodyCfg().front,...bodyCfg().back])];
const BODY_SIDES=["front","back"];
const sideRegions=s=>s==="back"?bodyCfg().back:bodyCfg().front;
const emptyS=()=>({big:emptyBig(),goodday:emptyGoodday(),now:{items:[]},areas:[],archive:[],q:{},emo:emptyEmo(),prefs:{noRemind:false,skipBody:false},setup:emptySetup(),person:emptyPerson(),page:emptyPage(),today:[],checkins:[],entries:{},mode:"full",name:"",note:""});
let S=emptyS();
let D={today:emptyToday(),checkin:emptyCheckin()};
let lang="en", view="home", dirty=false, unsavedEntries=0;
let histFilter="all", histArea="all", histPatterns=false, histRange="14";
let openChip={today:null,checkin:null};

/* ======================= HELPERS ======================= */
const el=(tag,attrs={},...kids)=>{const n=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){ if(k==="html") n.innerHTML=v; else if(k.startsWith("on")) n.addEventListener(k.slice(2),v); else if(v!==null&&v!==undefined&&v!==false) n.setAttribute(k,v===true?"":v); }
  for(const k of kids) if(k!=null) n.append(k); return n;};
const paras=arr=>arr.map(t=>el("p",{html:t}));
const LOCALES={en:"en-CA",fr:"fr-CA",es:"es-419"};
const locale=()=>lang.includes("-")?lang:(LOCALES[lang]||"en-CA");
const pad=n=>String(n).padStart(2,"0");
const localStamp=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
const todayDate=()=>localStamp(new Date()).slice(0,10);
const fmtWhen=ts=>new Date(ts).toLocaleString(locale(),{weekday:"short",day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
const fmtShort=ts=>new Date(ts).toLocaleDateString(locale(),{weekday:"short",day:"numeric",month:"short"});
const fmtDate=d=>{const m=String(d).match(/^(\d{4})-(\d{2})-(\d{2})/);if(!m) return d;return new Date(+m[1],+m[2]-1,+m[3]).toLocaleDateString(locale(),{day:"numeric",month:"short"});};
const fmtDay=ts=>new Date(ts).toLocaleDateString(locale(),{weekday:"long",day:"numeric",month:"long",year:"numeric"});
const dayKey=ts=>localStamp(new Date(ts)).slice(0,10);
const minuteKey=ts=>localStamp(new Date(ts));
const norm=s=>String(s).toLowerCase().replace(/[’‘`´]/g,"'").replace(/[—–]/g,"-").replace(/\s+/g," ").trim();
const nonEmpty=v=>(v||"").trim().length>0;
const splitList=s=>String(s||"").split(",").map(x=>x.trim()).filter(Boolean);
/* A tag field holds several comma-separated words. Everything before the
   last comma is confirmed (splitList already gives "trimmed, non-empty,
   in order" for that); the text after it is still being typed or dictated
   and stays uncommitted until a comma, Enter, or blur turns it into one
   more confirmed word. */
const parseTagValue=raw=>{const s=String(raw||"");const i=s.lastIndexOf(",");
  return i<0?{confirmed:[],inProgress:s.trim()}
            :{confirmed:splitList(s.slice(0,i)),inProgress:s.slice(i+1).trim()};};
/* Vocabulary suggestions for whatever's typed after the last comma. Exact
   normalized substring match only — norm() equality is already how this
   file decides "the same word" everywhere else (e.g. matching typed text
   to a known emotion id), and a handful of words per widget needs no fuzzy
   scoring. An empty fragment matches everything, so a bare trailing comma
   prompts the full remaining vocabulary rather than nothing. */
const matchVocab=(fragment,vocab)=>{const f=norm(fragment||"");
  return (vocab||[]).filter(v=>norm(v.label||"").includes(f));};
/* Typing the same word twice (by hand, not via a suggestion — addWord and
   the suggestion list already avoid offering a word twice) is a no-op,
   same rule cardBoard's listBlock/explore already use for their own
   freeform adds. Keeps the first occurrence's exact casing/spelling. */
const dedupeLabels=arr=>{const seen=new Set();
  return (arr||[]).filter(x=>{const k=norm(x);if(seen.has(k)) return false;seen.add(k);return true;});};

/* ======================= tagInput =======================
   A comma-separated, suggest-as-you-type field over a small vocabulary,
   shared by svg-regions and grid-select: type or dictate several words,
   see them as chips, get suggestions from the widget's own vocabulary
   while still being free to add a word that isn't in it. The whole
   selection is re-derived from the field's text on every keystroke, so
   backspacing a word out of the text removes it — no separate remove path
   to keep in sync with what's visibly there.

   opts: {values():current labels in order, vocab():[{id,label}] to
   suggest from, onChange(labels): replace the selection with exactly
   these labels, placeholder, hint}. onChange must never rebuild anything
   this field's own DOM lives inside — see Task 1's fix in blockFrame for
   why rebuilding the node being typed into is the actual bug, not a
   stylistic preference. */
let tagInputSeq=0;
function tagInput(opts){
  const dlId="taglist"+(++tagInputSeq);
  const wrap=el("div",{class:"tagfield"});
  if(opts.hint) wrap.append(el("p",{class:"hint"},opts.hint));
  const inp=el("input",{type:"text",class:"field",style:"min-height:0",
    placeholder:opts.placeholder||"",list:dlId,"aria-label":opts.placeholder||""});
  const dl=el("datalist",{id:dlId});
  const chips=el("div",{class:"tagchips"});

  const drawChips=()=>{chips.innerHTML="";
    (opts.values()||[]).forEach(label=>chips.append(el("span",{class:"tagchip"},label,
      el("button",{type:"button",class:"x",onclick:()=>{
        opts.onChange((opts.values()||[]).filter(x=>x!==label));refresh();}},"×"))));};

  /* Datalist only ever matches/replaces the WHOLE input value, which is
     wrong for a multi-value field — so every option is written out as the
     full replacement string ("everything already confirmed" + this one
     candidate), not just the candidate word on its own. */
  const drawSuggestions=inProgress=>{dl.innerHTML="";
    const confirmed=opts.values()||[];
    const prefix=confirmed.length?confirmed.join(", ")+", ":"";
    const already=new Set(confirmed.map(norm));
    matchVocab(inProgress,(opts.vocab()||[]).filter(v=>!already.has(norm(v.label))))
      .slice(0,8).forEach(v=>dl.append(el("option",{value:prefix+v.label})));};

  /* Only ever touches inp.value when the field is NOT the one the person
     is actively typing into — a button click elsewhere, for instance.
     Never resets it out from under an in-progress keystroke. */
  const refresh=()=>{if(document.activeElement!==inp) inp.value=(opts.values()||[]).join(", ");
    drawChips();drawSuggestions(parseTagValue(inp.value).inProgress);};

  inp.addEventListener("input",()=>{
    const {confirmed,inProgress}=parseTagValue(inp.value);
    const next=dedupeLabels(confirmed);
    const cur=opts.values()||[];
    if(next.join("␀")!==cur.join("␀")) opts.onChange(next);
    drawChips();drawSuggestions(inProgress);});
  /* A dangling in-progress word (typed but no trailing comma yet) commits
     on blur, so nothing typed or dictated is silently dropped. */
  inp.addEventListener("blur",()=>{
    const {confirmed,inProgress}=parseTagValue(inp.value);
    const next=dedupeLabels(inProgress?[...confirmed,inProgress]:confirmed);
    const cur=opts.values()||[];
    if(next.join("␀")!==cur.join("␀")) opts.onChange(next);
    refresh();});

  refresh();
  wrap.append(inp,dl,chips);
  return {el:wrap,refresh,
    /* A vocabulary button commits a word the same way typing does: append
       to whatever's already in the field, then run the identical
       parse-and-commit path — not a cursor-aware splice. */
    addWord:label=>{const cur=opts.values()||[];
      if(cur.some(x=>norm(x)===norm(label))) return;
      opts.onChange(dedupeLabels([...cur,label]));refresh();}};}

function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("show"),3400);}
/* ======================= WHERE BOOKLETS ARE KEPT =======================
   A booklet is modules plus what was written in them, so two booklets with the
   same modules are two booklets with two sets of answers. Each one is a library
   entry with its own id and its own saved snapshot, and they never share a key:

     booklet.library.v1   the list: one small record per booklet
     booklet.b.<id>       one booklet's snapshot — exactly the shape this page
                          has always saved, {S,D,TPL,lang,dirty,unsavedEntries}

   Plain localStorage, and only ever getItem/setItem/removeItem on known keys —
   nothing enumerates it — so a site that namespaces those three calls (one
   does, per booklet page) keeps working. The record reserves the fields a
   storage adapter will need (tags, sync), so that work adds behaviour rather
   than a second migration. */
const LIB_KEY="booklet.library.v1", bookKey=id=>"booklet.b."+id;
/* "Your booklets" is a view of its own. Views and activity ids share one
   namespace (as "home" and "history" already do), and nothing in the format
   reserves a character, so the name takes a leading @ that no activity id in
   use has, to stay clear of them in practice. */
const LIB_VIEW="@booklets";
let storageOk=true, saveTimer=null, remindShown=false;
try{localStorage.setItem(LIB_KEY+".probe","1");localStorage.removeItem(LIB_KEY+".probe");}catch(e){storageOk=false;}
/* With storage off (private mode, blocked site data, a full quota) the page
   still works for the visit: whatever it cannot write, it keeps in memory, so
   leaving a booklet and coming back within the visit loses nothing. */
const MEM={};
function lsGet(k){if(k in MEM) return MEM[k];try{return localStorage.getItem(k);}catch(e){return null;}}
function lsSet(k,v){if(storageOk){try{localStorage.setItem(k,v);delete MEM[k];return true;}
    catch(e){storageOk=false;setTimeout(()=>toast(T[lang].ui.storageOff),0);}}
  MEM[k]=v;return false;}
function lsDel(k){delete MEM[k];try{localStorage.removeItem(k);}catch(e){}}

/* ---- the list ----
   Every change re-reads the list first, so two tabs each adding a booklet do
   not drop each other's. LIB is only the copy the page draws from. */
const emptyLib=()=>({v:1,entries:[],lang:null});
function readLib(){const raw=lsGet(LIB_KEY);if(!raw) return emptyLib();
  try{const o=JSON.parse(raw);
    if(o&&Array.isArray(o.entries)) return {...emptyLib(),...o,entries:o.entries.filter(e=>e&&typeof e.id==="string")};}catch(e){}
  /* a list that will not parse is set aside rather than written over, so the
     booklets it named are still findable by hand */
  if(lsGet(LIB_KEY+".unreadable")===null) lsSet(LIB_KEY+".unreadable",raw);
  return emptyLib();}
let LIB=emptyLib();
function changeLib(fn){LIB=readLib();fn(LIB);lsSet(LIB_KEY,JSON.stringify(LIB));return LIB;}
const entryById=id=>LIB.entries.find(e=>e.id===id)||null;
const keyOfEntry=e=>(e&&e.key)||bookKey(e.id);
/* what the list calls a booklet: its own headline, else its title, else the
   names of its first modules. Only module-level fields are read (title, id),
   so this does not care how a module holds its activities. */
function describeBooklet(t,s){t=t||{};
  const mods=(Array.isArray(t.modules)?t.modules:[]).filter(m=>m&&typeof m==="object"&&dispOf(m).installed!==false);
  return {title:(t.head&&t.head.title)||t.title||null,
    parts:mods.slice(0,3).map(m=>m.title||m.id).filter(Boolean),
    name:(s&&typeof s.name==="string")?s.name.trim():""};}
function addEntry(fields){const now=new Date().toISOString();let made=null;
  changeLib(L=>{let id;
    do{id=Date.now().toString(36)+Math.random().toString(36).slice(2,8);}while(L.entries.some(e=>e.id===id));
    made={id,title:null,parts:[],name:"",tags:[],createdAt:now,updatedAt:now,openedAt:null,
      dirty:false,unsavedEntries:0,lang,wrapperKey:null,from:"new",sync:null,...(fields||{})};
    L.entries.push(made);});
  return made;}
/* Removing a booklet deletes it and everything written in it from this
   browser, including the old single save when that is where it lived: the
   person asked for it gone, and an older renderer should not bring it back. */
function removeBooklet(id){const e=(LIB=readLib(),entryById(id));if(!e) return false;
  if(id===currentId) closeBooklet();
  lsDel(keyOfEntry(e));
  changeLib(L=>{L.entries=L.entries.filter(x=>x.id!==id);});
  return true;}

/* ---- which booklet is in memory ----
   currentId is the open entry, or null on "Your booklets". bookletGen moves on
   every open and close; anything scheduled or awaited for one booklet checks
   it before touching the globals, which by then may belong to another. */
let currentId=null, currentKey=null, currentEntry=null, keyedMode=false, bookletGen=0;
/* The key the booklet in memory is saved under. With no library entry open,
   there is nothing of the reader's to save yet — saveLocal() below is a no-op
   until a booklet is actually created or opened. */
function slotKey(){return currentId?currentKey:null;}
function saveLocal(){const key=slotKey();if(!key) return;
  /* nothing open and nothing written: never leave an empty save behind */
  if(!currentId&&!sessionHasContent()&&!(TPL.modules||[]).length&&!(TPL.modes||[]).length) return;
  lsSet(key,JSON.stringify({S,D,TPL,lang,dirty,unsavedEntries}));
  if(currentId) noteSaved();}
/* keep the list's copy of the title and status current; a booklet another tab
   removed while this one had it open is put back rather than orphaned */
function noteSaved(){const id=currentId,now=new Date().toISOString();
  const fresh={...describeBooklet(TPL,S),updatedAt:now,dirty,unsavedEntries,lang};
  changeLib(L=>{let e=L.entries.find(x=>x.id===id);
    if(!e&&currentEntry){e={...currentEntry};L.entries.push(e);}
    if(e) Object.assign(e,fresh);});}
/* "Clear everything" erases what this browser kept of the open booklet. It
   stays in the list, described as what is now stored for it: nothing. */
function clearLocal(){const key=slotKey();if(key) lsDel(key);
  if(currentId) changeLib(L=>{const e=L.entries.find(x=>x.id===currentId);
    if(e) Object.assign(e,{title:null,parts:[],name:"",dirty:false,unsavedEntries:0,updatedAt:new Date().toISOString()});});}
function loadLocal(){const key=slotKey();if(!key) return false;
  try{const raw=lsGet(key);if(!raw) return false;const o=JSON.parse(raw);if(!o||!o.S) return false;
    const b=o.S;S={...emptyS(),...b};
    S.big={...emptyBig(),...(b.big||{}),starter:(b.big&&b.big.starter)||{}};
    S.now={items:((b.now||{}).items)||[]};S.areas=(b.areas||[]).map(a=>({...emptyArea(),...a,items:a.items||[],starter:a.starter||{}}));
    S.emo={...emptyEmo(),...(b.emo||{}),extra:{...emptyEmo().extra,...((b.emo||{}).extra||{})}};
    S.prefs={noRemind:false,skipBody:false,...(b.prefs||{})};S.setup={...emptySetup(),...(b.setup||{})};
    S.person={...emptyPerson(),...(b.person||{})};S.entries=b.entries||{};
    S.page={...emptyPage(),...(b.page||{}),blocks:(((b.page||{}).blocks)||[]).map(normalizePageBlock)};
    S.goodday={...emptyGoodday(),...(b.goodday||{})};S.q=b.q||{};S.archive=b.archive||[];
    S.today=(b.today||[]).filter(e=>e&&e.ts);S.checkins=(b.checkins||[]).filter(e=>e&&e.ts).map(e=>({...emptyCheckin(),...e,body:{...emptyCheckin().body,...(e.body||{})},thoughts:e.thoughts||[]}));
    D={today:{...emptyToday(),...((o.D||{}).today||{})},checkin:{...emptyCheckin(),...((o.D||{}).checkin||{})}};
    D.checkin.body={...emptyCheckin().body,...(D.checkin.body||{})};
    if(!D.checkin.thoughts||!D.checkin.thoughts.length) D.checkin.thoughts=[""];
    /* Drafts of every other activity have always been saved but were never
       read back. Leaving a booklet and returning is now an everyday thing, and
       must not throw away a half-written entry, so they come back too. */
    {const c=(o.D||{}).custom;if(c&&typeof c==="object"&&!Array.isArray(c)) D.custom=c;}
    if(o.lang&&T[o.lang]) lang=o.lang;
    dirty=!!o.dirty;unsavedEntries=Number(o.unsavedEntries)||0;
    /* The booklet's own structure — which modules are installed, their order,
       any in-place edit to a name or description — is part of what "saved in
       the browser" promises, exactly like an entry. Restore it the same way a
       loaded file adopts one, so a reload never silently reverts to whatever
       the wrapper's preset currently ships; BOOT only re-fetches the preset
       when nothing valid was saved. The "restored" toast still fires only for
       content that is actually the reader's own — entries, or a template they
       deliberately changed — not for a bare, unmodified default preset. */
    const savedTPL=templateOk(o.TPL)?o.TPL:null;
    const templateRestored=savedTPL?adoptTemplate(savedTPL):false;
    const templateIsOwn=templateRestored&&!!savedTPL.customized;
    liftBoardAnswers();
    return templateIsOwn||S.today.length>0||S.checkins.length>0||bigHas(S.big)||areasHave()||liveItems(S.now.items).length>0||nonEmpty(S.note);
  }catch(e){return false;}}
/* A save is scheduled for the booklet that asked for it. Leaving a booklet
   writes any save still pending to that booklet's own key first (flushSave),
   and a timer that somehow outlives its booklet finds bookletGen moved on and
   does nothing — it can never write one booklet's globals under another's. */
function mark(){dirty=true;clearTimeout(saveTimer);const gen=bookletGen;
  saveTimer=setTimeout(()=>{saveTimer=null;if(gen===bookletGen) saveLocal();},400);}
function flushSave(){if(!saveTimer) return;clearTimeout(saveTimer);saveTimer=null;saveLocal();}

/* ---- one booklet in memory at a time ----
   Everything that belongs to a booklet lives in module-level globals, so a
   switch clears every one of them. `lang` is the reader's, not the booklet's
   alone: it goes back to the reader's own choice when they have made one, or
   else to the site's default (uiPref), and otherwise carries over. A booklet
   that saved its own language restores it when it opens, and the reader's
   choice (or the site's) still wins wherever that booklet offers it
   (applyLangToggle). The module shelf is the site's offer,
   not a booklet's data, and is left alone. */
function resetBookletState(){
  lang=uiPref()||lang;
  S=emptyS();D={today:emptyToday(),checkin:emptyCheckin()};TPL=EMPTY_BOOKLET;
  view="home";editing=false;dirty=false;unsavedEntries=0;
  histFilter="all";histArea="all";histPatterns=false;histRange="14";
  openChip={today:null,checkin:null};boardOpen=null;exportHandle=null;pending=null;
  remindShown=false;clearTimeout(saveTimer);saveTimer=null;drawDid=()=>{};
  ["veilLoad","veilMerge","veilClear","veilSafety","veilRemind","veilLock","veilExport"]
    .forEach(id=>{const v=document.getElementById(id);if(v) v.removeAttribute("open");});}
/* Open one entry: whatever the last booklet had pending is written to it,
   the globals are cleared, and this one is read from its own key. Returns
   what loadLocal does — whether something of the reader's own came back —
   or null for an id the list does not have. */
function openBooklet(id){flushSave();LIB=readLib();const e=entryById(id);if(!e) return null;
  resetBookletState();bookletGen++;
  currentId=e.id;currentKey=keyOfEntry(e);currentEntry={...e};
  const restored=loadLocal();
  view="home";
  changeLib(L=>{const x=L.entries.find(y=>y.id===e.id);if(x) x.openedAt=new Date().toISOString();});
  return restored;}
function closeBooklet(){flushSave();resetBookletState();bookletGen++;
  currentId=currentKey=currentEntry=null;view=LIB_VIEW;}

const stFlag=(o,k)=>({has:()=>!!(o.starter&&o.starter[k]),clear:()=>{if(o.starter) delete o.starter[k];}});
const stPath=(ST,path)=>({has:()=>!!ST[path],clear:()=>{delete ST[path];}});
const stItem=it=>({has:()=>!!it.starter,clear:()=>{it.starter=false;}});
function bindTextarea(obj,key,placeholder,rows=2,st=null,onChange=null){const ta=el("textarea",{class:"field",rows,placeholder});ta.value=obj[key]||"";
  let tag=null;const wrap=el("div",{});
  if(st&&st.has()){ta.classList.add("starter");tag=el("span",{class:"startertag"},T[lang].ui.starterTag);}
  const grow=()=>{ta.style.height="auto";ta.style.height=Math.max(ta.scrollHeight+4,rows*24+18)+"px";};
  ta.addEventListener("input",()=>{obj[key]=ta.value;mark();grow();if(st&&st.has()){st.clear();ta.classList.remove("starter");tag?.remove();}if(onChange) onChange(ta.value);});

function labeled(obj,key,[lbl,hint],rows=2,st=null){const id="f_"+Math.random().toString(36).slice(2,8);const w=bindTextarea(obj,key,"",rows,st);w.ta.id=id;
  return el("div",{},el("label",{class:"lbl",for:id},lbl,hint?el("span",{class:"hint"},hint):null),w);}
function autosize(inp){const m=()=>{inp.style.width="auto";inp.style.width=Math.max(6,(inp.value||inp.placeholder).length*0.66+2)+"ch";};inp.addEventListener("input",m);m();return inp;}
const todayHas=e=>TODAY_KEYS.some(k=>nonEmpty(e[k]))||TODAY_LISTS.some(k=>(e[k]||[]).length>0)||nonEmpty(e.contact);
const checkinHas=e=>BODY_KEYS.some(k=>nonEmpty(e.body[k]))||(e.regions||[]).length>0||(e.day||[]).length>0||e.emotions.length>0||nonEmpty(e.other)||e.thoughts.some(nonEmpty);
const liveItems=arr=>(arr||[]).filter(it=>nonEmpty(it.text));
const bigHas=b=>["s1","s2","s3","s4","s5","s6"].some(s=>Object.keys(b[s]).some(k=>Array.isArray(b[s][k])?b[s][k].length>0:nonEmpty(b[s][k])));
/* whether an area says anything; one that says nothing has no place in the
   readable half of a file (the record keeps it, see toMarkdown) */
const areaSays=a=>nonEmpty(a.label)||AREA_KEYS.some(k=>nonEmpty(a[k]))||liveItems(a.items).length>0;
const areasHave=()=>S.areas.some(areaSays);
/* Whether anything was typed or picked, at any depth: a blank string, an empty
   list and nothing at all all mean no answer. It is what decides whether a
   draft is written to a file, whatever activity it belongs to. */
const holdsSomething=v=>typeof v==="string"?v.trim().length>0
  :Array.isArray(v)?v.some(holdsSomething)
  :v&&typeof v==="object"?Object.values(v).some(holdsSomething)
  :typeof v==="number"||v===true;
/* Every activity's kept entries and drafts, and whatever a board holds, are a
   person's work as much as the built-in two: loading a file over them asks
   first, and a preset never replaces them. */
const sessionHasContent=()=>S.today.length>0||S.checkins.length>0||bigHas(S.big)||areasHave()||liveItems(S.now.items).length>0||S.archive.length>0||todayHas(D.today)||checkinHas(D.checkin)||nonEmpty(S.note)||nonEmpty(S.name)||Object.keys(S.q).length>0
  ||Object.values(S.entries||{}).some(a=>Array.isArray(a)&&a.length>0)||holdsSomething(S.goodday)||holdsSomething(D.custom);
function unsavedNote(){const t=T[lang].ui;if(unsavedEntries>0) return el("span",{class:"unsaved"},t.unsavedEntries(unsavedEntries));if(dirty) return el("span",{class:"unsaved"},t.unsavedChanges);return null;}
const namedAreas=()=>S.areas.filter(a=>nonEmpty(a.label));
const compact=()=>S.mode==="compact";
/* The area a draft names. No name means no particular area — never the first
   area that has no name of its own, which is what an empty label once matched,
   so "No particular area" wrote into an unnamed area instead of the Now board. */
const findArea=label=>nonEmpty(label)?S.areas.find(a=>nonEmpty(a.label)&&a.label.trim()===label.trim()):undefined;
/* emotions: nine standard ids plus per-file extra words encoded as "x|quadrant|Word" */
/* Feelings, cells and sensations are the widget's vocabulary, so every lookup
   goes through the installed widget. A kept entry can outlive the widget that
   recorded it — an id with no widget still shows as itself rather than

/* ======================= EDIT MODE =======================
   Display mode carries no edit chrome at all. Edit mode is a different render
   of the same page: every block keeps its normal preview, wrapped in a frame
   with its name, its type, and the controls. One block opens its editor at a
   time — which is what keeps a full editor from looking like a wall of inputs,
   and what lets an interactive widget be edited without the edit clicks
   fighting the widget's own clicks.

   A block lives in one of two places and is written back through `mutate`:
   the home page's blocks are the reader's content, an activity's are its
   module's design. Everything else about them is identical. */

const BLOCK_KINDS=["heading","prose","deflist","quote","callout","sources","image","text","headlines","list","didlog","widget","group"];

function blockName(b){
  const own=tx(b.label,null);
  if(nonEmpty(own)) return own;
  if(b.type==="widget"){const W=widgetOf(b.widget);
    if(W){const C=locBag(W.copy,{});
      return nonEmpty(C.h)?C.h:wtx(W.title,W.id);}
    return b.widget||"widget";}
  if(Array.isArray(b.q)) return Q(b.q[0],b.q[1]).label;
  if(b.copy!=null){const c=copyText(b.copy,null);if(nonEmpty(c)) return c;}
  /* a block's text may be a plain string or {en, fr} — name it through tx()
     rather than assuming, or a localised block crashes the editor */
  if(b.type==="prose") return tx(b.text,"").split("\n")[0].slice(0,48)||T[lang].blockEdit.kinds.prose;
  /* a callout by its own title, else by what kind it is (see READING MATERIAL) */
  if(b.type==="callout") return tx(b.title,"").slice(0,48)||(CALLOUT_KINDS.includes(b.kind)?RT().kind[b.kind]:"")
    ||T[lang].blockEdit.kinds.callout;
  return T[lang].blockEdit.kinds[b.type]||b.type||"text";}

/* the two places blocks live, wired the same way */

/* keep an explicit order on everything once anything is moved */

  const cur=inOrder(list);

   lives in the reader's own file where they can change it.

/* A mode marked `upsert:"day"` keeps one entry per calendar day rather than
   one per Finalize — a daily log, not a running list. Finalizing again on
   the same day replaces that day's entry instead of adding a second one. */
function finalizeEntry(id){const u=T[lang].ui;const st=storeOf(id);
  const draft=draftFor(id);
  if(!st.has(draft)){toast(u.nothingYet);return;}
  const e=JSON.parse(JSON.stringify(draft));e.ts=new Date().toISOString();
  /* lines typed and left blank are not kept, whichever block owns them */
  for(const k of Object.keys(e)) if(Array.isArray(e[k])&&e[k].every(x=>typeof x==="string")) e[k]=e[k].filter(nonEmpty);
  const kept=keptFor(id);
  if(modeOf(id).upsert==="day"){
    const idx=kept.findIndex(x=>dayKey(x.ts)===dayKey(e.ts));
    if(idx>=0) kept[idx]=e; else kept.push(e);
  } else kept.push(e);
  const keep={};(modeOf(id).keep||[]).forEach(k=>keep[k]=draft[k]);
  const blank=Object.assign(st.blank(),keep);

/* Reopening a daily-upsert mode later the same day must not start blank —
   the reader is continuing today's entry, not starting a second one. Seed
   the draft from today's kept entry only when the draft is itself still
   empty, so mid-edit work already in the draft is never overwritten. */

  if(m.upsert!=="day"||storeOf(id).has(draft)) return;

/* ---- the shape ---- */
const isPaged=a=>!!a&&Array.isArray(a.pages)&&a.pages.some(p=>p&&typeof p==="object");
const blocksIn=p=>p&&Array.isArray(p.blocks)?p.blocks:[];

   block there) are kept as one more page, under an id worked out from the
   pages themselves, so that reading and editing agree on it. */
function strayPageId(a){const have=new Set(a.pages.map(p=>p&&p.id));let id="more",n=2;
  while(have.has(id)) id="more-"+(n++);return id;}
/* An activity's pages in display order, never none. A one-page activity is one
   page whose blocks are the activity's own `blocks`. */
function pagesOf(a){
  if(!isPaged(a)) return [{id:"",blocks:a&&Array.isArray(a.blocks)?a.blocks:[],only:true}];
  const ps=inOrder(a.pages.filter(p=>p&&typeof p==="object"));
  if(Array.isArray(a.blocks)&&a.blocks.length) ps.push({id:strayPageId(a),blocks:a.blocks,stray:true});
  return ps;}
/* every block an activity holds, on whichever page, as stored */
const activityBlocks=a=>pagesOf(a).flatMap(blocksIn);
/* a page's name: its own title, else its place in the menu */
const pageName=(p,i)=>tx(p&&p.title,null)||PG().nth(i+1);
/* The answer fields a block owns, the blocks nested in it included, read the
   way renderBlock reads them: an old bodymap or quadrants block owns the key of
   the widget it became. */
function ownedKeys(b){if(!b||typeof b!=="object") return [];
  if(Array.isArray(b.blocks)) return b.blocks.flatMap(ownedKeys);
  const ks=LEGACY_KEYS[b.type]&&!b.keys?[LEGACY_KEYS[b.type]]:keysOf(b);
  return (Array.isArray(ks)?ks:[]).filter(k=>typeof k==="string");}
/* Why a module's pages cannot be taken as they are, or null. Each page needs an
   id of its own, and a block id or an answer field on two pages of one
   activity is refused, as an activity id held by two modules is: two pages
   would be writing into one answer. A module is refused whole, never half. */
function pagesProblem(mod){const P=PG();
  for(const a of modesOf(mod)){const ps=pagesOf(a);if(ps.length<2) continue;
    const pids=ps.map(p=>p.id);
    if(pids.some(x=>typeof x!=="string"||!x)||new Set(pids).size!==pids.length) return P.pageIds(mod.id,a.id);
    const ids=new Map(),keys=new Map();
    for(let i=0;i<ps.length;i++) for(const b of blocksIn(ps[i])){if(!b||typeof b!=="object") continue;
      for(const [seen,own] of [[ids,typeof b.id==="string"?[b.id]:[]],[keys,ownedKeys(b)]])
        for(const k of own){const j=seen.get(k);
          if(j!==undefined&&j!==i) return P.fieldTwice(mod.id,a.id,k,pageName(ps[j],j),pageName(ps[i],i));
          seen.set(k,i);}}}
  return null;}
/* Put one key in another's place, so an activity's JSON changes only where its
   pages did: `blocks` becomes `pages` where it stood, and back. */
function swapKey(o,from,to,val){const was=Object.entries(o);for(const k of Object.keys(o)) delete o[k];
  let put=false;for(const [k,v] of was){if(k===from){o[to]=val;put=true;}else if(k!==to) o[k]=v;}
  if(!put) o[to]=val;return o;}
/* The one shape a writer writes: a single page goes back to `blocks`, blocks
   left beside `pages` become a page of their own, and an empty `pages` is no
   pages at all. A value that is not a list is not this format's and is kept. */
function settlePages(a){if(!a||typeof a!=="object"||!Array.isArray(a.pages)) return a;
  if(!isPaged(a)){delete a.pages;return a;}
  a.pages=a.pages.filter(p=>p&&typeof p==="object");
  if(Array.isArray(a.blocks)){if(a.blocks.length) a.pages.push({id:strayPageId(a),blocks:a.blocks});delete a.blocks;}
  if(a.pages.length===1) swapKey(a,"pages","blocks",blocksIn(a.pages[0]));
  return a;}
/* the loader's and addModule's normal form (see normalizeModule); a module with
   no `pages` anywhere is returned as it came, untouched */
function settleModulePages(m){if(!m||typeof m!=="object"||!modesOf(m).some(a=>a&&a.pages!==undefined)) return m;
  const c=JSON.parse(JSON.stringify(m));modesOf(c).forEach(settlePages);return c;}
/* the activity itself inside a template being edited, whichever key its module
   holds it under */

  return ((t&&t.modes)||[]).find(a=>a&&a.id===id)||null;}

/* ---- which page is showing: this visit only ---- */
const PAGE_NOW={};

  return ps.find(p=>p.id===PAGE_NOW[pageNowKey(id)])||ps[0];}
/* the page on show's own blocks, hidden ones left out: what the section rail indexes */
const pageBlocksShown=id=>inOrder(blocksIn(currentPage(id)).filter(b=>placeOf(b)!=="hidden"));

/* ---- the menu's preference: the browser's, never the booklet's ---- */
function pagesMenuPref(){try{return localStorage.getItem(PAGES_MENU_KEY);}catch(e){return null;}}

  if(!bar||typeof ResizeObserver!=="function") return;
  const set=()=>document.documentElement.style.setProperty("--ap-top",Math.ceil(bar.getBoundingClientRect().height+12)+"px");
  new ResizeObserver(set).observe(bar);set();}catch(e){}})();

/* ---- changes: through the template, like every other edit ---- */

  editTemplate(t=>{const a=actIn(t,id);if(!a) return;settlePages(a);out=fn(a);});return out;}

/* A page made without a name is called "Page 3" and the name is written down, so
   it stays put when pages are reordered. It is written in every language the
   booklet offers, so a Spanish reader is not shown the English word for it; a
   name a person types is theirs, and goes in the language they were reading. */

  for(const t of (d.length?d:["en","es","fr"])){const tt=tableTag(t);
    out[t]=((T[tt]&&T[tt].pages)||T.en.pages).nth(n);}

/* ---- drawing ---- */
/* The page on show: its name (a field of its own while editing, named and
   localised like every other title) and its blocks, edited exactly as an
   activity's blocks always were. The list is read afresh on every redraw, and
   every edit is written into that page inside the template, or into `blocks`
   when the activity has one page. */
let pageLabels={};
function pageBody(id,draft){const P=PG();const ps=pagesOf(modeOf(id));const cur=currentPage(id),pid=cur.id;
  const box=el("div",{class:"ap-body"});
  if(ps.length>1){const i=ps.indexOf(cur);
    box.append(el("div",{class:"ap-name"},metaField("h3","ap-title",P.pageName,pageName(cur,i))));}
  const listNow=()=>blocksIn(currentPage(id));
  const inPage=fn=>editPages(id,a=>{
    if(isPaged(a)){const p=a.pages.find(x=>x.id===pid);if(p) fn(p.blocks=blocksIn(p));}
    else fn(a.blocks=Array.isArray(a.blocks)?a.blocks:[]);});
  const ctx=blockCtx({
    list:listNow,
    mutate:(fn,bid)=>inPage(list=>{const b=list.find(x=>x.id===bid);if(b) fn(b);}),
    reorder:(bid,dir)=>inPage(list=>reorderIn(list,bid,dir)),
    remove:bid=>inPage(list=>{const i=list.findIndex(x=>x.id===bid);if(i>=0) list.splice(i,1);}),
    duplicate:bid=>inPage(list=>{const b=list.find(x=>x.id===bid);
      if(b) list.push({...JSON.parse(JSON.stringify(b)),id:newBlockId()});}),
    add:kind=>{const b=blankBlock(kind);const clash=fieldElsewhere(id,pid,b);
      if(clash){toast(P.keyTaken(clash.key,clash.page));return null;}
      inPage(list=>list.push(b));return b.id;}});
  ctx.modeId=id;
  /* reading material (see READING MATERIAL): the callout filter above the
     blocks, the endnotes print shows below them; neither when there is nothing
     for it, so an activity without callouts or marks is drawn as before */
  const filter=readingTop(id);if(filter) box.append(filter);
  box.append(renderBlocks(listNow,draft,id,ctx));
  const notes=endnotesFor(id);if(notes) box.append(notes);
  citeReopen(id);
  return box;}

/* Up and down (and Home, End) move between the menu's items. */
function pageMenuKeys(e){const k=e.key;if(!["ArrowDown","ArrowUp","Home","End"].includes(k)) return;
  const me=e.currentTarget,nav=me&&me.closest?me.closest(".ap-menu"):null;if(!nav) return;
  const items=[...nav.querySelectorAll(".ap-item")],i=items.indexOf(me);if(i<0) return;
  const j=k==="Home"?0:k==="End"?items.length-1:Math.min(items.length-1,Math.max(0,i+(k==="ArrowDown"?1:-1)));

/* ======================= READING MATERIAL =======================
   Reading material inside an activity: numbered citations that cost the reader
   nothing, callouts in three kinds, and a list of sources. It is not a separate
   viewer. It is two block types (`callout`, `sources`) and one mark in the
   text, drawn by the same renderBlock as everything else.

   - A module may carry two registries, because a module travels whole:
     `sources`, [{key, title, edition, kind, url?}], and `citations`,
     [{id, source, page, pagePdf?, quote, url?, verifiedOn?, verifiedBy?}].
     The renderer only DISPLAYS whether a citation was verified; it never
     checks a quote against anything.
   - `[^id]` in the text of a prose, quote, deflist or callout block marks a
     citation. It is plain text in the file, so it survives any text editor.
     Drawn, it is a small number. Numbers follow first appearance across the
     activity's pages in order, so a number does not change when the reader
     turns a page. An id the module does not carry is drawn as a broken mark.
   - Pressing a mark opens one panel, a non-modal dialog, never another page;
     Escape closes it and gives the focus back to the mark.
   - Which callout kinds are brought forward is the reader's view for the
     visit, like which page is showing, and is never written anywhere.
   - An activity with no marks, no callouts and no sources block draws exactly
     as it did before any of this existed: nothing here adds an element. */

   Off unless the person turns it on. When it is on, what leaves the page is an
   envelope: front matter saying what it is, a line saying how to open it, and
   one fenced block of ciphertext. The readable half is genuinely gone — that is
   what encryption means, and the page says so before it does it.

const mdNodes=(text,opts)=>{
  opts=opts||{};

    const ctx={opts,refs,idPrefix:opts.idPrefix||""};

function syncPinnedButton(){const b=document.getElementById("btnSafety");if(!b) return;
  const G=pinnedOf();b.hidden=!G;
  if(G) b.textContent=tx(G.btn,tx(G.title,tx((G.head||{}).h,"")));}
[veilSafety,veilRemind].forEach(v=>v.addEventListener("click",e=>{if(e.target===v) v.removeAttribute("open");}));
document.addEventListener("keydown",e=>{if(e.key==="Escape") [veilSafety,veilRemind,document.getElementById("veilLock"),document.getElementById("veilExport")].forEach(v=>v&&v.removeAttribute("open"));});

/* ======================= WELCOME, SETUP, AND THE LIBRARY SURFACES (v0.2) ======================= */



/* --- the body map ----------------------------------------------------------
   A plain outline, not an anatomical drawing: nine tappable shapes plus three
   chips for what a front view cannot honestly show (jaw, back, whole body).   */
/* The head oval is cut at y=48: above it is the head, below it the jaw. Both
   halves are clipped to the same ellipse so the outline still reads as a head
   rather than two stacked shapes. */
/* Seen from behind: no jaw, and the torso is upper back and lower back rather
   than chest and stomach. Same proportions as the front so the two read as one
   body from either side. */

/* --- the library surfaces --------------------------------------------------- */
function acqCard(a,onPick){return el("button",{type:"button",class:"acq",onclick:()=>onPick(a)},
  el("span",{class:"tag"},T[lang].ui.kinds[a.type]||a.type),el("span",{class:"k"},a.name),el("span",{class:"g"},a.gives));}

/* Universal items show by default; indicated ones are browsable but never matched
   to the reader by the page — the person picks, the tool never infers. */
function acqBlock(types,title,hint,onPick){const X=T[lang].explore;const box=el("div",{});
  const pick=w=>LIBRARY().acquisitions.filter(a=>types.includes(a.type)&&a.applies===w);
  const uni=pick("universal"),ind=pick("indicated");
  box.append(el("h3",{},title),el("p",{class:"hint",style:"margin:0"},hint));
  if(primaryOf(lang)!=="en"&&nonEmpty(X.libEn)) box.append(el("p",{class:"hint",style:"margin:.2rem 0 0"},X.libEn));
  const g=el("div",{class:"acqgrid"});uni.forEach(a=>g.append(acqCard(a,onPick)));box.append(g);
  if(ind.length){const more=el("div",{});let open=false;
    const tog=el("button",{type:"button",class:"small",style:"margin-top:.7rem"},X.showMore+" ("+ind.length+")");
    tog.addEventListener("click",()=>{open=!open;more.innerHTML="";tog.textContent=open?X.showLess:X.showMore+" ("+ind.length+")";
      if(open){more.append(el("p",{class:"hint",style:"margin:.6rem 0 .2rem"},X.indicatedNote));
        const g2=el("div",{class:"acqgrid"});ind.forEach(a=>g2.append(acqCard(a,onPick)));more.append(g2);}});
    box.append(el("div",{},tog),more);}
  return box;}

/* ======================= BOOT ======================= */
/* "Your booklets" first, unless a wrapper key or the address names a booklet;
   a save left by an earlier version joins the list on the way (bootLibrary). */
const restoredFromBrowser=bootLibrary();

render();
if(restoredFromBrowser) setTimeout(()=>toast(T[lang].ui.restored),400);
else if(!storageOk) setTimeout(()=>toast(T[lang].ui.storageOff),400);
window.addEventListener("hashchange",followRoute);
/* another tab added or removed a booklet: the list redraws */
window.addEventListener("storage",e=>{if(view===LIB_VIEW&&(!e||!e.key||String(e.key).endsWith(LIB_KEY))) render();});

/* Last, and only if a wrapper is present: pick up whatever it offers. The
   shelf always. The preset only on a page the wrapper locks to one booklet,
   and only when that booklet holds NO modules — a genuinely first visit, or
   storage that came back empty — so it can never replace anybody's work. It
   is saved at once, so a second reload before any edit does not fetch it
   again. A module taken out is still held: a booklet whose every activity was
   taken out keeps them, and is not given the preset over them. Where there is a list, the preset is what a NEW booklet starts from
   instead (createBooklet), since nothing is open to put it in. */
(async()=>{
  if(!wrapperConfig()) return;
  await loadShelf();
  if(keyedMode){if(!allModules().length&&!(TPL.modes||[]).length){if(await loadPreset()) saveLocal();}}
  render();
})();
</script>

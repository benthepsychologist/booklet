/* ======================= SAFETY / PHONE / REMINDER DIALOGS ======================= */
const veilSafety=document.getElementById("veilSafety"),veilRemind=document.getElementById("veilRemind");
/* A pinned panel is drawn from its blocks, exactly like a page — so what the
   booklet puts one tap away is written in the same vocabulary as everything
   else, and can be edited the same way. */
function openSafety(){const G=pinnedOf();if(!G) return;
  const box=document.getElementById("safetyPanel");box.innerHTML="";
  const head=G.head||{};
  box.append(el("h3",{},tx(G.title,tx(head.h,""))));
  inOrder((G.blocks||[]).filter(b=>placeOf(b)!=="hidden"))
    .forEach(b=>box.append(renderBlock(b,S,G.id)));
  box.append(el("div",{class:"actions"},el("button",{type:"button",class:"primary",
    onclick:()=>veilSafety.removeAttribute("open")},T[lang].ui.close)));
  veilSafety.setAttribute("open","");}
function maybeRemind(){if(remindShown||(S.prefs&&S.prefs.noRemind)) return;remindShown=true;
  setTimeout(()=>{const u=T[lang].ui;const box=document.getElementById("remindPanel");box.innerHTML="";
    const cb=el("input",{type:"checkbox",id:"remindNever"});
    cb.addEventListener("change",()=>{S.prefs.noRemind=cb.checked;mark();saveLocal();});
    box.append(el("h3",{},u.remindTitle),el("p",{},u.remindBody),
      el("label",{class:"checkrow",for:"remindNever"},cb,u.remindNever),
      el("div",{class:"actions"},
        el("button",{type:"button",onclick:()=>veilRemind.removeAttribute("open")},u.remindLater),
        el("button",{type:"button",class:"primary",onclick:()=>{veilRemind.removeAttribute("open");if(canShareFile()) shareCopy();else download();}},canShareFile()?u.share:u.remindGo)));
    veilRemind.setAttribute("open","");},700);}
document.getElementById("btnSafety").addEventListener("click",openSafety);
/* the button is the booklet's too: its words, and its existence */
function syncPinnedButton(){const b=document.getElementById("btnSafety");if(!b) return;
  const G=pinnedOf();b.hidden=!G;
  if(G) b.textContent=tx(G.btn,tx(G.title,tx((G.head||{}).h,"")));}
[veilSafety,veilRemind].forEach(v=>v.addEventListener("click",e=>{if(e.target===v) v.removeAttribute("open");}));
document.addEventListener("keydown",e=>{if(e.key==="Escape") [veilSafety,veilRemind,document.getElementById("veilLock"),document.getElementById("veilExport")].forEach(v=>v&&v.removeAttribute("open"));});

/* ======================= WELCOME, SETUP, AND THE LIBRARY SURFACES (v0.2) ======================= */



/* --- the body map ----------------------------------------------------------
   A plain outline, not an anatomical drawing: nine tappable shapes plus three
   chips for what a front view cannot honestly show (jaw, back, whole body).   */
/* The head oval is cut at y=48: above it is the head, below it the jaw. Both
   halves are clipped to the same ellipse so the outline still reads as a head
   rather than two stacked shapes. */
/* Seen from behind: no jaw, and the torso is upper back and lower back rather
   than chest and stomach. Same proportions as the front so the two read as one
   body from either side. */

/* --- the library surfaces --------------------------------------------------- */
function acqCard(a,onPick){return el("button",{type:"button",class:"acq",onclick:()=>onPick(a)},
  el("span",{class:"tag"},T[lang].ui.kinds[a.type]||a.type),el("span",{class:"k"},a.name),el("span",{class:"g"},a.gives));}

/* Universal items show by default; indicated ones are browsable but never matched
   to the reader by the page — the person picks, the tool never infers. */
function acqBlock(types,title,hint,onPick){const X=T[lang].explore;const box=el("div",{});
  const pick=w=>LIBRARY().acquisitions.filter(a=>types.includes(a.type)&&a.applies===w);
  const uni=pick("universal"),ind=pick("indicated");
  box.append(el("h3",{},title),el("p",{class:"hint",style:"margin:0"},hint));
  if(lang==="fr"&&nonEmpty(X.libEn)) box.append(el("p",{class:"hint",style:"margin:.2rem 0 0"},X.libEn));
  const g=el("div",{class:"acqgrid"});uni.forEach(a=>g.append(acqCard(a,onPick)));box.append(g);
  if(ind.length){const more=el("div",{});let open=false;
    const tog=el("button",{type:"button",class:"small",style:"margin-top:.7rem"},X.showMore+" ("+ind.length+")");
    tog.addEventListener("click",()=>{open=!open;more.innerHTML="";tog.textContent=open?X.showLess:X.showMore+" ("+ind.length+")";
      if(open){more.append(el("p",{class:"hint",style:"margin:.6rem 0 .2rem"},X.indicatedNote));
        const g2=el("div",{class:"acqgrid"});ind.forEach(a=>g2.append(acqCard(a,onPick)));more.append(g2);}});
    box.append(el("div",{},tog),more);}
  return box;}

function topicPicker(B){const X=T[lang].explore;const G=T[lang].setup;const box=el("div",{class:"picker"});
  let dom=S.setup.domains[0]||"", showAll=S.setup.domains.length===0, limit=10;
  const chips=el("div",{class:"pills",style:"margin:.6rem 0 0"});const body=el("div",{});
  const found=()=>LIBRARY().topics.find(x=>x.title===B.s1.topic);
  const drawChips=()=>{chips.innerHTML="";
    (showAll?LIBRARY().domains.map(d=>d.id):S.setup.domains).forEach(id=>{const d=DOMAIN(id);if(!d) return;
      chips.append(el("button",{type:"button",class:"pill-btn","aria-pressed":String(dom===id),
        onclick:()=>{dom=(dom===id?"":id);limit=10;drawChips();drawBody();}},d.title));});
    if(!showAll) chips.append(el("button",{type:"button",class:"pill-btn none",onclick:()=>{showAll=true;drawChips();}},G.q3.more));};
  const drawBody=()=>{body.innerHTML="";
    if(nonEmpty(B.s1.topic)){const tp=found();
      const pb=el("div",{class:"pickedbox"},el("p",{class:"k"},X.picked),el("h5",{},B.s1.topic));
      if(tp&&nonEmpty(tp.description)) pb.append(el("p",{style:"margin:0"},tp.description));
      if(tp&&tp.key_points&&tp.key_points.length){pb.append(el("p",{class:"k",style:"margin:.6rem 0 0"},X.steps),
        el("ol",{},...tp.key_points.map(k=>el("li",{},k))));}
      pb.append(el("p",{style:"margin:.6rem 0 0"},el("button",{type:"button",class:"small",onclick:()=>{B.s1.topic="";mark();drawBody();}},X.clearPick)));
      body.append(pb);return;}
    if(!dom) return;
    const ts=TOPICS_IN(dom);
    body.append(el("h4",{style:"margin-top:.9rem"},X.pickTopic),el("p",{class:"hint",style:"margin:0 0 .2rem"},X.topicHint));
    const listEl=el("div",{class:"topiclist"});
    ts.slice(0,limit).forEach(tp=>listEl.append(el("button",{type:"button",class:"topic",
      onclick:()=>{B.s1.topic=tp.title;if(!nonEmpty(B.s1.area)){const d=DOMAIN(dom);if(d) B.s1.area=d.title;}mark();drawBody();}},
      el("span",{class:"k"},tp.title),el("span",{class:"d"},tp.description))));
    body.append(listEl);
    if(ts.length>limit) body.append(el("p",{style:"margin:.6rem 0 0"},
      el("button",{type:"button",class:"small",onclick:()=>{limit+=15;drawBody();}},X.topicMore+" ("+(ts.length-limit)+")")));};
  box.append(el("h4",{},X.pickDomain));drawChips();drawBody();box.append(chips,body);return box;}

// first run with nothing stored: two doors, not a menu

render();
if(restoredFromBrowser) setTimeout(()=>toast(T[lang].ui.restored),400);
else if(!storageOk) setTimeout(()=>toast(T[lang].ui.storageOff),400);

/* Last, and only if a wrapper is present: pick up whatever it offers. The
   wrapper's preset supplies the design on every page load because the design
   is not browser state. loadPreset keeps already-restored entries intact. */

  if(!wrapperConfig()) return;

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Booklet</title>
<!-- Installable when this file is served over https, which is what makes the
     phone keep its data (Safari does not evict storage for a Home Screen web
     app the way it does for a tab) and what turns on the share sheet.
     Opened straight from disk the manifest simply 404s and nothing else
     changes — the page has never needed the network for anything. -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#12996E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Booklet">
<link rel="apple-touch-icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="96" fill="%23FFFCF4"/><circle cx="256" cy="256" r="150" fill="none" stroke="%2312996E" stroke-width="26"/><path d="M330 182l-47 113-113 47 47-113z" fill="%2312996E"/></svg>'>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="96" fill="%23FFFCF4"/><circle cx="256" cy="256" r="150" fill="none" stroke="%2312996E" stroke-width="26"/><path d="M330 182l-47 113-113 47 47-113z" fill="%2312996E"/></svg>'>
<style>
  /* ── Petrol and paper ─────────────────────────────────────────────────
     Paper dominates and petrol is the only action colour; every activity
     is petrol. A grid's cell colours are the widget's own data, not the
     page's chrome. */
  :root{
    --paper:#F7F2E8; --paper-deep:#EEE6DA; --ink:#292421; --muted:#59514B;
    --rule:#D8C9B5; --field:#FFFFFF; --reader:#292421; --warn:#A04E34;
    --petrol:#103E46;
    /* four palette tones, used for messages, tags and card accents */
    --tone-warm:#F0D9CF; --tone-warm-deep:#A04E34;
    --tone-green-deep:#4F6B3A;
    --tone-slate:#D9DEE2; --tone-slate-deep:#465B66;
    --tone-teal:#D5E3E1; --tone-teal-deep:#166B63;
    --accent:var(--petrol); --accent-soft:#E3EAEA;
    /* The site's faces, named but never fetched: this page makes no external
       request of any kind, and a visitor arriving from the site already has
       them. Anywhere else it falls back to Georgia and the system sans, which
       is a small cost against sending a reader's visit to a font host. */
    --serif:'Lora', Georgia, 'Times New Roman', serif;
    --sans:'Source Sans 3', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box}
  html{background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:1.0625rem;line-height:1.6;-webkit-text-size-adjust:100%}
  body{margin:0;min-height:100vh}
  a{color:var(--accent)}
  button,input,textarea,select{font:inherit;color:inherit}
  button{cursor:pointer;font-family:var(--sans)}
  :focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  p{margin:0 0 1rem}
  h2{font-family:var(--serif);font-weight:600;font-size:1.6rem;line-height:1.25;margin:0 0 .5rem;letter-spacing:0}
  h3{font-family:var(--sans);font-weight:700;font-size:.95rem;letter-spacing:.02em;margin:1.75rem 0 .5rem;color:var(--petrol)}
  .aside{color:var(--muted);font-size:.95rem}
  .hint{color:var(--muted);font-size:.88rem;font-family:var(--sans)}

  /* top bar */
  .bar{position:sticky;top:0;z-index:5;background:rgba(255,252,244,.94);backdrop-filter:blur(6px);border-bottom:3px solid var(--accent);
       display:flex;align-items:center;gap:.5rem;padding:.5rem .8rem;flex-wrap:wrap;font-family:var(--sans)}
  .bar .home{border:0;background:transparent;padding:.25rem .4rem;font-family:var(--serif);font-size:1.05rem;color:var(--ink);text-align:left;flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bar .home:hover{color:var(--accent)}
  .bar .navb{border:2px solid var(--rule);background:var(--field);border-radius:999px;padding:.3rem .8rem;font-size:.85rem;font-weight:600;white-space:nowrap;color:var(--ink)}
  .bar .navb:hover{border-color:var(--accent);color:var(--accent)}
  .bar .navb[aria-current="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
  .bar .navb.attention{border-color:var(--warn);color:var(--warn)}
  .lang{display:inline-flex;border:2px solid var(--rule);border-radius:999px;overflow:hidden}
  .lang button{border:0;background:transparent;padding:.2rem .6rem;font-size:.8rem;font-weight:700;color:var(--muted)}
  .lang button[aria-pressed="true"]{background:var(--ink);color:#fff}
  .tools{display:flex;gap:.4rem;flex-wrap:wrap}
  .bar .ver{flex:0 0 auto;font-size:.7rem;color:var(--muted);white-space:nowrap;padding:.25rem .3rem}
  @media (max-width:520px){ .bar{padding:.45rem .6rem} .bar .home{flex-basis:100%;order:-1} }

  /* page */
  .page{max-width:1080px;margin:0 auto;padding:1.5rem 1rem 6rem}
  @media (min-width:900px){.page{padding:2.5rem 2rem 6rem}}
  .col{max-width:64ch}

  /* home */
  .hero h1{font-family:var(--serif);font-weight:600;font-size:2.1rem;line-height:1.15;margin:0 0 .4rem;letter-spacing:0}
  .hero .sub{font-size:1.12rem;color:var(--muted);margin:0 0 1.25rem;line-height:1.45}

  .modes{display:grid;grid-template-columns:1fr;gap:.8rem;margin:1.5rem 0 0;max-width:64ch}
  @media (min-width:700px){.modes{grid-template-columns:repeat(2,1fr);max-width:none}}
  .mode{font-family:var(--sans);text-align:left;border:0;border-top:4px solid var(--mc);background:#fff;border-radius:16px;padding:1.1rem 1.15rem 1rem;line-height:1.4;min-height:9rem;display:flex;flex-direction:column;gap:.4rem;
        box-shadow:0 1px 2px rgba(31,36,48,.06),0 10px 24px -18px rgba(31,36,48,.4);transition:transform .12s,box-shadow .12s;font-family:var(--serif)}
  .mode:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(31,36,48,.08),0 16px 30px -18px rgba(31,36,48,.5)}
  .mode .top{display:flex;align-items:center;gap:.6rem}
  .mode .k{font-family:var(--serif);font-size:1.2rem;font-weight:600;color:var(--petrol)}
  .mode .d{color:var(--muted);font-size:.93rem}
  .mode .c{margin-top:auto;font-family:var(--sans);font-size:.8rem;font-weight:600;color:var(--muted);display:flex;gap:.5rem;flex-wrap:wrap}
  .mode .c .pill{background:var(--paper-deep);border-radius:999px;padding:.05rem .55rem}
  .mode .c .pill.live{background:var(--mcs);color:var(--ink)}
  .notice{border:2px dashed var(--rule);border-radius:12px;padding:.8rem 1rem;font-size:.9rem;color:var(--muted);margin:0 0 1.5rem;font-family:var(--sans)}
  .notice strong{color:var(--ink);font-weight:700}
  .unsaved{font-family:var(--sans);font-size:.85rem;font-weight:700;color:var(--warn);background:#FFE4DE;border-radius:999px;padding:.15rem .7rem}
  .quietlink{border:0;background:transparent;color:var(--accent);text-decoration:underline;padding:0;font-size:.92rem;text-align:left;font-family:var(--sans);font-weight:600}
  .quietlink{color:var(--muted);font-weight:500}

  /* fields */
  .field{width:100%;background:var(--field);color:var(--reader);border:2px solid var(--rule);
         padding:.5rem .65rem;border-radius:10px;resize:vertical;min-height:2.8rem;line-height:1.5}
  .field::placeholder{color:#9AA0B4;font-style:italic}
  .field:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}

  label.lbl{display:block;font-size:.95rem;margin:1rem 0 .3rem;font-family:var(--sans);font-weight:700}
  label.lbl span.hint{display:block;font-weight:400}

  details{border:2px solid var(--rule);border-radius:12px;margin:1rem 0;background:#fff}
  details summary{cursor:pointer;padding:.7rem 1rem;list-style:none;display:flex;align-items:center;gap:.6rem;font-family:var(--sans);font-weight:600}
  details summary::-webkit-details-marker{display:none}
  details summary::before{content:"";width:.5rem;height:.5rem;border-right:2px solid var(--accent);border-bottom:2px solid var(--accent);transform:rotate(-45deg);transition:transform .15s;flex:none}
  details[open] summary::before{transform:rotate(45deg)}
  details .inner{padding:0 1rem 1rem}
  details.quiet{border-style:dashed;background:transparent}

  blockquote{margin:1.25rem 0;padding:0 0 0 1rem;border-left:3px solid var(--accent);color:var(--muted);font-style:italic}
  ul.plain{padding-left:1.2rem;margin:0 0 1rem} ul.plain li{margin:.3rem 0}

  /* chips (previous entries) + pills */
  .chips{display:flex;gap:.4rem;overflow-x:auto;padding:.25rem 0 .5rem;scrollbar-width:thin;margin:0 0 .75rem}
  .chip{flex:none;border:2px solid var(--rule);background:#fff;border-radius:999px;padding:.3rem .8rem;font-size:.85rem;font-weight:600;white-space:nowrap}
  .chip:hover{border-color:var(--accent)}
  .chip[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
  .chips-empty{font-size:.9rem;color:var(--muted);margin:0 0 .75rem;font-family:var(--sans)}
  .pills{display:flex;gap:.45rem;flex-wrap:wrap;margin:.25rem 0 1rem}
  .pill-btn{border:2px solid var(--accent);background:#fff;color:var(--accent);border-radius:999px;padding:.4rem .95rem;font-size:.95rem;font-weight:700;line-height:1.2}
  .pill-btn:hover{background:var(--accent-soft)}
  .pill-btn[aria-pressed="true"]{background:var(--accent);color:#fff}

  /* entry read view */
  .entry{background:#fff;border:2px solid var(--rule);border-radius:14px;padding:.9rem 1.1rem;margin:0 0 1rem}
  .entry .when{color:var(--muted);font-size:.9rem;margin:0 0 .5rem;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;font-family:var(--sans)}
  .entry .when .tag{border-radius:999px;padding:.05rem .6rem;font-size:.76rem;font-weight:700;color:#fff;background:var(--muted)}

  .entry dl{margin:0;display:grid;grid-template-columns:1fr;gap:.2rem .75rem}
  @media (min-width:560px){.entry dl{grid-template-columns:12rem 1fr}}
  .entry dt{color:var(--muted);font-size:.88rem;padding-top:.15rem;font-family:var(--sans);font-weight:600}
  .entry dd{margin:0 0 .35rem;color:var(--reader);white-space:pre-wrap}
  .entry ul{margin:0;padding-left:1.1rem;color:var(--reader)}

  .entry .foot{display:flex;gap:.5rem;justify-content:flex-end;margin-top:.5rem;align-items:center;flex-wrap:wrap}
  .small{border:2px solid var(--rule);background:#fff;border-radius:999px;padding:.3rem .8rem;font-size:.85rem;font-weight:600}
  .small:hover{border-color:var(--accent);color:var(--accent)} .small.danger{color:var(--warn)}
  .small.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .inlineconfirm{display:inline-flex;gap:.4rem;align-items:center;font-size:.9rem;color:var(--warn);font-family:var(--sans)}

  /* finalize row */
  .finrow{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;margin:1.75rem 0 0;padding-top:1.25rem;border-top:2px solid var(--rule)}
  .finalize{background:var(--accent);color:#fff;border:0;border-radius:999px;padding:.75rem 1.6rem;font-size:1.05rem;font-weight:700;box-shadow:0 8px 18px -10px var(--accent)}
  .finalize:hover{filter:brightness(1.08);transform:translateY(-1px)}

  /* quadrant */
  .quadwrap{display:grid;grid-template-columns:1.5rem 1fr 1.5rem;grid-template-rows:auto 1fr auto;gap:.3rem;margin:1rem 0}
  .ax{color:var(--muted);font-size:.8rem;text-align:center;align-self:center;justify-self:center;font-family:var(--sans);font-weight:700}
  .ax.v{writing-mode:vertical-rl;transform:rotate(180deg)} .ax.v.r{transform:none}
  .quad{grid-column:2;grid-row:2;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:.45rem}
  .q{border-radius:14px;padding:.75rem .8rem .8rem;min-height:9rem;display:flex;flex-direction:column;gap:.5rem}
  .q .qn{font-family:var(--sans);font-size:.95rem;font-weight:800;color:var(--qd)}
  .q .qb{display:flex;flex-wrap:wrap;gap:.4rem}
  .emb{border:2px solid rgba(255,255,255,.9);background:rgba(255,255,255,.75);color:var(--ink);border-radius:999px;padding:.45rem .85rem;font-size:.92rem;font-weight:600;line-height:1.2;min-height:2.4rem}
  .emb:hover{border-color:var(--qd)}
  .emb[aria-pressed="true"]{background:var(--qd);color:#fff;border-color:var(--qd)}
  @media (max-width:480px){.q{min-height:8rem;padding:.55rem .55rem .6rem} .emb{padding:.4rem .7rem;font-size:.88rem}}

  /* a grid shown without being operated */
  .gq .q{min-height:7rem}
  .emw{display:inline-block;border:2px solid rgba(255,255,255,.9);background:rgba(255,255,255,.7);border-radius:999px;padding:.25rem .7rem;font-size:.9rem;font-family:var(--sans);font-weight:600}

  .qdesc{display:grid;grid-template-columns:1fr;gap:.6rem;margin:1rem 0 1.25rem}
  @media (min-width:600px){.qdesc{grid-template-columns:1fr 1fr}}
  .qd{border-radius:12px;padding:.8rem .95rem;font-size:.95rem;line-height:1.45}
  .qd strong{display:block;font-weight:800;margin-bottom:.2rem;font-family:var(--sans)}

  /* dialogs, drop overlay, toast */
  .veil{position:fixed;inset:0;background:rgba(31,36,48,.4);display:none;align-items:center;justify-content:center;z-index:20;padding:1rem}
  .veil[open]{display:flex}
  .panel{background:var(--paper);border-radius:16px;max-width:540px;width:100%;padding:1.4rem 1.5rem;border:2px solid var(--rule);box-shadow:0 20px 50px -20px rgba(0,0,0,.4);max-height:92vh;overflow:auto;font-family:var(--sans)}
  .panel h3{margin:0 0 .5rem;font-weight:700;font-size:1.15rem;color:var(--ink)}
  .panel p{font-size:.95rem;color:var(--muted)}
  .panel .actions{display:flex;gap:.5rem;justify-content:flex-end;flex-wrap:wrap;margin-top:1rem}
  .panel button{border:2px solid var(--rule);background:#fff;border-radius:999px;padding:.45rem 1rem;font-weight:600}
  .panel button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .panel button.danger{color:var(--warn)}
  .exportchoices{display:grid;grid-template-columns:1fr;gap:.55rem;margin:1.1rem 0 .25rem}
  @media (min-width:520px){.exportchoices{grid-template-columns:1fr 1fr}}
  .panel button.exportchoice{display:block;text-align:left;border-radius:12px;padding:.75rem .9rem;min-height:4.4rem}
  .panel button.exportchoice strong{display:block;color:var(--ink);font-size:.98rem;margin-bottom:.15rem}
  .panel button.exportchoice span{display:block;color:var(--muted);font-size:.82rem;font-weight:400;line-height:1.35}
  .panel button.exportchoice.primary strong,.panel button.exportchoice.primary span{color:#fff}
  .panel textarea{width:100%;min-height:7rem;font-size:.85rem;background:#fff;border:2px solid var(--rule);border-radius:10px;padding:.5rem;font-family:var(--serif)}
  .panel input[type=file]{font-size:.9rem;max-width:100%}
  .dropzone{border:2px dashed var(--accent);border-radius:12px;padding:.9rem;text-align:center;color:var(--accent);font-weight:600;margin:.5rem 0;background:var(--accent-soft)}
  .msg{font-size:.9rem;margin-top:.5rem;white-space:pre-wrap;font-family:var(--sans)} .msg.err{color:var(--warn)} .msg.ok{color:var(--tone-teal-deep)}
  .dropveil{position:fixed;inset:0;background:rgba(16,62,70,.14);border:6px dashed var(--petrol);display:none;align-items:center;justify-content:center;z-index:40;pointer-events:none;font-family:var(--sans);font-size:1.4rem;font-weight:700;color:var(--petrol)}
  .dropveil.show{display:flex}
  .toast{position:fixed;left:50%;bottom:1.25rem;transform:translateX(-50%);background:var(--ink);color:#fff;padding:.55rem 1rem;border-radius:999px;font-size:.9rem;font-family:var(--sans);font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90vw;text-align:center}
  .toast.show{opacity:1}

  .qfield{margin:0 0 .5rem}

  /* the body map */
  .bodywrap{display:grid;grid-template-columns:1fr;gap:1rem;margin:.8rem 0 0;align-items:start}
  @media (min-width:680px){.bodywrap{grid-template-columns:minmax(0,15rem) minmax(0,1fr)}}

  .sideswitch{display:flex;gap:.35rem;justify-content:center;margin:0 0 .5rem}
  .sidebtn{border:2px solid var(--rule);background:#fff;border-radius:999px;padding:.28rem .95rem;font-size:.88rem;font-weight:700;color:var(--muted);display:inline-flex;align-items:center;gap:.4rem}
  .sidebtn:hover{border-color:var(--accent);color:var(--accent)}
  .sidebtn[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
  .sidebtn .sn{background:rgba(255,255,255,.35);border-radius:999px;padding:0 .4rem;font-size:.75rem}
  .sidebtn[aria-pressed="false"] .sn{background:var(--paper-deep);color:var(--ink)}
  .bodyrow .rlink{border:0;background:transparent;padding:0;font-family:var(--sans);font-weight:800;font-size:.78rem;text-transform:uppercase;letter-spacing:.03em;color:var(--accent);text-decoration:underline;margin-right:.3rem}
  .bodychips{display:flex;gap:.4rem;flex-wrap:wrap;margin:.6rem 0 0;justify-content:center}
  .sensepanel{border:2px solid var(--rule);border-radius:14px;padding:.85rem 1rem;background:#fff;min-height:6rem}
  .sensepanel h4{margin:0 0 .1rem;font-family:var(--sans);font-size:.95rem;font-weight:800;color:var(--accent)}
  .senseset{margin:.7rem 0 0}
  .senseset .lbl2{font-family:var(--sans);font-size:.72rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:0 0 .3rem}
  .sensewrap{display:flex;gap:.35rem;flex-wrap:wrap}
  .sense{border:2px solid var(--rule);background:var(--paper);border-radius:999px;padding:.3rem .75rem;font-size:.9rem;font-weight:600;line-height:1.2}
  .sense:hover{border-color:var(--accent)}
  .sense[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}

  .bodysummary{display:flex;flex-direction:column;gap:.4rem;margin:.8rem 0 0}
  .bodyrow{border-left:5px solid var(--accent);background:var(--paper);border-radius:0 10px 10px 0;padding:.4rem .7rem;font-size:.92rem}
  .bodyrow .r{font-family:var(--sans);font-weight:800;font-size:.78rem;text-transform:uppercase;letter-spacing:.03em;color:var(--accent)}
  .bodyrow .x{float:right;border:0;background:transparent;color:var(--muted);font-size:1.1rem;line-height:1;padding:0 .2rem}
  .bodyrow .x:hover{color:var(--warn)}
  .bkrow{display:flex;align-items:center;gap:.6rem;justify-content:space-between;padding:.4rem 0;border-bottom:1px dotted var(--rule);flex-wrap:wrap}
  .bkrow.sub{padding-left:1rem;border-bottom:0}
  .bkname{font-family:var(--sans);font-size:.92rem;font-weight:600;flex:1 1 8rem;min-width:0}
  .bkrow.sub .bkname{font-weight:400;color:var(--muted)}
  .bkacts{display:flex;gap:.3rem;flex-wrap:wrap}
  .bkacts .small{padding:.2rem .6rem;font-size:.8rem}
  .bkacts .small[disabled]{opacity:.35}

  .addrow{display:flex;gap:.35rem;flex-wrap:wrap;align-items:center;margin:.2rem 0 1rem}
  .addrow .pill-btn{padding:.25rem .7rem;font-size:.85rem}

  .lbl2{font-family:var(--sans);font-size:.72rem;font-weight:800;letter-spacing:.04em;
        text-transform:uppercase;color:var(--muted);margin:0 0 .3rem}

  /* the card board: cards, one open at a time */
  .mapcards{display:grid;grid-template-columns:1fr;gap:.7rem;margin:1.25rem 0 1.5rem}
  @media (min-width:620px){.mapcards{grid-template-columns:1fr 1fr}}
  @media (min-width:980px){.mapcards{grid-template-columns:repeat(4,1fr)}}
  .mapcard{text-align:left;border:2px solid var(--rule);background:#fff;border-radius:16px;padding:.9rem 1rem .8rem;
           font-family:var(--serif);display:flex;flex-direction:column;gap:.25rem;min-height:7rem;
           border-top:8px solid var(--mc,var(--rule));transition:transform .12s,border-color .12s,box-shadow .12s}

  .mapcard:hover{transform:translateY(-2px);border-color:var(--mc);box-shadow:0 12px 26px -20px rgba(31,36,48,.6)}
  .mapcard[aria-selected="true"]{border-color:var(--mc);background:var(--accent-soft);box-shadow:0 10px 22px -18px var(--mc)}
  .mapcard .mk{font-size:1.14rem;font-weight:600;color:var(--mc);line-height:1.25}
  .mapcard .md{font-size:.88rem;color:var(--muted);line-height:1.35}
  .mapcard .mn{margin-top:auto;font-family:var(--sans);font-size:.78rem;font-weight:700;color:var(--muted);
               background:var(--paper-deep);border-radius:999px;padding:.05rem .6rem;align-self:flex-start}
  .mapcard[aria-selected="true"] .mn{background:#fff;color:var(--mc)}
  .mapsection{border-top:2px solid var(--rule);padding:1.5rem 0 0}
  .mapsection>h2{font-size:1.45rem}
  .maplist{margin:0 0 1.4rem}
  .mlhead{font-family:var(--sans);font-weight:700;font-size:.95rem;margin:0 0 .35rem}
  .mapchip{display:inline-flex;align-items:center;gap:.3rem;border:2px solid var(--accent);background:var(--accent-soft);
           color:var(--ink);border-radius:999px;padding:.32rem .5rem .32rem .85rem;font-size:.93rem;font-weight:600;line-height:1.2}
  .mapchip .x{border:0;background:transparent;color:var(--muted);font-size:1.05rem;line-height:1;padding:0 .25rem;border-radius:50%}
  .mapchip .x:hover{color:var(--warn);background:#fff}
  /* tagInput: a comma-separated, suggest-as-you-type word field (body map,
     emotions grid) */
  .tagfield{margin:0 0 .7rem}
  .tagfield .hint{margin:0 0 .3rem}
  .tagchips{display:flex;gap:.35rem;flex-wrap:wrap;margin:.4rem 0 0}
  .tagchip{display:inline-flex;align-items:center;gap:.3rem;border:2px solid var(--accent);background:var(--accent-soft);
           color:var(--ink);border-radius:999px;padding:.28rem .45rem .28rem .75rem;font-size:.88rem;font-weight:600;line-height:1.2}
  .tagchip .x{border:0;background:transparent;color:var(--muted);font-size:1rem;line-height:1;padding:0 .2rem;border-radius:50%}
  .tagchip .x:hover{color:var(--warn);background:#fff}
  .mapprose{display:flex;flex-direction:column;gap:.5rem;margin:0 0 1.4rem}
  .mprow{border-left:5px solid var(--accent);background:#fff;border-radius:0 10px 10px 0;padding:.5rem .8rem;font-size:.97rem}
  .mprow .r{display:block;font-family:var(--sans);font-weight:800;font-size:.76rem;text-transform:uppercase;letter-spacing:.03em;color:var(--accent);margin-bottom:.15rem}
  details.explore{border:2px dashed var(--accent);background:var(--paper)}
  details.explore>summary{color:var(--accent);font-weight:700}

  /* ── an activity's pages ──────────────────────────────────────────────
     A menu on the left lists the pages; minimized, it is a thin rail of page
     numbers. Below 700px the menu starts as the rail and opens
     OVER the page rather than beside it, so the page never scrolls sideways.
     The page on show is marked by a bar, weight and tint, never by colour alone. */
  .ap-frame{display:grid;grid-template-columns:13rem minmax(0,1fr);gap:0 2rem;align-items:start;position:relative}
  .ap-frame>*{min-width:0}
  .ap-frame.ap-min{grid-template-columns:2.75rem minmax(0,1fr);gap:0 1.25rem}

  /* --ap-top is the page's own sticky bar's height, kept current by the script
     (the bar wraps onto three rows on a phone), so the menu stops just below it */
  .ap-menu{grid-column:1;grid-row:1;position:sticky;top:var(--ap-top,4.4rem);font-family:var(--sans);max-height:calc(100vh - var(--ap-top,4.4rem) - .75rem);overflow-y:auto;padding:.1rem .1rem .5rem}
  .ap-content{grid-column:2;grid-row:1}
  .ap-top{display:flex;align-items:center;justify-content:space-between;gap:.4rem;margin:0 0 .4rem}
  .ap-head{margin:0}
  .ap-toggle{flex:none;width:2.25rem;height:2.25rem;padding:0;border:2px solid var(--rule);border-radius:999px;background:#fff;color:var(--muted);font-weight:700;line-height:1}
  .ap-toggle:hover{border-color:var(--accent);color:var(--accent)}
  .ap-menu ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:.15rem}
  .ap-item{display:flex;align-items:baseline;gap:.5rem;width:100%;border:0;border-left:3px solid transparent;border-radius:0 8px 8px 0;background:transparent;color:var(--muted);text-align:left;padding:.4rem .55rem;font-size:.92rem;line-height:1.3}
  .ap-item:hover{color:var(--ink);background:var(--accent-soft)}
  .ap-item[aria-current="page"]{border-left-color:var(--accent);background:var(--accent-soft);color:var(--ink);font-weight:700}
  .ap-n{flex:none;min-width:1.1rem;font-weight:700;color:var(--muted)}
  .ap-item[aria-current="page"] .ap-n{color:var(--accent)}
  .ap-t{min-width:0;overflow-wrap:anywhere}

  .ap-title{font-family:var(--serif);font-weight:600;font-size:1.25rem;line-height:1.3;color:var(--ink);margin:.25rem 0 .9rem}
  /* minimized: the numbers only */
  .ap-min .ap-top{justify-content:center}
  .ap-min .ap-head,.ap-min .ap-t{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
  .ap-min .ap-item{justify-content:center;padding:.4rem 0}
  .ap-min .ap-n{min-width:0}

  @media (max-width:699px){
    .ap-frame,.ap-frame.ap-min{grid-template-columns:2.5rem minmax(0,1fr);gap:0 .7rem}

    /* open, it lies over the page just below the bar, wherever the page is scrolled to */
    .ap-frame:not(.ap-min) .ap-menu{position:fixed;top:var(--ap-top,9rem);left:1rem;z-index:4;width:min(16rem,calc(100vw - 2rem));
      max-height:calc(100vh - var(--ap-top,9rem) - 1rem);overflow-y:auto;
      background:var(--paper);border:2px solid var(--rule);border-radius:0 14px 14px 0;padding:.5rem .5rem .6rem;box-shadow:0 12px 30px -14px rgba(31,36,48,.5)}
  }
  /* ── reading material: citation marks, the source panel, callouts, sources ──
     Quiet by default: a mark is a small petrol number that keeps the line's
     rhythm (line-height 0 on the superscript). A callout's kind is told by its
     label, its icon and its border pattern as well as its colour, never by
     colour alone: dashed for a difference, double for the law now, dotted for
     an author's view. Label text sits on white, where each deep tone passes
     4.5:1. The panel is a column on the right, and a bottom sheet on a phone. */
  .rd-glue{white-space:nowrap}
  .rd-sup{font-size:.72em;line-height:0;vertical-align:baseline;position:relative;top:-.5em}
  .rd-mark{border:0;background:transparent;margin:0 .05em;padding:.05em .18em;border-radius:4px;font:inherit;font-family:var(--sans);font-weight:700;color:var(--accent);line-height:1;cursor:pointer}
  .rd-mark:hover{text-decoration:underline;background:var(--accent-soft)}
  .rd-mark[aria-expanded="true"]{background:var(--accent);color:#fff;text-decoration:none}
  .rd-broken{font-family:var(--sans);font-size:.72em;font-weight:700;color:var(--warn);border:1px dashed var(--warn);border-radius:4px;padding:0 .2em;margin:0 .1em;white-space:nowrap}
  .rd-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);clip-path:inset(50%);white-space:nowrap}
  /* The panel sits beside the page, which moves over while it is open so that
     nothing it covers is text (data-cite-open on <html>, set by the script).
     Its width gives way on a narrower screen before the reading column does. */
  :root{--rd-w:clamp(17rem,calc(100vw - 42rem),24rem)}
  @media (min-width:900px){[data-cite-open] .page{margin-right:calc(var(--rd-w) + 2rem);padding-right:1rem}}
  .rd-panel{position:fixed;z-index:15;top:var(--ap-top,4.4rem);right:1rem;bottom:1rem;width:var(--rd-w);overflow-y:auto;
    background:var(--paper);border:2px solid var(--rule);border-radius:14px;padding:.9rem 1.1rem 1rem;font-family:var(--sans);box-shadow:0 20px 50px -20px rgba(0,0,0,.45)}
  .rd-panel[hidden]{display:none}
  .rd-phead{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin:0 0 .6rem}
  .rd-ph{font-family:var(--sans);font-size:1rem;font-weight:800;color:var(--petrol);margin:0}
  .rd-ph:focus{outline:none} .rd-ph:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .rd-psrc{margin:0 0 .25rem;color:var(--ink);font-size:.98rem} .rd-psrc cite{font-style:italic;font-weight:600}
  .rd-ppage{margin:0 0 .35rem;color:var(--muted);font-size:.9rem}
  .rd-q{margin:.7rem 0;padding:0 0 0 .8rem;border-left:3px solid var(--accent);color:var(--ink);font-style:normal;font-family:var(--serif);line-height:1.55}
  .rd-q mark{background:#FFF3B0;color:var(--ink);padding:.05em .15em;border-radius:3px}

  .rd-badge{display:flex;flex-wrap:wrap;align-items:center;gap:.2rem .5rem;margin:.8rem 0 0;padding:.35rem .7rem;border:2px solid var(--tone-green-deep);border-radius:12px;background:#fff;color:var(--tone-green-deep);font-size:.88rem;font-weight:700}
  .rd-badge .rd-how{color:var(--ink);font-weight:400}
  .rd-bad{color:var(--warn)}
  .rd-tip{position:fixed;z-index:16;max-width:min(22rem,calc(100vw - 1rem));background:var(--ink);color:#fff;font-family:var(--sans);font-size:.85rem;line-height:1.45;padding:.5rem .7rem;border-radius:10px;pointer-events:none;box-shadow:0 10px 24px -12px rgba(0,0,0,.5)}
  .rd-tip[hidden]{display:none}
  .rd-tip .rd-tw{display:block;margin-top:.2rem;color:#E9E3D8;font-size:.8rem}
  .rd-callout{margin:1.25rem 0;padding:.7rem 1rem .75rem;background:#fff;border:2px solid var(--rule);border-left:6px solid var(--muted);border-radius:0 12px 12px 0}
  .rd-callout.rd-k-diff{border-left:6px dashed var(--tone-warm-deep)}
  .rd-callout.rd-k-law{border-left:6px double var(--tone-teal-deep)}
  .rd-callout.rd-k-opinion{border-left:6px dotted var(--tone-slate-deep)}
  .rd-chead{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin:0 0 .3rem;font-family:var(--sans);font-size:.85rem;font-weight:700}
  .rd-ci,.rd-fi{display:inline-flex;align-items:center;justify-content:center;width:1.5rem;height:1.5rem;border-radius:50%;flex:none;font-size:.95rem;line-height:1;font-weight:700}
  .rd-k-diff .rd-ci,.rd-f-diff .rd-fi{background:var(--tone-warm);color:var(--tone-warm-deep)}
  .rd-k-law .rd-ci,.rd-f-law .rd-fi{background:var(--tone-teal);color:var(--tone-teal-deep)}
  .rd-k-opinion .rd-ci,.rd-f-opinion .rd-fi{background:var(--tone-slate);color:var(--tone-slate-deep)}
  .rd-k-diff .rd-cl{color:var(--tone-warm-deep)} .rd-k-law .rd-cl{color:var(--tone-teal-deep)} .rd-k-opinion .rd-cl{color:var(--tone-slate-deep)}
  .rd-cshow{margin-left:auto}
  .rd-cshow[hidden]{display:none}
  .rd-ctitle{margin:0 0 .35rem;font-weight:700;color:var(--ink)}
  .rd-cb>:last-child{margin-bottom:0}
  .rd-callout[data-state="folded"]{background:var(--paper);padding:.45rem .9rem}
  .rd-callout[data-state="folded"] .rd-ctitle{margin:0;font-weight:600;color:var(--muted)}
  .rd-callout[data-state="lit"].rd-k-diff{box-shadow:0 0 0 3px var(--tone-warm)}
  .rd-callout[data-state="lit"].rd-k-law{box-shadow:0 0 0 3px var(--tone-teal)}
  .rd-callout[data-state="lit"].rd-k-opinion{box-shadow:0 0 0 3px var(--tone-slate)}
  .rd-filter{display:flex;flex-wrap:wrap;align-items:center;gap:.45rem;margin:0 0 1.25rem}
  .rd-filter .rd-fl{margin:0 .2rem 0 0}
  .rd-filter .pill-btn{display:inline-flex;align-items:center;gap:.4rem;padding:.3rem .8rem .3rem .35rem;font-size:.88rem}
  .rd-filter .pill-btn[aria-pressed="true"] .rd-fi{background:#fff}
  .rd-fn{font-weight:600;opacity:.85}

  .rd-notes{display:none}

  @media (max-width:899px){
    /* a bottom sheet: the whole width, the lower part of the screen */
    .rd-panel{top:auto;left:0;right:0;bottom:0;width:auto;max-height:70vh;border-radius:16px 16px 0 0;border-bottom:0;padding:.8rem 1rem calc(1rem + env(safe-area-inset-bottom,0px))}
  }
  /* Printed, the panel is gone and the citations are endnotes at the end of
     the activity (the page on show); a folded callout prints whole. */
  @media print{
    .bar,.ap-menu,.rd-filter,.rd-panel,.rd-tip,.rd-cshow,.toast{display:none!important}
    .ap-frame{display:block}
    .rd-notes{display:block;margin:2rem 0 0;border-top:2px solid var(--rule);padding-top:.5rem;font-size:.9rem}
    .rd-notes li{margin:0 0 .4rem}
    .rd-cb[hidden]{display:block!important}
    .rd-callout{break-inside:avoid;box-shadow:none!important}
    .rd-mark{color:var(--ink);background:none!important;padding:0}

  }
</style>

const isObj=x=>x!==null&&typeof x==="object"&&!Array.isArray(x);
/* `over` laid on top of `base`, two-deep-or-more, without sharing objects with either */
function mergeDeep(base,over){const out={};
  for(const k of Object.keys(base||{})) out[k]=isObj(base[k])?mergeDeep(base[k],{}):base[k];
  for(const k of Object.keys(over||{})){const v=over[k];
    out[k]=isObj(v)?mergeDeep(isObj(out[k])?out[k]:{},v):v;}
  return out;}
function buildTables(){
  T.en=TSRC.en;
  T.fr=mergeDeep(TSRC.en,TSRC.fr);
  T.es=mergeDeep(TSRC.en,TSRC.es);
  T["es-AR"]=mergeDeep(T.es,TSRC["es-AR"]);}
buildTables();
/* every string (or function, or list) a language table holds, by dotted path */
function leafPaths(o,pre,out){out=out||[];
  for(const k of Object.keys(o||{})){const p=pre?pre+"."+k:k;
    if(isObj(o[k])) leafPaths(o[k],p,out);else out.push(p);}
  return out;}
/* What is still to be written for a language: the keys English has and this
   language has not (`missing`), and keys it has that English does not (`extra`,
   almost always a typo). es-AR is a layer of differences, so it has no missing. */
function langParity(l){const en=leafPaths(TSRC.en);const have=new Set(leafPaths(TSRC[l]||{}));
  const enSet=new Set(en);
  return {lang:l,total:en.length,
    missing:l==="es-AR"?[]:en.filter(p=>!have.has(p)),
    extra:[...have].filter(p=>!enSet.has(p))};}

/* ======================= A WIDGET'S SVG, MADE SAFE TO DRAW =======================
   A figure's `svg` is markup that rides in a file somebody was handed, so it
   is a way in for script unless it is cleaned first: an `onerror` on an
   <image> runs the moment the figure is drawn, and a javascript: link runs
   when a region is tapped. sanitizeSvg() parses the text with the browser's
   own HTML parser, in a document that runs nothing, and returns the cleaned
   nodes. Never a string: clean markup parsed a second time can come out as
   something else. Kept: SVG elements and text. Removed with everything inside
   them: any element outside the SVG namespace, and <script>, <foreignObject>
   and the animation elements, which can write a javascript: URL into a link
   after the link was checked. Stripped from what is kept: every on* attribute,
   and any attribute whose value is a javascript: or vbscript: URL (control
   characters and spaces ignored, as a browser ignores them). If anything goes
   wrong it returns nothing, and the figure is blank rather than unsafe. */
const SVG_NS="http://www.w3.org/2000/svg";
const SVG_DROP=new Set(["script","foreignobject","animate","animatecolor","animatemotion",
  "animatetransform","set","discard"]);
const svgAttrBad=a=>/^on/i.test(a.localName)||/(^|:)on/i.test(a.name)
  ||/^(javascript|vbscript):/i.test(String(a.value).replace(/[\u0000- ]/g,""));
function sanitizeSvg(text){
  if(typeof text!=="string"||!text.trim()) return [];
  try{
    const body=new DOMParser().parseFromString(text,"text/html").body;
    const scrub=parent=>{for(const n of [...parent.childNodes]){
      if(n.nodeType===3) continue;
      if(n.nodeType!==1||n.namespaceURI!==SVG_NS||SVG_DROP.has(n.localName.toLowerCase())){n.remove();continue;}
      for(const a of [...n.attributes]) if(svgAttrBad(a)) n.removeAttributeNode(a);
      scrub(n);}};
    scrub(body);
    return [...body.childNodes].map(n=>document.importNode(n,true));
  }catch(e){return [];}}

  const labelToSense=label=>{for(const g of (W.senses||[])) for(const w of (g.words||[]))

/* ======================= ENGINE: card-board =======================
   Cards opened one at a time. Each leads with what is already mapped, then a
   quick way to add something the person already knows, then the questions that
   find a new one — folded away, because a page that opens with questions is a
   form and a page that opens with your own answers is a map.

   Its content is one answer in the store it is given, keyed by field id; the
   widget says which fields each card holds and what to call them. */
let boardOpen=null;

function cardBoard(store,W,keys){
  const C=locBag(W.copy,{});
  const cards=W.cards||[];
  const notes=locBag(W.notes,{});
  /* what the board holds is one answer, under the block's own key, in the store
     it was given: { field: list-or-text, … } */
  const key=keys[0];
  const bag=()=>store[key]&&typeof store[key]==="object"&&!Array.isArray(store[key])?store[key]:(store[key]={});
  const menu=k=>{const own=(W.menus||{})[k];return Array.isArray(own)?own:[];};
  const val=f=>bag()[f];
  const wrap=el("div",{});
  if(boardOpen===null) boardOpen=(cards[0]||{}).id||null;

  const count=c=>((c.lists||[]).reduce((n,l)=>n+((val(l.field)||[]).length),0))
    +((c.prose||[]).filter(pr=>nonEmpty(val(pr.field))).length);
  /* One field is drawn twice on an open card: as what is on the board, and as
     the menu's pills below. A change made in either redraws both, so a picked
     option lands on the board at once and a removed one is no longer pressed. */
  const drawsOf={};const onDraw=(f,fn)=>{(drawsOf[f]=drawsOf[f]||[]).push(fn);};
  const changed=f=>(drawsOf[f]||[]).forEach(fn=>fn());

  /* one mapped list: what is there, and a box to add to it */
  const listBlock=(l,redraw)=>{const box=el("div",{class:"maplist"});
    const chosen=()=>bag()[l.field]||[];
    const chips=el("div",{class:"pills"});
    const draw=()=>{chips.innerHTML="";
      if(!chosen().length){chips.append(el("span",{class:"hint"},C.nothing||""));return;}
      chosen().forEach(o=>chips.append(el("span",{class:"mapchip"},o,
        el("button",{type:"button",class:"x",title:C.remove||"","aria-label":(C.remove||"")+": "+o,
          onclick:()=>{bag()[l.field]=chosen().filter(x=>x!==o);mark();changed(l.field);redraw();}},"×"))));};
    const inp=el("input",{type:"text",class:"field",style:"min-height:0",
      placeholder:C.quick||"","aria-label":tx(l.label,l.field)});
    const add=()=>{const v=inp.value.trim();if(!v) return;
      if(!chosen().includes(v)) bag()[l.field]=[...chosen(),v];
      inp.value="";mark();changed(l.field);redraw();};
    inp.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();add();}});
    onDraw(l.field,draw);draw();
    box.append(el("div",{class:"mlhead"},tx(l.label,l.field)),chips,
      el("div",{style:"display:flex;gap:.4rem;margin:.45rem 0 0"},inp,
        el("button",{type:"button",class:"small",onclick:add},C.add||"+")));
    return box;};

  /* the questions that find a new one, and the menus of the corpus's examples */
  const explore=(c)=>{const d=el("details",{class:"explore"},el("summary",{},C.explore||""));
    const inner=el("div",{class:"inner"});
    inner.append(el("p",{class:"hint"},C.exploreHint||""));
    if(nonEmpty(tx(c.intro,""))) inner.append(el("p",{},tx(c.intro,"")));
    (c.prose||[]).forEach(pr=>{const id="f_"+Math.random().toString(36).slice(2,8);
      const ta=textField(bag(),pr.field,2);ta.id=id;
      inner.append(el("div",{},el("label",{class:"lbl",for:id},tx(pr.label,pr.field),
        nonEmpty(tx(pr.hint,""))?el("span",{class:"hint"},tx(pr.hint,"")):null),ta));});
    (c.lists||[]).forEach(l=>{
      const box=el("div",{class:"qfield"});
      const wrapc=el("div",{class:"pills"});
      const chosen=()=>bag()[l.field]||[];
      const draw=()=>{wrapc.innerHTML="";const opts=menu(l.field);
        [...new Set([...opts,...chosen()])].forEach(o=>{
          const on=chosen().includes(o);
          wrapc.append(el("button",{type:"button",class:"pill-btn","aria-pressed":String(on),onclick:()=>{
            bag()[l.field]=on?chosen().filter(x=>x!==o):[...chosen(),o];mark();changed(l.field);drawCards();}},o));});};
      onDraw(l.field,draw);draw();
      box.append(el("label",{class:"lbl"},tx(l.label,l.field),
        nonEmpty(tx(l.hint,""))?el("span",{class:"hint"},tx(l.hint,"")):null),wrapc);
      inner.append(box);});
    ((notes[c.id])||[]).forEach(n=>inner.append(el("p",{class:"hint"},n)));
    d.append(inner);return d;};

  const cardsRow=el("div",{class:"mapcards",role:"tablist"});
  const openBox=el("div",{class:"mapopen"});
  const drawCards=()=>{cardsRow.innerHTML="";
    cards.forEach(c=>{const on=boardOpen===c.id;const n=count(c);
      cardsRow.append(el("button",{type:"button",class:"mapcard "+c.id,role:"tab","aria-selected":String(on),
        onclick:()=>{boardOpen=on?null:c.id;drawCards();drawOpen();}},
        el("span",{class:"mk"},tx(c.label,c.id)),
        el("span",{class:"md"},tx(c.blurb,"")),
        el("span",{class:"mn"},n?String(n):"—")));});};
  const drawOpen=()=>{openBox.innerHTML="";for(const f in drawsOf) delete drawsOf[f];
    const c=cards.find(x=>x.id===boardOpen);if(!c) return;
    const sec=el("section",{class:"mapsection "+c.id},el("h2",{},tx(c.label,c.id)));
    if(nonEmpty(tx(c.blurb,""))) sec.append(el("p",{class:"aside"},tx(c.blurb,"")));
    sec.append(el("h3",{},C.mapped||""));
    (c.lists||[]).forEach(l=>sec.append(listBlock(l,drawCards)));
    if((c.prose||[]).length){const dl=el("div",{class:"mapprose"});
      const filled=(c.prose||[]).filter(pr=>nonEmpty(val(pr.field)));
      if(!filled.length) dl.append(el("p",{class:"hint"},C.nothing||""));
      filled.forEach(pr=>dl.append(el("div",{class:"mprow"},
        el("span",{class:"r"},tx(pr.label,pr.field)),el("span",{},String(val(pr.field)).trim()))));
      sec.append(dl);}
    sec.append(explore(c));
    openBox.append(sec);};
  drawCards();drawOpen();
  wrap.append(cardsRow,openBox);
  return wrap;}

/* ======================= WHAT THE RENDERER IS =======================
   A renderer, and nothing else. It draws what SPEC.md describes (activities,
   pages, questions, reading, widgets), keeps a reader's answers, saves a file
   and adds a module from the registry. It ships with no activities: there is
   no built-in module and no built-in booklet. Everything a reader sees comes
   from their booklet file. */

/* An empty booklet. This is what the page holds before a file arrives: no
   modules, no widgets, nothing of its own. */
const EMPTY_BOOKLET={booklet:0.2, id:"", version:"", modules:[], widgets:[], raw:{source:""}};

/* ===================== THE REGISTRY =====================
   The renderer's one and only module store: the booklet registry's own list
   (DEFAULT_REGISTRY, one JSON file of entries, each naming the module's file).
   "Add a module" fetches that list fresh every time it opens and a module's
   file fresh every time Add is pressed. Nothing about a module is kept here
   between visits: what a booklet holds of it is part of the booklet. */
let SHELF={};
const shelfList=()=>Object.values(SHELF);
function shelfPut(entry,base){
  if(!entry||typeof entry.id!=="string") return false;
  SHELF[entry.id]={id:entry.id,version:entry.version,title:entry.title,blurb:entry.blurb,
    url:joinUrl(base,entry.file||(entry.id.split("/").pop()+".md"))};
  return true;}
/* Resolve `rel` against `base` the way a browser resolves a link: a relative
   address replaces the last segment of the base, it does not extend it. */
const joinUrl=(base,rel)=>{
  const here=(typeof location!=="undefined"&&location.href)||"http://booklet.invalid/";
  try{return new URL(rel,new URL(String(base),here)).href;}
  catch(e){
    /* No usable URL constructor. Resolve by hand, and mind that an entry may
       name a module somewhere else entirely — an absolute address, or a
       protocol-relative one, replaces the base rather than hanging off it. */
    const r=String(rel||"");
    if(/^[a-z][a-z0-9+.-]*:/i.test(r)||r.startsWith("//")) return r;
    if(r.startsWith("/")) return r;
    return String(base||"").replace(/[?#].*$/,"").replace(/[^/]*$/,"")+r;}};
/* The registry: one JSON file listing the modules on offer. A page load never
   reaches the network on its own; "Add a module" is the one place that asks. */
const DEFAULT_REGISTRY="https://raw.githubusercontent.com/benthepsychologist/booklet-registry/main/registry.json";

async function loadRegistry(url){SHELF={};
  try{
    const r=await fetch(url,{cache:"no-cache"});if(!r.ok) return false;
    const data=await r.json();
    if(!data||!Array.isArray(data.modules)) return false;
    data.modules.forEach(e=>shelfPut(e,url));
    return true;
  }catch(e){return false;}}

/* the booklet in force */
let TPL = EMPTY_BOOKLET;
/* A template's own words, as a plain string or as {en:…, fr:…}; anything it does
   not name takes the fallback. */
const tx=(v,fallback)=>{if(v==null) return fallback;
  if(typeof v==="string") return v;
  if(typeof v==="object"){const r=pickLoc(v);return r===undefined?fallback:r;}
  return fallback;};
/* ---- languages: one lookup chain for every localised value ----
   A booklet may DECLARE the languages it offers (`languages`, a list of tags, in
   its front matter or its template). Declared, the chain never leaves them: a
   Spanish-only booklet never reads an English or French word, because no slot is
   ever asked for one. Undeclared, it is what it always was, with Spanish added:
   the selected language, its primary subtag (es-AR → es), English, French, and
   only then any language the value happens to carry. */
const primaryOf=l=>String(l||"").split("-")[0].toLowerCase();
/* es-ar → es-AR, ES → es: the one spelling every table and slot uses */
const normTag=x=>{const p=String(x||"").trim().split("-");if(!/^[A-Za-z]{2,3}$/.test(p[0])) return "";
  return [p[0].toLowerCase(),...p.slice(1).map(q=>q.length===2?q.toUpperCase():q)].join("-");};
/* the interface table a tag reads from: itself, else its primary language, else none */
const tableTag=x=>{const t=normTag(x);return T[t]?t:(T[primaryOf(t)]?primaryOf(t):"");};
const LANG_NAMES={en:"English",es:"Español","es-AR":"Español (Argentina)",fr:"Français"};
function declaredLangs(){const d=TPL&&TPL.languages;
  return Array.isArray(d)?[...new Set(d.map(normTag).filter(Boolean))]:[];}
function langChain(l,open){const out=[];const add=x=>{if(x&&!out.includes(x)) out.push(x);};
  l=normTag(l)||lang;add(l);add(primaryOf(l));
  const d=open?[]:declaredLangs();
  if(d.length){d.forEach(x=>{add(x);add(primaryOf(x));});return out;}
  add("en");add("fr");return out;}
const isText=x=>typeof x==="string"&&x!=="";
const isBag=x=>x!==null&&typeof x==="object"&&!Array.isArray(x)&&Object.keys(x).length>0;
/* Every language a localised slot holds a value in, in the order a reader tries
   them: the lookup chain, then (when the booklet declares no languages) any
   other tag the slot carries. `ok` says what counts as a value (text by
   default). `open` ignores the booklet's declaration, for reading files, where
   every language written down is worth recognising. */
const LOC_TAG=/^[a-z]{2,3}(-[A-Za-z0-9]{2,8})*$/;
function locKeys(v,ok,l,open){
  if(v===null||typeof v!=="object"||Array.isArray(v)) return [];
  ok=ok||isText;const out=[];const add=k=>{if(!out.includes(k)&&ok(v[k])) out.push(k);};
  langChain(l,open).forEach(add);
  if(open||!declaredLangs().length) Object.keys(v).filter(k=>LOC_TAG.test(k)).forEach(add);
  return out;}
/* The value a localised slot holds for a language, or undefined. */
function pickLoc(v,ok,l,open){const k=locKeys(v,ok,l,open)[0];return k===undefined?undefined:v[k];}
/* A whole object of wording (a widget's or module's `copy`), or the fallback.
   It is read word by word down the chain: a Spanish set of words that lacks
   one takes that one from the next language, rather than leaving it blank. */
const locBag=(v,fallback)=>{const ks=locKeys(v,isBag);if(!ks.length) return fallback;
  return ks.length===1?v[ks[0]]:Object.assign({},...ks.slice().reverse().map(k=>v[k]));};
function offeredLangs(){
  const d=[...new Set(declaredLangs().map(tableTag).filter(Boolean))];
  return d.length?d:["en","es","fr"];}
function chooseLang(base){if(primaryOf(lang)===base) return lang;
  return offeredLangs().find(x=>primaryOf(x)===base)||tableTag(base)||lang;}
/* ---- the reader's language: this browser's choice, never a booklet's ----
   The language a reader picks (the header's EN / ES / FR) is kept in this
   browser under a key of its own, apart from every booklet's saved data. So it
   holds on "Your booklets" and in every booklet on this origin, and a reload
   keeps it whether or not anything was edited since.
   Wherever the booklet in force offers it, it wins over the language that
   booklet was saved in: a booklet's own `lang` is only the fallback, for a
   reader who has never chosen, or a booklet that does not offer their choice (a
   single-language booklet always reads in its one language). A choice of a
   language (es) takes the booklet's own variant of it (es-AR), exactly as the
   ES button does; a variant (es-AR) is recorded only when the reader picked it
   over another variant the booklet offered. Every access is guarded, and with
   storage off the choice holds for the visit. */
const LANG_PREF_KEY="booklet.ui.lang";
let langPrefMem=null;
function langPref(){let v=null;try{v=localStorage.getItem(LANG_PREF_KEY);}catch(e){}
  if(v==null) v=langPrefMem;v=normTag(v);return v&&T[v]?v:null;}
function setLangPref(v){v=normTag(v);if(!v||!T[v]) return;langPrefMem=v;
  try{localStorage.setItem(LANG_PREF_KEY,v);}catch(e){}}
function prefLang(){const p=langPref();if(!p) return null;
  if(view===LIB_VIEW) return p;
  const off=offeredLangs(),declared=declaredLangs().length>0;
  const ok=x=>off.includes(x)||(!declared&&!!T[x]);
  if(declared&&off.includes(p)) return p;
  if(ok(p)&&p!==primaryOf(p)) return p;
  const base=primaryOf(p);
  if(primaryOf(lang)===base&&ok(lang)) return lang;
  return off.find(x=>primaryOf(x)===base)||null;}
function pickLang(l){lang=l;const p=langPref();
  if(offeredLangs().filter(x=>primaryOf(x)===primaryOf(l)).length>1) setLangPref(l);
  else if(!p||primaryOf(p)!==primaryOf(l)) setLangPref(primaryOf(l));
  render();}
/* The header toggle, as the booklet in force allows it. Called once, at the end of
   renderBar. One language offered means no toggle and no switching at all; more

  if(mod.activities!=null&&!(Array.isArray(mod.activities)&&mod.activities.every(a=>a&&typeof a==="object"))) return false;
  const acts=modesOf(mod),ids=acts.map(a=>a.id);
  return acts.length>0&&acts.every(a=>typeof a.id==="string"&&kindOk(a.kind))&&new Set(ids).size===ids.length;}
/* every module carried by a file, whether or not its booklet is adopted */
const modulesIn=t=>((t&&t.modules)||[]).filter(moduleOk);

function applyParsed(R,mode){const st=R.S;
  /* The design travels with the file it came from, so replacing the contents
     replaces the booklet. What happens to the design is reported as it
     happened (the message below): Replace takes the file's; Add keeps this
     booklet's and brings in only the activities it lacks, so the entries it
     adds have somewhere to show. */
  const design={replaced:false,added:[],refused:[]};
  if(mode==="replace"&&templateOk(R.template)){adoptTemplate(R.template);design.replaced=true;}
  else if(mode==="replace") modulesIn(R.template).forEach(m=>{if(!allModules().some(x=>x.id===m.id)&&addModule(m)) design.added.push(m);});
  else if(R.template) design.added=addMissingModules(R.template,design.refused);
  /* every activity's draft, keyed by activity id (see draftsIn) */
  const others=draftsIn((R.drafts||{}).activities);
  if(mode==="replace"){S=st;D={custom:others};}
  else{
    /* kept entries, by the same rule: one per date and time */
    S.entries=S.entries||{};
    for(const [id,items] of Object.entries(st.entries||{})){
      if(!Array.isArray(items)||id==="__proto__"||id==="constructor"||id==="prototype") continue;
      const mine=Array.isArray(S.entries[id])?S.entries[id]:(S.entries[id]=[]);
      const seenE=new Set(mine.filter(e=>e&&e.ts).map(e=>minuteKey(e.ts)));
      items.forEach(e=>{if(e&&e.ts&&!seenE.has(minuteKey(e.ts))){seenE.add(minuteKey(e.ts));mine.push(e);}});}
    /* answers and drafts: what is already here is kept, and the file's fills in only where there is nothing */
    S.answers=S.answers||{};
    for(const [k,v] of Object.entries(st.answers||{})) if(k!=="__proto__"&&!holdsSomething(S.answers[k])) S.answers[k]=v;
    Object.entries(others).forEach(([id,d])=>{
      const mine=D.custom&&Object.prototype.hasOwnProperty.call(D.custom,id)?D.custom[id]:null;
      if(!holdsSomething(mine)){D.custom=D.custom||{};D.custom[id]=d;}});}
  if(R.lang&&tableTag(R.lang)) lang=tableTag(R.lang);
  dirty=false;unsavedEntries=0;openChip={};
  const t=T[lang].ui;const kept=Object.values(st.entries||{}).reduce((n,a)=>n+(Array.isArray(a)?a.length:0),0);
  let msg=t.loadSummary(kept);
  if(design.replaced) msg+="\n"+t.loadBooklet(designName(R.template));
  else if(design.added.length) msg+="\n"+t.loadGained(design.added.map(m=>tx(m.title,m.id)).join(", "));
  else if(templateOk(R.template)) msg+="\n"+t.loadKept(designName(R.template),t.mergeReplace);
  const unread=[...R.unread,...design.refused];
  if(unread.length) msg+="\n"+t.loadUnread(unread.length)+"\n"+unread.slice(0,6).map(x=>"• "+x).join("\n")+(unread.length>6?"\n…":"");
  return msg;}
/* What a booklet design is called in a message: its own title, else the names
   of its first activities, else its id. */
function designName(t){const d=describeBooklet(t,null);const n=tx(d.title,"");
  if(typeof n==="string"&&nonEmpty(n)) return n.trim();
  const p=d.parts.map(x=>tx(x,"")).filter(x=>typeof x==="string"&&nonEmpty(x));
  return p.length?p.join(", "):String((t&&t.id)||"");}
function addMissingModules(t,refused){const added=[];
  const fileW=(t.widgets||[]).filter(w=>w&&typeof w.id==="string");
  for(const m of modulesIn(t)){if(allModules().some(x=>x.id===m.id)) continue;
    const why=refusalOf(m);if(why){refused.push(why);continue;}
    const need=modesOf(m).flatMap(allBlocksOf).map(b=>typeof b.widget==="string"?fileW.find(w=>w.id===b.widget):null);
    [...new Set(need)].filter(w=>w&&!widgetOf(w.id)).forEach(addWidget);
    if(addModule(m)) added.push(m);}
  return added;}

/* ======================= WIRING ======================= */
let pending=null;
const veilLoad=document.getElementById("veilLoad"),veilMerge=document.getElementById("veilMerge"),veilClear=document.getElementById("veilClear"),dropVeil=document.getElementById("dropVeil");
document.getElementById("btnHome").addEventListener("click",homeButton);
document.querySelectorAll(".lang button").forEach(b=>b.addEventListener("click",()=>pickLang(chooseLang(b.dataset.lang))));
document.getElementById("btnExport").addEventListener("click",openExport);
function openLoad(){const m=document.getElementById("loadMsg");m.textContent="";m.className="msg";document.getElementById("pasteIn").value="";document.getElementById("fileIn").value="";veilLoad.setAttribute("open","");}
document.getElementById("btnLoad").addEventListener("click",openLoad);
document.getElementById("loadCancel").addEventListener("click",()=>veilLoad.removeAttribute("open"));
function readFileInto(file,cb){if(!file) return;const r=new FileReader();r.onload=()=>cb(String(r.result||""));r.readAsText(file);}
document.getElementById("fileIn").addEventListener("change",e=>readFileInto(e.target.files[0],txt=>{document.getElementById("pasteIn").value=txt;}));

function addModuleFromText(text){
  const msg=document.getElementById("addModMsg");
  const problems=moduleTextProblems(text);
  if(problems.length){msg.className="msg err";msg.textContent=problems.join(" ");return false;}
  const R=parseFile(text);
  /* the same "nothing to lose" test designAtStake uses for a loaded file:
     an untouched booklet may become this file outright */
  const empty=!allModules().length&&!TPL.customized;
  if(empty&&templateOk(R.template)){applyParsed(R,"replace");}
  else{const r=addModuleText(text);
    if(!r.ok){msg.className="msg err";msg.textContent=r.problems.join(" ");return false;}}
  veilAddModule.removeAttribute("open");saveLocal();render();
  toast(T[lang].booklet.added(tx((R.template.modules[0]||{}).title,"")));
  return true;}
/* the text behind a registry entry, fetched fresh: an entry only ever carries a
   URL, never the text itself */
async function shelfText(id){const L=SHELF[id];if(!L) return null;
  if(!L.url) return null;
  try{const r=await fetch(L.url,{cache:"no-cache"});if(!r.ok) return null;return await r.text();}catch(e){return null;}}
function renderAddModuleList(){const box=document.getElementById("addModList");box.innerHTML="";
  const items=shelfList();
  if(!items.length){box.append(el("p",{class:"hint"},T[lang].booklet.noShelf));return;}
  items.forEach(L=>{
    const btn=el("button",{type:"button",class:"small primary"},T[lang].ui.addModAdd);
    btn.addEventListener("click",async()=>{btn.disabled=true;
      const msg=document.getElementById("addModMsg");msg.className="msg";msg.textContent="";
      const text=await shelfText(L.id);
      if(!text){msg.className="msg err";msg.textContent=T[lang].booklet.addFailed;btn.disabled=false;return;}
      if(!addModuleFromText(text)) btn.disabled=false;});
    box.append(el("div",{class:"bkrow"},
      el("span",{class:"bkname"},tx(L.title,L.id)+(tx(L.blurb,"")?" — "+tx(L.blurb,""):"")),
      el("span",{class:"bkacts"},btn)));});}
async function openAddModule(){const t=T[lang].ui;
  document.getElementById("addModTitle").textContent=t.addModTitle;
  document.getElementById("addModHelp").textContent=t.addModHelp;
  document.getElementById("addModCancel").textContent=t.addModCancel;
  const msg=document.getElementById("addModMsg");msg.textContent="";msg.className="msg";
  const box=document.getElementById("addModList");
  box.innerHTML="";
  veilAddModule.setAttribute("open","");
  /* the registry's list, fetched fresh on every opening and never kept */
  await loadRegistry(DEFAULT_REGISTRY);
  renderAddModuleList();}
const veilAddModule=document.getElementById("veilAddModule");
document.getElementById("addModCancel").addEventListener("click",()=>veilAddModule.removeAttribute("open"));
function loadText(text){const t=T[lang].ui;const msg=document.getElementById("loadMsg");
  const R=parseFile(text||"");
  if(!R.ok){if(veilLoad.hasAttribute("open")){msg.className="msg err";msg.textContent=t.loadErr;} else toast(t.loadErr);return;}
  veilLoad.removeAttribute("open");
  /* On "Your booklets" a file is always a booklet of its own. It never merges
     into another one; inside a booklet, Load offers add-or-replace. */
  if(view===LIB_VIEW){const e=addEntry({from:"file"});openBooklet(e.id);finishLoad(R,"replace");return;}
  if(sessionHasContent()) return askMerge(R,"entries");
  if(designAtStake(R)) return askMerge(R,"design");
  finishLoad(R,"replace");}
function designAtStake(R){const t=R&&R.template;
  if(!templateOk(t)) return false;
  const here=allModules();
  if(!here.length&&!TPL.customized) return false;
  const theirs=new Set((t.modules||[]).map(m=>m&&m.id));
  return !(TPL.id&&t.id===TPL.id&&here.every(m=>theirs.has(m.id))&&!dirty);}
let mergeWhy="entries";
function askMerge(R,why){pending=R;mergeWhy=why;mergeText();veilMerge.setAttribute("open","");}
/* the dialog says what it is asking about: entries already here, or a design */
function mergeText(){const t=T[lang].ui;const d=!!pending&&mergeWhy==="design";
  document.getElementById("mergeTitle").textContent=d?t.mergeDesignTitle:t.mergeTitle;
  document.getElementById("mergeHelp").textContent=d?t.mergeDesignHelp(designName(pending.template)):t.mergeHelp;}
/* A module file (modules/*.md: front matter `module:`, one ```json module
   block, and prose for people, such as "Adding it to a booklet") is one activity
   to add, never a booklet to open. Read as a booklet it was adopted as a whole
   design, its how-to heading was reported as a part of the file that could not
   be read, and inside a booklet Replace would have swapped the booklet for that
   one activity while Add left it out. Now it is added, as "Add an activity"
   does: on "Your booklets" to a new booklet of its own, inside a booklet to that
   booklet, with nothing already there replaced. A module file whose module is
   refused is reported as such, and no empty booklet is left behind. Anything
   else, including a module block pasted without its file, is read as a
   booklet, as before. moduleFileOf returns the module as written, or null. */
document.getElementById("loadGo").addEventListener("click",()=>loadText(document.getElementById("pasteIn").value));
function finishLoad(R,mode){const mine=!!langPref();
  const summary=applyParsed(mine?{...R,lang:null}:R,mode);
  if(mine&&R.lang&&tableTag(R.lang)) lang=tableTag(R.lang);
  pending=null;saveLocal();veilMerge.removeAttribute("open");
  if(view==="home") render(); else go("home");
  const msg=el("div",{class:"msg ok",style:"white-space:pre-wrap;margin:0 0 1rem"},summary);document.getElementById("main").prepend(msg);toast(T[lang].ui.loadOk);}
document.getElementById("mergeCancel").addEventListener("click",()=>{pending=null;veilMerge.removeAttribute("open");});
document.getElementById("mergeAdd").addEventListener("click",()=>{if(pending) finishLoad(pending,"add");});
document.getElementById("mergeReplace").addEventListener("click",()=>{if(pending) finishLoad(pending,"replace");});
document.getElementById("clearCancel").addEventListener("click",()=>veilClear.removeAttribute("open"));
document.getElementById("clearGo").addEventListener("click",()=>{S=emptyS();D=emptyD();dirty=false;unsavedEntries=0;openChip={};clearLocal();veilClear.removeAttribute("open");go("home");});
const veilExport=document.getElementById("veilExport");
[veilLoad,veilMerge,veilClear,veilExport].forEach(v=>v.addEventListener("click",e=>{if(e.target===v) v.removeAttribute("open");}));
document.addEventListener("keydown",e=>{if(e.key==="Escape"){[veilLoad,veilMerge,veilClear,veilExport].forEach(v=>v.removeAttribute("open"));}});
let dragDepth=0;
window.addEventListener("dragenter",e=>{if([...(e.dataTransfer?.types||[])].includes("Files")){e.preventDefault();dragDepth++;dropVeil.classList.add("show");}});
window.addEventListener("dragover",e=>{if([...(e.dataTransfer?.types||[])].includes("Files")) e.preventDefault();});
window.addEventListener("dragleave",e=>{if(dragDepth>0) dragDepth--;if(dragDepth===0) dropVeil.classList.remove("show");});
window.addEventListener("drop",e=>{e.preventDefault();dragDepth=0;dropVeil.classList.remove("show");const f=e.dataTransfer?.files?.[0];if(f) readFileInto(f,loadText);});
window.addEventListener("beforeunload",e=>{if(dirty||unsavedEntries>0){e.preventDefault();e.returnValue=T[lang].ui.leaving;}});
/* A save still waiting out its 400ms is written the moment the page is hidden
   or left: on a phone those are the last events a page reliably gets. */
window.addEventListener("pagehide",flushSave);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden") flushSave();});


/* ======================= BOOT ======================= */
/* "Your booklets" first, unless the address names a booklet. */
const restoredFromBrowser=bootLibrary();

render();
if(restoredFromBrowser) setTimeout(()=>toast(T[lang].ui.restored),400);
else if(!storageOk) setTimeout(()=>toast(T[lang].ui.storageOff),400);
window.addEventListener("hashchange",followRoute);
/* another tab added or removed a booklet: the list redraws */
window.addEventListener("storage",e=>{if(view===LIB_VIEW&&(!e||!e.key||String(e.key).endsWith(LIB_KEY))) render();});
</script>
</body>
